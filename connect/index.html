h d="m3 17.5 9 4.5 9-4.5"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-logistics" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle style="stroke:var(--icon-accent,currentColor)" cx="12" cy="10" r="2.5"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></symbol><symbol id="i-materials" viewBox="0 0 24 24"><path d="m12 4 9 4.5-9 4.5-9-4.5z"/><path style="stroke:var(--icon-accent,currentColor)" d="m3 13 9 4.5 9-4.5"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-portfolio" viewBox="0 0 24 24"><path d="M3 8h18v12H3z"/><path d="M9 8V5h6v3"/><path style="stroke:var(--icon-accent,currentColor)" d="M3 13h18"/></symbol><symbol id="i-property" viewBox="0 0 24 24"><path d="M6 21V3h12v18"/><path d="M4 21h16"/><path d="M10 7h1.5M13 7h1.5M10 11h1.5M13 11h1.5M10 15h1.5M13 15h1.5"/><path style="stroke:var(--icon-accent,currentColor)" d="M11 21v-3h2v3"/></symbol><symbol id="i-recovery" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path style="stroke:var(--icon-accent,currentColor)" d="M20 3v5h-5"/></symbol><symbol id="i-reporting" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/><path style="stroke:var(--icon-accent,currentColor)" d="M3 20h18"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v4a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4"/></symbol><symbol id="i-scale" viewBox="0 0 24 24"><path d="M3 20h18M12 4v16"/><path d="M6 8h12M6 8l-3 6h6zM18 8l-3 6h6z"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol><symbol id="i-sites" viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14"/><path d="M3 21h18"/><path style="stroke:var(--icon-accent,currentColor)" d="M10 21v-5h4v5"/></symbol><symbol id="i-sort" viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M9 18h6"/></symbol><symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path style="stroke:var(--icon-accent,currentColor)" d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol><symbol id="i-technology" viewBox="0 0 24 24"><path d="M3 5h18v12H3z"/><path style="stroke:var(--icon-accent,currentColor)" d="M8 21h8M12 17v4"/></symbol><symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h11v10H2z"/><path d="M13 10h5l3 3v3h-8z"/><circle cx="6" cy="18" r="1.75"/><circle cx="17" cy="18" r="1.75"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5"/><path style="stroke:var(--icon-accent,currentColor)" d="M4 20h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="i-warehouse" viewBox="0 0 24 24"><path d="M3 21V9l9-5 9 5v12"/><path d="M2 21h20"/><path style="stroke:var(--icon-accent,currentColor)" d="M7 21v-7h10v7M7 17h10"/></symbol> </defs> </svg>
<div id="app"><noscript style="display:block;padding:40px;color:#fff">This app needs JavaScript switched on.</noscript></div>
<script>
/* ==========================================================================
   Connect Platform Kit
   The RG Connect client platform, pulled out as a re-brandable, standalone
   app. One kit, many versions: each version is a single app.js that calls
   Kit.boot({...}) and registers its pages with Kit.route().
   No frameworks, no build step at runtime, no network calls.
   ========================================================================== */
(function () {
  'use strict';

  /* ---------- formatting ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n, d = 0) => (n == null || !isFinite(n) ? '—' : Number(n).toLocaleString('en-AU', { minimumFractionDigits: d, maximumFractionDigits: d }));
  const money = (n, d = 0) => (n == null || !isFinite(n) ? '—' : (n < 0 ? '−$' : '$') + num(Math.abs(n), d));
  const pct = (n, d = 0) => (n == null || !isFinite(n) ? '—' : num(n * 100, d) + '%');
  const signed = (n, d = 0, unit = '') => (n == null || !isFinite(n) ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '±') + num(Math.abs(n), d) + unit);
  const icon = (n, s = 16, style = '') => `<svg class="icon" width="${s}" height="${s}" style="width:${s}px;height:${s}px;${style}" aria-hidden="true" focusable="false"><use href="#i-${n}"></use></svg>`;
  const initials = (name) => String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

  /* seeded random — demo data stays identical on every load */
  function rng(seed) {
    let h = 1779033703 ^ String(seed).length;
    for (const ch of String(seed)) { h = Math.imul(h ^ ch.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
      return ((h ^= h >>> 16) >>> 0) / 4294967296;
    };
  }

  /* ---------- storage (per browser; never required for the page to work) ---------- */
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } },
    del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
  };

  /* ---------- components (all return HTML strings) ---------- */
  const C = {};

  C.demo = (label) => `<span class="rgc-demo" title="Illustrative figures for demonstration only">${esc(label || Kit.cfg.demo?.badge || 'Demonstration data')}</span>`;

  C.btn = (label, o = {}) => {
    const cls = `rgc-btn${o.primary ? ' rgc-btn--primary' : ''}${o.ghost ? ' rgc-btn--ghost' : ''}${o.sm ? ' rgc-btn--sm' : ''}${o.cls ? ' ' + o.cls : ''}`;
    const inner = `${o.icon ? icon(o.icon, 15) : ''}${esc(label)}${o.after ? icon(o.after, 13) : ''}`;
    const attrs = Object.entries(o.data || {}).map(([k, v]) => ` data-${k}="${esc(v)}"`).join('') + (o.title ? ` title="${esc(o.title)}"` : '');
    if (o.href) return `<a class="${cls}" href="${esc(o.href)}"${o.newtab ? ' target="_blank" rel="noopener"' : ''}${attrs}>${inner}</a>`;
    return `<button type="button" class="${cls}"${o.action ? ` data-action="${esc(o.action)}"` : ''}${o.disabled ? ' disabled' : ''}${attrs}>${inner}</button>`;
  };

  C.seg = (name, options, active) => `<span class="rgc-seg" role="group" data-seg="${esc(name)}">${options
    .map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" data-value="${esc(v)}" aria-pressed="${String(v) === String(active)}">${esc(l)}</button>`; })
    .join('')}</span>`;

  C.select = (name, options, active, label) => `<label class="kit-select">${label ? `<span>${esc(label)}</span>` : ''}<select class="rgc-input" data-select="${esc(name)}">${options
    .map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(active) ? ' selected' : ''}>${esc(l)}</option>`; })
    .join('')}</select></label>`;

  C.pill = (status, label) => {
    const s = String(status || '').toLowerCase().replace(/\s+/g, '-');
    const map = { done: 'completed', complete: 'completed', completed: 'completed', collected: 'completed', paid: 'completed', issued: 'completed', current: 'completed', active: 'completed', ok: 'completed',
      reported: 'reported', scheduled: 'scheduled', booked: 'scheduled', today: 'in-progress', 'in-progress': 'in-progress', live: 'in-progress',
      requested: 'requested', pending: 'requested', draft: 'requested', due: 'requested', upcoming: 'requested', open: 'requested' };
    const warn = ['cancelled', 'overdue', 'expired', 'expiring', 'issue', 'left', 'missed', 'rejected', 'at-risk', 'action'];
    const cls = warn.includes(s) ? 'kit-pill--warn' : 'rgc-pill--' + (map[s] || 'scheduled');
    return `<span class="rgc-pill ${cls}">${esc(label || status)}</span>`;
  };

  C.kpis = (items, cols) => `<div class="rgc-kpis kit-kpis"${cols ? ` style="--kpi-cols:${cols}"` : ''}>${items.map((k) => `
    <div class="rgc-panel rgc-kpi${k.href ? ' kit-link' : ''}"${k.href ? ` data-href="${esc(k.href)}"` : ''}>
      <span class="rgc-kpi__label">${esc(k.label)}</span>
      <span class="rgc-kpi__value"${k.green ? ' style="color:var(--app-green-ink)"' : ''}>${k.value}${k.unit ? `<small>${esc(k.unit)}</small>` : ''}</span>
      <div class="rgc-kpi__foot"><span>${k.delta != null ? `<b class="rgc-kpi__delta${k.down ? ' is-down' : ''}">${esc(k.delta)}</b> ` : ''}${k.foot || ''}</span>${k.spark ? `<span style="width:96px;height:26px;flex:none">${C.spark(k.spark)}</span>` : k.right ? `<span>${k.right}</span>` : ''}</div>
    </div>`).join('')}</div>`;

  C.spark = (vals) => {
    if (!vals || vals.length < 2) return '';
    const mx = Math.max(...vals), mn = Math.min(...vals), r = mx - mn || 1;
    const pts = vals.map((v, i) => `${((i / (vals.length - 1)) * 120).toFixed(1)},${(30 - ((v - mn) / r) * 28 - 1).toFixed(1)}`);
    return `<svg class="rgc-spark" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="M${pts.join(' L')} L120,32 L0,32 Z"></path><path d="M${pts.join(' L')}"></path></svg>`;
  };

  C.panel = (o) => `<section class="rgc-panel${o.cls ? ' ' + o.cls : ''}"${o.id ? ` id="${esc(o.id)}"` : ''}${o.style ? ` style="${o.style}"` : ''}>
    ${o.title ? `<div class="rgc-panel__head"><span class="rgc-panel__title">${esc(o.title)}</span>${o.meta ? `<span class="rgc-panel__meta">${o.meta}</span>` : ''}${o.tools ? `<span class="kit-panel__tools">${o.tools}</span>` : ''}${o.link ? `<a class="rgc-panel__link" href="${esc(o.link.href)}">${esc(o.link.label)} ${icon('arrow-right', 13)}</a>` : ''}</div>` : ''}
    <div class="rgc-panel__body${o.flush ? ' rgc-panel__body--flush' : ''}${o.list ? ' rgc-list' : ''}"${o.bodyStyle ? ` style="${o.bodyStyle}"` : ''}>${o.body || ''}</div>
  </section>`;

  C.grid = (cols, ...children) => `<div class="kit-grid" style="--cols:${cols}">${children.join('')}</div>`;

  /* table: cols = [{k, label, num, render(row), dim, strong, width}] */
  C.table = (cols, rows, o = {}) => {
    if (!rows.length) return `<div class="kit-empty">${o.empty || 'Nothing to show.'}</div>`;
    const cell = (c, r) => {
      const v = c.render ? c.render(r) : esc(r[c.k]);
      const cls = [c.num && 'num', c.strong && 'strong', c.dim && 'dim', c.wrap && 'kit-wrap'].filter(Boolean).join(' ');
      return `<td${cls ? ` class="${cls}"` : ''}>${v ?? ''}</td>`;
    };
    const rowAttr = (r) => (o.rowHref ? ` class="kit-link" data-href="${esc(o.rowHref(r))}"` : '') + (o.rowAttr ? ' ' + o.rowAttr(r) : '');
    return `<div class="kit-tablewrap"><table class="rgc-table${o.cls ? ' ' + o.cls : ''}">
      <thead><tr>${cols.map((c) => `<th${c.num ? ' class="num"' : ''}${c.width ? ` style="width:${c.width}"` : ''}>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr${rowAttr(r)}>${cols.map((c) => cell(c, r)).join('')}</tr>`).join('')}</tbody>
      ${o.foot ? `<tfoot><tr>${cols.map((c, i) => `<td${c.num ? ' class="num"' : ''}>${o.foot[i] ?? ''}</td>`).join('')}</tr></tfoot>` : ''}
    </table></div>`;
  };

  C.row = (o) => `<${o.href ? `a href="${esc(o.href)}"` : 'div'} class="rgc-row"${o.cols ? ` style="grid-template-columns:${o.cols}"` : ''}>
    ${o.icon ? `<span class="rgc-row__ic${o.green ? ' rgc-row__ic--green' : ''}">${icon(o.icon, 15)}</span>` : ''}
    <span><div class="rgc-row__t">${o.t}</div>${o.d ? `<div class="rgc-row__d">${o.d}</div>` : ''}</span>
    ${o.r != null ? `<span class="rgc-row__r">${o.r}</span>` : ''}
  </${o.href ? 'a' : 'div'}>`;

  C.stat = (l, v, unit, green) => `<div class="rgc-stat"><span class="rgc-stat__l">${esc(l)}</span><span class="rgc-stat__v"${green ? ' style="color:var(--app-green-ink)"' : ''}>${v}${unit ? `<small> ${esc(unit)}</small>` : ''}</span></div>`;
  C.stats = (items, cols) => `<div class="kit-stats" style="--cols:${cols || items.length}">${items.map((s) => C.stat(s[0], s[1], s[2], s[3])).join('')}</div>`;

  /* horizontal bars: [{label, value, display, tone:'ink'|'grey'}] */
  C.bars = (items, o = {}) => {
    const mx = o.max || Math.max(...items.map((i) => i.value), 1);
    return `<div class="rgc-bars"${o.cols ? ` style="grid-template-columns:repeat(${o.cols},minmax(0,1fr));column-gap:32px"` : ''}>${items.map((i) => `
      <div class="rgc-bar"><span class="rgc-bar__l" title="${esc(i.label)}">${esc(i.label)}</span><span class="rgc-bar__t"><span class="rgc-bar__f${i.tone ? ' rgc-bar__f--' + i.tone : ''}" style="width:${Math.max(0, Math.min(100, (i.value / mx) * 100))}%"></span></span><span class="rgc-bar__v">${i.display ?? num(i.value)}</span></div>`).join('')}</div>`;
  };

  /* ranked list with bar + two values: [{t, s, value, v1, v2, href}] */
  C.rank = (items, o = {}) => {
    const mx = Math.max(...items.map((i) => i.value), 1);
    const cols = o.cols || '1.3fr 1fr 70px 60px';
    return items.map((i, n) => `<${i.href ? `a href="${esc(i.href)}"` : 'div'} class="rgc-rank" style="grid-template-columns:${o.numbered ? '24px ' : ''}${cols}">
      ${o.numbered ? `<span class="rgc-rank__n">${String(n + 1).padStart(2, '0')}</span>` : ''}
      <span><div class="rgc-rank__t">${esc(i.t)}</div>${i.s ? `<div class="rgc-rank__s">${i.s}</div>` : ''}</span>
      <span class="rgc-rank__bar"><i style="width:${(i.value / mx) * 100}%${i.grey ? ';background:var(--c-graphite)' : ''}"></i></span>
      <span class="rgc-rank__v">${i.v1 ?? ''}</span>
      <span class="rgc-rank__v"${i.v2green === false ? '' : ' style="color:var(--app-green-ink)"'}>${i.v2 ?? ''}</span>
    </${i.href ? 'a' : 'div'}>`).join('');
  };

  /* split bar: parts [{label, value, display, tone:'reuse'|'recycling'|'processed'|'landfill'}] */
  C.split = (parts, o = {}) => {
    const tot = parts.reduce((s, p) => s + p.value, 0) || 1;
    const sw = { reuse: 'var(--app-green-ink)', recycling: 'var(--app-green)', processed: 'var(--c-graphite)', landfill: 'rgba(244,244,242,.22)' };
    return `<div class="rgc-split">
      <div class="rgc-split__bar" role="img" aria-label="${esc(parts.map((p) => `${p.label} ${Math.round((p.value / tot) * 100)}%`).join(', '))}">${parts
        .map((p) => `<span class="rgc-split__seg rgc-split__seg--${p.tone}" style="width:${(p.value / tot) * 100}%"></span>`).join('')}</div>
      <div class="rgc-split__legend" style="grid-template-columns:repeat(${o.cols || 2},minmax(0,1fr))">${parts
        .map((p) => `<div class="rgc-split__item"><i style="background:${sw[p.tone]}"></i>${esc(p.label)}<span>${p.display ?? num(p.value, 1)}</span><b>${Math.round((p.value / tot) * 100)}%</b></div>`).join('')}</div>
    </div>`;
  };

  /* column chart: labels[], series [{name, values[], tone:'green'|'grey'|'ink'}] */
  C.chart = (labels, series, o = {}) => {
    const mx = o.max || niceMax(Math.max(...series.flatMap((s) => s.values), 1));
    const unit = o.unit || '';
    const ticks = [1, 0.75, 0.5, 0.25, 0].map((f) => num(mx * f, mx < 10 ? 1 : 0) + unit);
    const cls = { green: ' rgc-chart__bar--green', ink: ' rgc-chart__bar--ink', grey: '' };
    return `<div class="kit-chart" style="height:${o.height || 220}px">
      ${series.length > 1 || o.key ? `<div class="rgc-chart__key">${series.map((s) => `<span><i style="background:${s.tone === 'grey' ? 'var(--c-graphite)' : s.tone === 'ink' ? 'var(--app-green-ink)' : 'var(--app-green)'}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}
      <div class="rgc-chart">
        <div class="rgc-chart__y">${ticks.map((t) => `<span>${t}</span>`).join('')}</div>
        <div class="rgc-chart__plot">
          <div class="rgc-chart__grid"><i style="bottom:25%"></i><i style="bottom:50%"></i><i style="bottom:75%"></i></div>
          ${labels.map((l, i) => `<div class="rgc-chart__col${o.highlight === i ? ' is-hl' : ''}" title="${esc(l)}: ${series.map((s) => `${s.name} ${num(s.values[i], o.dp ?? 0)}${unit}`).join(' · ')}">
            ${series.map((s) => `<span class="rgc-chart__bar${cls[s.tone || 'green']}" style="height:${Math.max(0, (s.values[i] / mx) * 100)}%"></span>`).join('')}
            <span class="rgc-chart__label">${esc(l)}</span></div>`).join('')}
        </div>
      </div></div>`;
  };
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }

  C.timeline = (steps) => `<div class="rgc-timeline">${steps.map((s) => `
    <div class="rgc-timeline__step${s.state ? ' ' + s.state : ''}"><span class="rgc-timeline__dot">${s.state === 'done' ? icon('check', 11) : ''}</span>
    <div><div class="rgc-timeline__t">${esc(s.t)}</div>${s.d ? `<div class="rgc-timeline__d">${s.d}</div>` : ''}</div></div>`).join('')}</div>`;

  C.toggle = (on, key) => `<button type="button" class="rgc-toggle" data-on="${on ? 'true' : 'false'}"${key ? ` data-toggle="${esc(key)}"` : ''} aria-pressed="${on ? 'true' : 'false'}"><i></i></button>`;

  C.review = (pairs) => `<div class="rgc-review">${pairs.map(([k, v]) => `<div><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>`;

  C.note = (html, tone) => `<div class="kit-note${tone ? ' kit-note--' + tone : ''}">${icon(tone === 'warn' ? 'flag' : 'info', 15)}<div>${html}</div></div>`;

  C.cal = (monthDate, events, o = {}) => {
    const d0 = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
    const start = new Date(d0); start.setDate(1 - ((d0.getDay() + 6) % 7));
    const today = o.today ? o.today.toDateString() : '';
    let cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="rgc-cal__h">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      if (i >= 35 && d.getMonth() !== d0.getMonth()) break;
      const key = isoDate(d);
      const evs = events.filter((e) => e.date === key);
      cells += `<div class="rgc-cal__d${d.getMonth() !== d0.getMonth() ? ' dim' : ''}${d.toDateString() === today ? ' today' : ''}"><b>${d.getDate()}</b>${evs
        .slice(0, 3).map((e) => `<${e.href ? `a href="${esc(e.href)}"` : 'span'} class="rgc-cal__ev${e.kind ? ' rgc-cal__ev--' + e.kind : ''}" title="${esc(e.title || e.label)}">${esc(e.label)}</${e.href ? 'a' : 'span'}>`).join('')}${evs.length > 3 ? `<span class="rgc-row__d">+${evs.length - 3} more</span>` : ''}</div>`;
    }
    return `<div class="kit-tablewrap"><div class="rgc-cal" style="min-width:640px">${cells}</div></div>`;
  };
  const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  /* map: pins projected by a function; optional land path / line network */
  C.map = (o) => {
    const W = o.width || 800, H = o.height || 720;
    const lines = (o.lines || []).map((l) => `<polyline class="${l.cls || 'kit-road'}" points="${l.pts.map((p) => p.join(',')).join(' ')}"${l.title ? '' : ''}>${l.title ? `<title>${esc(l.title)}</title>` : ''}</polyline>`).join('');
    const pins = (o.pins || []).map((p) => `<a class="rgc-map__pin${p.active ? ' is-active' : ''}${p.cls ? ' ' + p.cls : ''}" ${p.href ? `href="${esc(p.href)}"` : 'href="#"'} data-pin="${esc(p.id)}">
      ${p.halo === false ? '' : `<circle class="halo" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r ? p.r * 2.4 : 11}"></circle>`}
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r || 4.5}"${p.fill ? ` style="fill:${p.fill}"` : ''}></circle><title>${esc(p.title || '')}</title></a>`).join('');
    const grid = o.grid === false ? '' : `<g class="rgc-map__grid">${[1, 2, 3, 4, 5, 6, 7].map((i) => `<line x1="${(W / 8) * i}" y1="0" x2="${(W / 8) * i}" y2="${H}"></line>`).join('')}${[1, 2, 3, 4, 5, 6].map((i) => `<line x1="0" y1="${(H / 7) * i}" x2="${W}" y2="${(H / 7) * i}"></line>`).join('')}</g>`;
    return `<div class="rgc-map kit-map" ${o.id ? `id="${esc(o.id)}"` : ''}><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="${esc(o.label || 'Map')}">
      ${grid}${o.land ? `<path class="rgc-map__land" d="${o.land}"></path>` : ''}${lines}${o.extra || ''}${pins}</svg>
      ${o.legend ? `<div class="rgc-map__legend">${o.legend}</div>` : ''}${o.card || ''}</div>`;
  };

  /* Australia outline in the 800×720 frame used by RG Connect (Mercator) */
  const AU = {
    project(lat, lng) {
      const m = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI) / 360));
      return { x: 608.8196 + (lng - 144.963) * 18.165, y: -179.1388 - 1043.3598 * m };
    },
  };

  /* simple local projection for a town-scale map */
  function fitProjection(bounds, W, H, pad = 20) {
    const [[la1, lo1], [la2, lo2]] = bounds;
    const k = Math.cos((((la1 + la2) / 2) * Math.PI) / 180);
    const w = Math.abs(lo2 - lo1) * k, h = Math.abs(la2 - la1);
    const s = Math.min((W - pad * 2) / w, (H - pad * 2) / h);
    const ox = (W - w * s) / 2, oy = (H - h * s) / 2;
    const minLo = Math.min(lo1, lo2), maxLa = Math.max(la1, la2);
    return (lat, lng) => ({ x: ox + (lng - minLo) * k * s, y: oy + (maxLa - lat) * s });
  }

  /* wizard: steps [{title, sub, body}] — Kit wires next/back and review */
  C.wizard = (id, steps, o = {}) => `<div class="rgc-wiz kit-wiz" data-wizard="${esc(id)}" data-step="1">
    <ol class="rgc-wiz__steps" role="list">${steps.map((s, i) => `<li class="rgc-wiz__step${i === 0 ? ' now' : ''}" data-wiz-step="${i + 1}"><i>${i + 1}</i>${esc(s.title)}</li>`).join('')}</ol>
    <div class="rgc-panel"><div class="rgc-panel__body" style="display:grid;grid-template-rows:1fr auto;gap:0;min-height:0">
      <div>${steps.map((s, i) => `<section class="rgc-wiz__pane${i === 0 ? ' on' : ''}" data-wiz-pane="${i + 1}"><div><h2 class="rgc-wiz__h">${esc(s.title)}</h2>${s.sub ? `<p class="rgc-wiz__sub">${s.sub}</p>` : ''}</div>${s.body}</section>`).join('')}</div>
      <div class="rgc-wiz__nav" style="margin-top:18px"><button type="button" class="rgc-btn rgc-btn--ghost" data-wiz-back disabled>Back</button><button type="button" class="rgc-btn rgc-btn--primary" data-wiz-next>Continue ${icon('arrow-right', 15)}</button></div>
    </div></div></div>`;
  C.opts = (name, items, sel) => `<div class="rgc-opts">${items.map((i) => `<button type="button" class="rgc-opt${i.value === sel ? ' sel' : ''}" data-wiz-choice="${esc(name)}" data-value="${esc(i.value)}"><b>${esc(i.label || i.value)}</b>${i.sub ? `<span>${esc(i.sub)}</span>` : ''}</button>`).join('')}</div>`;
  C.chips = (name, items, sel) => `<div class="rgc-chips">${items.map((i) => `<button type="button" class="rgc-chip${i === sel ? ' sel' : ''}" data-wiz-choice="${esc(name)}" data-value="${esc(i)}">${esc(i)}</button>`).join('')}</div>`;

  /* ---------- the app ---------- */
  const routes = [];
  const Kit = {
    cfg: {}, side: null, C, esc, num, money, pct, signed, icon, initials, rng, store, isoDate, AU, fitProjection, niceMax,
    route(pattern, fn) {
      const keys = [];
      const re = new RegExp('^' + pattern.replace(/\/:(\w+)/g, (_, k) => (keys.push(k), '/([^/]+)')) + '/?$');
      routes.push({ pattern, re, keys, fn });
    },
    go(href) { location.hash = href.replace(/^#/, ''); },
    link(path) { return '#/' + (Kit.side ? Kit.side.key + '/' : '') + path; },
    sideLink(side, path) { return '#/' + side + '/' + path; },
    toast,
    download,
    csv,
    refresh() { render(); },
    boot(cfg) {
      Kit.cfg = cfg;
      document.title = cfg.title || cfg.product?.name || 'Connect';
      document.body.classList.add('kit');
      window.addEventListener('hashchange', render);
      document.addEventListener('click', onClick);
      document.addEventListener('change', onChange);
      document.addEventListener('keydown', onKey);
      setTimeout(render, 0); // pages register after boot()
    },
  };
  window.Kit = Kit;

  function sideByKey(k) { return (Kit.cfg.sides || []).find((s) => s.key === k); }

  function parseHash() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    const [path, query = ''] = h.split('?');
    return { path, query: Object.fromEntries(new URLSearchParams(query)) };
  }

  function render() {
    const cfg = Kit.cfg;
    let { path, query } = parseHash();
    if (!path) {
      const s0 = cfg.sides[0];
      path = cfg.login ? 'login' : `${s0.key}/${s0.home}`;
      history.replaceState(null, '', '#/' + path);
    }
    if (path === 'login' && cfg.login) return renderLogin();
    let [sideKey, ...rest] = path.split('/');
    let side = sideByKey(sideKey);
    if (!side) { side = cfg.sides[0]; rest = path.split('/'); }
    if (!rest.length || !rest[0]) rest = [side.home];
    Kit.side = side;
    const sub = rest.join('/');
    let match = null;
    const full = `${side.key}/${sub}`;
    for (const r of routes) {
      const m = full.match(r.re);
      if (m) { match = { r, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) }; break; }
    }
    let page;
    try {
      page = match ? match.r.fn(match.params, query, side) : { title: 'Not found', html: C.panel({ body: `<p>That page doesn't exist. <a href="${Kit.link(side.home)}">Back to ${esc(side.nav[0].label)}</a></p>` }) };
    } catch (err) {
      console.error(err);
      page = { title: 'Something went wrong', html: C.panel({ body: `<p>${esc(err.message)}</p>` }) };
    }
    const navId = page.nav || rest[0];
    const app = document.getElementById('app');
    const scrollKeep = app.dataset.path === path ? (app.querySelector('.rgc-content')?.scrollTop || 0) : 0;
    app.dataset.path = path;
    app.innerHTML = shell(side, navId, page);
    document.title = `${page.title} · ${cfg.title || cfg.product.name}`;
    const content = app.querySelector('.rgc-content');
    content.scrollTop = scrollKeep;
    app.classList.remove('kit-nav-open');
    if (page.after) {
      try { page.after(content, query); } catch (err) { console.error(err); }
    }
  }

  function shell(side, navId, page) {
    const cfg = Kit.cfg;
    const p = cfg.product;
    const sides = cfg.sides.length > 1
      ? `<span class="rgc-seg kit-sides" role="group" aria-label="Switch view">${cfg.sides.map((s) => `<a href="#/${s.key}/${s.home}" aria-pressed="${s.key === side.key}" class="kit-side">${esc(s.label)}</a>`).join('')}</span>`
      : '';
    const nav = side.nav.map((n) => n.divider
      ? `<div class="kit-nav__div">${esc(n.divider)}</div>`
      : `<a href="#/${side.key}/${n.id}"${n.id === navId ? ' aria-current="page"' : ''}>${icon(n.icon || 'grid', 18)} ${esc(n.label)}${n.badge ? `<span class="kit-nav__badge">${esc(n.badge)}</span>` : ''}</a>`).join('');
    const right = [page.right || '', cfg.demo && page.demo !== false ? C.demo() : ''].filter(Boolean).join('');
    return `
    ${cfg.demo ? `<div class="kit-demo" role="region" aria-label="Notice"><span class="demo-badge">${esc(cfg.demo.badge || 'Demonstration data')}</span><span class="note">${esc(cfg.demo.text)}</span>${cfg.demo.link ? `<a class="kit-demo__cta" href="${esc(cfg.demo.link.href)}" target="_blank" rel="noopener">${esc(cfg.demo.link.label)} ${icon('arrow-right', 12)}</a>` : ''}</div>` : ''}
    ${cfg.banner ? `<div class="kit-demo kit-demo--plain" role="region" aria-label="Notice">${cfg.banner}</div>` : ''}
    <div class="rgc rgc--live rgc-shell kit-shell" data-side="${esc(side.key)}">
      <aside class="rgc-side" aria-label="Main navigation">
        <a class="rgc-brand" href="#/${side.key}/${side.home}">${p.logo ? `<img src="${p.logo}" alt="${esc(p.logoAlt || p.name)}" style="height:${p.logoH || 24}px">` : ''}<span class="rgc-brand__word">${esc(p.word || '')}</span></a>
        ${sides ? `<div class="kit-sides-wrap">${sides}</div>` : ''}
        <nav class="rgc-nav" aria-label="${esc(p.name)}">${nav}</nav>
        <div class="rgc-side__foot">
          ${cfg.login ? `<a class="rgc-side__out" href="#/login">${icon('lock', 14)} Sign out</a>` : ''}
          ${side.foot || ''}
          <div class="rgc-org"><span class="rgc-org__mark">${esc(side.org.mark || initials(side.org.name))}</span><span><div class="rgc-org__name">${esc(side.org.name)}</div><div class="rgc-org__sub">${esc(side.org.sub || '')}</div></span></div>
        </div>
      </aside>
      <div class="kit-scrim" data-action="nav-close"></div>
      <div class="rgc-main">
        <div class="rgc-top">
          <button type="button" class="rgc-iconbtn kit-burger" data-action="nav-open" aria-label="Open menu">${icon('menu', 17)}</button>
          <button type="button" class="rgc-search" data-action="search">${icon('search', 15)} <span class="kit-search__label">${esc(side.searchLabel || cfg.searchLabel || 'Search')}</span> <kbd>⌘K</kbd></button>
          <div class="rgc-top__right">
            ${cfg.topRight ? cfg.topRight(side) : ''}
            <span class="rgc-user"><span class="rgc-avatar">${esc(initials(side.user.name))}</span><span class="kit-user__txt"><div class="rgc-user__name">${esc(side.user.name)}</div><div class="rgc-user__sub">${esc(side.user.role)}</div></span></span>
          </div>
        </div>
        <main class="rgc-content" id="main" tabindex="-1">
          ${page.bare ? '' : `<div class="rgc-pagehead">
            <div>${page.crumb ? `<div class="kit-crumb">${page.crumb}</div>` : ''}<h1 class="rgc-title">${esc(page.title)}</h1>${page.sub ? `<p class="rgc-sub">${page.sub}</p>` : ''}</div>
            <div class="rgc-pagehead__right">${right}</div>
          </div>`}
          ${page.html}
          ${cfg.footer ? `<footer class="kit-foot">${cfg.footer}</footer>` : ''}
        </main>
      </div>
    </div>
    <div class="kit-palette" hidden><div class="kit-palette__box" role="dialog" aria-label="Search">
      <div class="kit-palette__in">${icon('search', 16)}<input type="search" placeholder="${esc(side.searchLabel || cfg.searchLabel || 'Search')}" aria-label="Search"><kbd>Esc</kbd></div>
      <div class="kit-palette__list" role="listbox"></div></div></div>
    <div class="demo-toast kit-toast" role="status" aria-live="polite" hidden></div>`;
  }

  function renderLogin() {
    const cfg = Kit.cfg, L = cfg.login, s0 = cfg.sides[0];
    document.title = `Sign in · ${cfg.title || cfg.product.name}`;
    const app = document.getElementById('app');
    app.dataset.path = 'login';
    app.innerHTML = `
    ${cfg.demo ? `<div class="kit-demo"><span class="demo-badge">${esc(cfg.demo.badge || 'Demonstration data')}</span><span class="note">${esc(cfg.demo.text)}</span></div>` : ''}
    <div class="rgc rgc--live kit-login-wrap"><div class="rgc-login">
      <div class="rgc-login__side">
        <span class="rgc-brand">${cfg.product.logo ? `<img src="${cfg.product.logo}" alt="${esc(cfg.product.logoAlt || cfg.product.name)}" style="height:${(cfg.product.logoH || 24) + 4}px">` : ''}<span class="rgc-brand__word">${esc(cfg.product.word || '')}</span></span>
        <div><div class="rgc-login__line">${esc(L.line)}</div><p style="margin-top:16px;max-width:40ch;color:var(--app-text-2);font-size:13px">${esc(L.sub || '')}</p></div>
        <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--app-text-3)">${esc(L.foot || '')}</span>
      </div>
      <div class="rgc-login__form"><div class="rgc-login__card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h1>Sign in</h1>${cfg.demo ? C.demo() : ''}</div>
        <p>${esc(L.note || 'Choose how you want to enter the demonstration.')}</p>
        ${cfg.sides.map((s) => `<a class="rgc-btn ${s === s0 ? 'rgc-btn--primary' : ''} rgc-btn--block" href="#/${s.key}/${s.home}">${esc(s.enter || 'Continue as ' + s.label)} ${icon('arrow-right', 15)}</a>`).join('')}
        <p style="text-align:center">${esc(L.small || 'Demonstration only. No account is created and nothing is stored.')}</p>
      </div></div>
    </div></div>
    <div class="demo-toast kit-toast" role="status" aria-live="polite" hidden></div>`;
  }

  /* ---------- behaviour ---------- */
  let toastT = 0;
  function toast(msg) {
    const t = document.querySelector('.kit-toast');
    if (!t) return;
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
  }

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function csv(rows) {
    return rows.map((r) => r.map((v) => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\r\n');
  }
  Kit.parseCsv = function (text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((v) => v !== ''));
  };

  const handlers = {};
  Kit.action = (name, fn) => { handlers[name] = fn; };
  Kit.handler = (name) => handlers[name];
  Kit.clickHooks = [];

  function onClick(e) {
    const t = e.target;
    for (const hook of Kit.clickHooks) { if (hook(e, t)) return; }
    const segBtn = t.closest('.rgc-seg[data-seg] button');
    if (segBtn) {
      const seg = segBtn.closest('[data-seg]');
      seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === segBtn)));
      const fn = handlers['seg:' + seg.dataset.seg];
      if (fn) fn(segBtn.dataset.value, segBtn, e);
      return;
    }
    const tog = t.closest('[data-toggle]');
    if (tog) {
      const on = tog.dataset.on !== 'true';
      tog.dataset.on = String(on); tog.setAttribute('aria-pressed', String(on));
      const fn = handlers['toggle:' + tog.dataset.toggle] || handlers.toggle;
      if (fn) fn(on, tog);
      return;
    }
    const act = t.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'nav-open') { document.getElementById('app').classList.add('kit-nav-open'); return; }
      if (a === 'nav-close') { document.getElementById('app').classList.remove('kit-nav-open'); return; }
      if (a === 'search') { openPalette(); return; }
      if (a === 'print') { window.print(); return; }
      if (handlers[a]) { e.preventDefault(); handlers[a](act, e); return; }
      e.preventDefault();
      toast(`Demonstration — “${(act.textContent || 'This action').trim().replace(/\s+/g, ' ').slice(0, 40)}” isn't connected in this version.`);
      return;
    }
    const wiz = t.closest('[data-wizard]');
    if (wiz) return wizardClick(wiz, t);
    const pal = t.closest('.kit-palette');
    if (pal && !t.closest('.kit-palette__box')) { closePalette(); return; }
    const pin = t.closest('.rgc-map__pin[data-pin]');
    if (pin && handlers['pin']) { e.preventDefault(); handlers['pin'](pin.dataset.pin, pin); return; }
    const row = t.closest('[data-href]');
    if (row && !t.closest('a,button,input,select,textarea,label')) { Kit.go(row.dataset.href); return; }
  }

  function onChange(e) {
    const s = e.target.closest('[data-select]');
    if (s && handlers['select:' + s.dataset.select]) handlers['select:' + s.dataset.select](s.value, s, e);
    const f = e.target.closest('[data-field]');
    if (f && handlers['field']) handlers['field'](f, e);
    const file = e.target.closest('input[type=file][data-file]');
    if (file && handlers['file:' + file.dataset.file]) handlers['file:' + file.dataset.file](file.files[0], file, e);
  }

  function onKey(e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    const pal = document.querySelector('.kit-palette');
    if (pal && !pal.hidden) {
      if (e.key === 'Escape') { closePalette(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const items = [...pal.querySelectorAll('.kit-palette__item')];
        let i = items.findIndex((x) => x.classList.contains('is-on'));
        i = Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
        items.forEach((x, j) => x.classList.toggle('is-on', j === i));
        items[i]?.scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'Enter') { const on = pal.querySelector('.kit-palette__item.is-on'); if (on) { closePalette(); Kit.go(on.getAttribute('href')); } }
      return;
    }
    if (e.key === 'Escape') document.getElementById('app')?.classList.remove('kit-nav-open');
  }

  function searchIndex() {
    const side = Kit.side;
    const nav = side.nav.filter((n) => !n.divider).map((n) => ({ t: n.label, d: 'Page', href: `#/${side.key}/${n.id}` }));
    const extra = Kit.cfg.search ? Kit.cfg.search(side) : [];
    return nav.concat(extra);
  }
  function openPalette() {
    const pal = document.querySelector('.kit-palette');
    if (!pal) return;
    pal.hidden = false;
    const input = pal.querySelector('input');
    const list = pal.querySelector('.kit-palette__list');
    const idx = searchIndex();
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      const words = q.split(/\s+/).filter(Boolean);
      const hits = idx.filter((i) => words.every((w) => (i.t + ' ' + (i.d || '') + ' ' + (i.k || '')).toLowerCase().includes(w))).slice(0, 40);
      list.innerHTML = hits.length
        ? hits.map((h, j) => `<a class="kit-palette__item${j === 0 ? ' is-on' : ''}" href="${esc(h.href)}"><b>${esc(h.t)}</b><span>${esc(h.d || '')}</span></a>`).join('')
        : `<div class="kit-empty">No matches.</div>`;
    };
    input.value = ''; draw();
    input.oninput = draw;
    list.onclick = (e) => { if (e.target.closest('a')) closePalette(); };
    setTimeout(() => input.focus(), 0);
  }
  function closePalette() { const pal = document.querySelector('.kit-palette'); if (pal) pal.hidden = true; }

  /* wizard */
  function wizardClick(wiz, t) {
    const panes = [...wiz.querySelectorAll('[data-wiz-pane]')];
    const steps = [...wiz.querySelectorAll('[data-wiz-step]')];
    const state = wiz._state || (wiz._state = {});
    wiz.querySelectorAll('[data-wiz-choice].sel').forEach((o) => { if (!(o.dataset.wizChoice in state)) state[o.dataset.wizChoice] = o.dataset.value; });
    let step = Number(wiz.dataset.step || 1);
    const choice = t.closest('[data-wiz-choice]');
    const paint = () => {
      panes.forEach((p) => p.classList.toggle('on', Number(p.dataset.wizPane) === step));
      steps.forEach((s, i) => { s.classList.toggle('done', i + 1 < step); s.classList.toggle('now', i + 1 === step); s.querySelector('i').textContent = i + 1 < step ? '✓' : String(i + 1); });
      wiz.querySelector('[data-wiz-back]').disabled = step === 1;
      wiz.querySelector('[data-wiz-next]').innerHTML = (step === panes.length ? 'Submit request ' : 'Continue ') + icon('arrow-right', 15);
      wiz.querySelectorAll('input[data-wiz-in],textarea[data-wiz-in],select[data-wiz-in]').forEach((i) => { if (i.value) state[i.dataset.wizIn] = i.value; });
      wiz.querySelectorAll('[data-wiz-out]').forEach((o) => { const v = state[o.dataset.wizOut]; if (v) o.textContent = v; });
      wiz.dataset.step = String(step);
    };
    if (choice) {
      const k = choice.dataset.wizChoice;
      wiz.querySelectorAll(`[data-wiz-choice="${k}"]`).forEach((b) => b.classList.toggle('sel', b === choice));
      state[k] = choice.dataset.value;
      return;
    }
    const st = t.closest('[data-wiz-step]');
    if (st && Number(st.dataset.wizStep) < step) { step = Number(st.dataset.wizStep); return paint(); }
    if (t.closest('[data-wiz-back]') && step > 1) { step--; return paint(); }
    if (t.closest('[data-wiz-next]')) {
      if (step < panes.length) { step++; return paint(); }
      paint();
      const fn = handlers['wizard:' + wiz.dataset.wizard];
      if (fn) fn(state, wiz);
    }
  }
})();

</script>
<script>
/* ==========================================================================
   Connect Platform Kit — easy entry + reports
   - C.stepper   big − / + number box (fires a normal 'change' event)
   - C.pick      tap-to-choose buttons (Kit.action('pick:<name>', fn))
   - Kit.backup / Kit.restore   move everything entered to another computer
   - Kit.parseTable             paste from Excel / Google Sheets or CSV
   - Kit.report                 paged A4 report in the app's look → Save as PDF
   ========================================================================== */
(function () {
  'use strict';
  const { C, esc, icon, store } = Kit;

  /* ---------- stepper ---------- */
  C.stepper = (field, value, o = {}) => `<div class="kit-step${o.big ? ' kit-step--big' : ''}${o.cls ? ' ' + o.cls : ''}">
    ${o.label ? `<label class="kit-step__l">${esc(o.label)}${o.unit ? ` <small>${esc(o.unit)}</small>` : ''}</label>` : ''}
    <div class="kit-step__c">
      <button type="button" data-stepbtn="-1" aria-label="Less ${esc(o.label || '')}" tabindex="-1">−</button>
      <input class="kit-step__in" type="number" inputmode="decimal" min="${o.min ?? 0}" ${o.max != null ? `max="${o.max}"` : ''} step="any" data-stepv="${o.step ?? 1}"
        value="${value == null || value === 0 ? '' : value}" placeholder="0" ${o.attr || `data-field="${esc(field)}"`} aria-label="${esc(o.label || field)}">
      <button type="button" data-stepbtn="1" aria-label="More ${esc(o.label || '')}" tabindex="-1">+</button>
    </div>
    ${o.quick ? `<div class="kit-step__q">${o.quick.map((q) => `<button type="button" data-stepset="${q}">${q}</button>`).join('')}</div>` : ''}
  </div>`;

  /* ---------- pick buttons ---------- */
  C.pick = (name, options, selected, o = {}) => `<div class="kit-pick${o.big ? ' kit-pick--big' : ''}${o.cls ? ' ' + o.cls : ''}" data-pick="${esc(name)}" role="group"${o.label ? ` aria-label="${esc(o.label)}"` : ''}>${options
    .map((opt) => {
      const [v, l, sub] = Array.isArray(opt) ? opt : [opt, opt];
      return `<button type="button" data-value="${esc(v)}" aria-pressed="${String(v) === String(selected)}">${esc(l)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
    }).join('')}</div>`;
  Kit.picked = (root, name) => root.querySelector(`[data-pick="${name}"] button[aria-pressed="true"]`)?.dataset.value ?? '';

  Kit.clickHooks.push((e, t) => {
    const sb = t.closest('[data-stepbtn], [data-stepset]');
    if (sb) {
      const wrap = sb.closest('.kit-step');
      const input = wrap.querySelector('input');
      const step = parseFloat(input.dataset.stepv) || 1;
      let v = sb.dataset.stepset != null ? parseFloat(sb.dataset.stepset) : (parseFloat(input.value) || 0) + step * Number(sb.dataset.stepbtn);
      const min = input.min !== '' ? parseFloat(input.min) : -Infinity;
      const max = input.max !== '' ? parseFloat(input.max) : Infinity;
      v = Math.min(max, Math.max(min, Math.round(v * 100) / 100));
      input.value = v === 0 ? '' : String(v);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      wrap.classList.remove('is-bump'); void wrap.offsetWidth; wrap.classList.add('is-bump');
      return true;
    }
    const pb = t.closest('[data-pick] > button');
    if (pb) {
      const grp = pb.closest('[data-pick]');
      grp.querySelectorAll(':scope > button').forEach((b) => b.setAttribute('aria-pressed', String(b === pb)));
      const fn = Kit.handler('pick:' + grp.dataset.pick);
      if (fn) fn(pb.dataset.value, pb, e);
      return true;
    }
    return false;
  });

  /* ---------- backup / restore ---------- */
  Kit.backup = (prefix, filename) => {
    const data = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(prefix)) data[k] = localStorage.getItem(k); } } catch (e) { /* storage blocked */ }
    Kit.download(filename, JSON.stringify({ app: prefix, saved: new Date().toISOString(), data }, null, 1), 'application/json');
  };
  Kit.restore = (prefix, file) => file.text().then((txt) => {
    const j = JSON.parse(txt);
    if (j.app !== prefix || !j.data) throw new Error('That backup belongs to a different app.');
    Object.entries(j.data).forEach(([k, v]) => localStorage.setItem(k, v));
    return Object.keys(j.data).length;
  });
  C.backupBox = (prefix, what) => C.panel({ title: 'Move your numbers to another computer', flush: true, list: true, body:
    C.row({ icon: 'download', t: 'Download a backup', d: `Everything entered for ${esc(what)} on this browser, in one file.`, r: `<button type="button" class="rgc-btn rgc-btn--sm" data-action="kit-backup" data-prefix="${esc(prefix)}">Backup</button>`, cols: '36px 1fr auto' })
    + C.row({ icon: 'upload', t: 'Load a backup', d: 'Adds a backup file from another computer to this one.', r: `<label class="rgc-btn rgc-btn--sm" style="cursor:pointer">Load<input type="file" accept=".json,application/json" data-restore="${esc(prefix)}" hidden></label>`, cols: '36px 1fr auto' }) });
  Kit.action('kit-backup', (btn) => Kit.backup(btn.dataset.prefix, `${btn.dataset.prefix.replace(/[:]+$/, '')}-backup-${Kit.isoDate(new Date())}.json`));
  document.addEventListener('change', (e) => {
    const inp = e.target.closest('input[data-restore]');
    if (!inp || !inp.files[0]) return;
    Kit.restore(inp.dataset.restore, inp.files[0]).then((n) => { Kit.toast(`Backup loaded (${n} items).`); setTimeout(() => location.reload(), 600); }, (err) => Kit.toast(err.message || 'That file could not be read.'));
  });

  /* ---------- paste from a spreadsheet ---------- */
  Kit.parseTable = (text) => {
    const clean = String(text || '').replace(/^﻿/, '').trim();
    if (!clean) return [];
    if (clean.includes('\t')) return clean.split(/\r?\n/).map((l) => l.split('\t').map((c) => c.trim())).filter((r) => r.some(Boolean));
    return Kit.parseCsv(clean).map((r) => r.map((c) => c.trim()));
  };
  Kit.numberFrom = (v) => { const n = parseFloat(String(v ?? '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : null; };

  /* ======================================================================
     REPORTS — A4 pages in the app's look; Download PDF uses the browser's
     Save as PDF so text stays sharp and selectable.
     spec = { title, kicker, subtitle, org, period, prepared, logo, logoH,
              demo, filename, hero:[{label,value,unit,note}], compare,
              blocks:[ html string | {title, meta, html} | {title, meta, table:{cols,rows,foot}} | {pageBreak:true} ] }
     ====================================================================== */
  const A4 = { w: 794, h: 1123 };

  Kit.report = function (spec) {
    closeReport();
    const light = store.get('kit:report-light', false);
    const shell = document.createElement('div');
    shell.className = 'rp-shell';
    shell.innerHTML = `
      <div class="rp-bar">
        <button type="button" class="rgc-btn rgc-btn--sm" data-rp="close">${icon('arrow-left', 14)} Back to the app</button>
        <div class="rp-bar__t"><b>${esc(spec.title)}</b><span>${esc(spec.period || '')}</span></div>
        <span class="rgc-seg" role="group" aria-label="Report style"><button type="button" data-rp="dark" aria-pressed="${!light}">Dark</button><button type="button" data-rp="light" aria-pressed="${light}">Light (print)</button></span>
        <button type="button" class="rgc-btn rgc-btn--primary" data-rp="pdf">${icon('download', 15)} Download PDF</button>
      </div>
      <div class="rp-scroll"><div class="rp-doc rgc${light ? ' rp-light' : ''}"></div></div>
      <div class="rp-tip" hidden>In the print window choose <b>Save as PDF</b>. Keep <b>Background graphics</b> ticked for the dark style.</div>`;
    document.body.appendChild(shell);
    document.body.classList.add('rp-open');
    let ps = document.getElementById('rp-page-style');
    if (!ps) { ps = document.createElement('style'); ps.id = 'rp-page-style'; ps.textContent = '@media print { @page { size: A4 portrait; margin: 0; } }'; document.head.appendChild(ps); }
    const doc = shell.querySelector('.rp-doc');
    build(doc, spec);
    fit(shell);
    shell.addEventListener('click', (e) => {
      const b = e.target.closest('[data-rp]');
      if (!b) return;
      const a = b.dataset.rp;
      if (a === 'close') closeReport();
      if (a === 'dark' || a === 'light') {
        store.set('kit:report-light', a === 'light');
        b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        doc.classList.toggle('rp-light', a === 'light');
        build(doc, spec); fit(shell);
      }
      if (a === 'pdf') {
        const oldTitle = document.title;
        document.title = spec.filename || spec.title;
        shell.querySelector('.rp-tip').hidden = false;
        setTimeout(() => { window.print(); document.title = oldTitle; }, 50);
      }
    });
    shell._onKey = (e) => { if (e.key === 'Escape') closeReport(); };
    document.addEventListener('keydown', shell._onKey);
    window.addEventListener('resize', shell._fit = () => fit(shell));
  };
  function closeReport() {
    const s = document.querySelector('.rp-shell');
    if (!s) return;
    document.removeEventListener('keydown', s._onKey);
    window.removeEventListener('resize', s._fit);
    s.remove();
    document.getElementById('rp-page-style')?.remove();
    document.body.classList.remove('rp-open');
  }
  Kit.closeReport = closeReport;

  function fit(shell) {
    const doc = shell.querySelector('.rp-doc');
    const avail = shell.querySelector('.rp-scroll').clientWidth - 32;
    const z = Math.min(1, avail / A4.w);
    doc.style.setProperty('--rp-z', z);
    doc.style.zoom = z < 1 ? z : '';
  }

  function pageShell(spec, cover) {
    const p = document.createElement('section');
    p.className = 'rp-page' + (cover ? ' rp-page--cover' : '');
    if (!cover) {
      p.innerHTML = `<header class="rp-head">${spec.logo ? `<img class="rp-logo${spec.logoDark ? ' rp-logo--on-dark' : ''}" src="${spec.logo}" alt="" style="height:${spec.logoH || 18}px">` : ''}${spec.logoDark ? `<img class="rp-logo rp-logo--on-light" src="${spec.logoDark}" alt="" style="height:${spec.logoH || 18}px">` : ''}<span class="rp-head__t">${esc(spec.title)}</span><span class="rp-head__p">${esc(spec.period || '')}</span>${spec.demo ? `<span class="rp-demo">${esc(typeof spec.demo === 'string' ? spec.demo : 'Demonstration data')}</span>` : ''}</header>
        <div class="rp-body"></div>
        <footer class="rp-foot"><span>${esc(spec.org || '')}${spec.prepared ? ' · ' + esc(spec.prepared) : ''}</span><span class="rp-pn"></span></footer>`;
    }
    return p;
  }

  function coverPage(spec) {
    const p = pageShell(spec, true);
    const hero = spec.hero || [];
    p.innerHTML = `
      <div class="rp-cover__top">${spec.logo ? `<img src="${spec.logo}" alt="" style="height:${(spec.logoH || 18) * 1.8}px">` : ''}${spec.demo ? `<span class="rp-demo">${esc(typeof spec.demo === 'string' ? spec.demo : 'Demonstration data')}</span>` : ''}</div>
      <div class="rp-cover__mid">
        <div class="rp-kicker">${esc(spec.kicker || 'Report')}</div>
        <h1 class="rp-cover__title">${esc(spec.title)}</h1>
        ${spec.subtitle ? `<p class="rp-cover__sub">${esc(spec.subtitle)}</p>` : ''}
        <dl class="rp-cover__meta">${(spec.meta || []).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      </div>
      ${hero.length ? `<div class="rp-hero">${hero.map((h, i) => `<div class="rp-hero__i${i === 0 ? ' is-main' : ''}"><span>${esc(h.label)}</span><b>${h.value}${h.unit ? `<small>${esc(h.unit)}</small>` : ''}</b>${h.note ? `<em>${h.note}</em>` : ''}</div>`).join('')}</div>` : ''}
      ${spec.compare ? `<div class="rp-compare">${spec.compare}</div>` : ''}
      <div class="rp-cover__foot"><span>${esc(spec.org || '')}</span><span>${esc(spec.prepared || '')}</span></div>`;
    return p;
  }

  function blockEl(b) {
    const el = document.createElement('div');
    el.className = 'rp-block';
    if (typeof b === 'string') { el.innerHTML = b; return el; }
    if (b.table) {
      el.classList.add('rp-tblock');
      if (b.cls) el.classList.add(b.cls);
      el.innerHTML = `${b.title ? `<div class="rp-bt"><h2>${esc(b.title)}</h2>${b.meta ? `<span>${b.meta}</span>` : ''}</div>` : ''}${C.table(b.table.cols, b.table.rows, { foot: b.table.foot, empty: b.table.empty })}`;
      el._spec = b;
      return el;
    }
    el.innerHTML = `${b.title ? `<div class="rp-bt"><h2>${esc(b.title)}</h2>${b.meta ? `<span>${b.meta}</span>` : ''}</div>` : ''}<div class="rp-bb">${b.html || ''}</div>`;
    if (b.cls) el.classList.add(b.cls);
    return el;
  }

  function build(doc, spec) {
    doc.style.zoom = '';
    doc.innerHTML = '';
    if (!spec.noCover) doc.appendChild(coverPage(spec));
    let page = null, body = null;
    const newPage = () => { page = pageShell(spec); doc.appendChild(page); body = page.querySelector('.rp-body'); };
    const overflows = () => body.scrollHeight > body.clientHeight + 1;
    newPage();
    for (const b of spec.blocks || []) {
      if (b && b.pageBreak) { if (body.children.length) newPage(); continue; }
      if (!b) continue;
      let el = blockEl(b);
      body.appendChild(el);
      if (!overflows()) continue;
      if (el._spec && el._spec.table && el._spec.table.rows.length > 1) {
        // split a long table across pages, repeating its heading
        body.removeChild(el);
        let rows = el._spec.table.rows.slice();
        let first = true;
        while (rows.length) {
          let n = rows.length;
          const make = (k, last) => blockEl({ title: el._spec.title ? el._spec.title + (first ? '' : ' (continued)') : '', meta: first ? el._spec.meta : '', table: { cols: el._spec.table.cols, rows: rows.slice(0, k), foot: last ? el._spec.table.foot : null }, cls: el._spec.cls });
          let part = make(n, true);
          body.appendChild(part);
          if (overflows()) {
            // binary search the number of rows that fit
            let lo = 0, hi = n;
            while (lo < hi) {
              const mid = Math.ceil((lo + hi) / 2);
              body.removeChild(part);
              part = make(mid, mid === rows.length);
              body.appendChild(part);
              if (overflows()) hi = mid - 1; else lo = mid;
            }
            body.removeChild(part);
            if (lo === 0) {
              if (body.children.length) { newPage(); continue; }
              lo = 1;
            }
            part = make(lo, lo === rows.length);
            body.appendChild(part);
          }
          rows = rows.slice(part.querySelectorAll('tbody tr').length);
          first = false;
          if (rows.length) newPage();
        }
        continue;
      }
      if (body.children.length > 1) {
        body.removeChild(el);
        newPage();
        body.appendChild(el);
      }
      if (overflows()) el.classList.add('rp-shrink');
    }
    if (body && !body.children.length) page.remove();
    const pages = doc.querySelectorAll('.rp-page');
    pages.forEach((p, i) => { const pn = p.querySelector('.rp-pn'); if (pn) pn.textContent = `Page ${i + 1} of ${pages.length}`; });
  }

  /* size comparisons so big numbers register (plain arithmetic, basis stated) */
  Kit.compareM3 = (m3) => {
    if (!(m3 > 0)) return '';
    const bins = m3 / 0.24, skips = m3 / 6;
    return `<b>${Kit.num(m3, m3 % 1 ? 1 : 0)} m³</b> is about <b>${Kit.num(bins)}</b> household wheelie bins (240 L) or <b>${Kit.num(skips, skips < 10 ? 1 : 0)}</b> 6 m³ skip bins.`;
  };
  Kit.compareTonnes = (t) => {
    if (!(t > 0)) return '';
    const cars = t / 1.5;
    return `<b>${Kit.num(t, t < 100 ? 1 : 0)} tonnes</b> weighs about the same as <b>${Kit.num(cars)}</b> family cars (at 1.5 t each).`;
  };
})();

</script>
<script>
/* ==========================================================================
   Connect Platform Kit — outcomes & impact engine
   "What difference did it make that this didn't go straight to landfill?"

   Every factor is listed on each app's Factors page with its source and can
   be changed there (saved per browser). Published factors are marked with
   their source; operating assumptions are marked "JUNK assumption" /
   "Recycle Group assumption" and should be confirmed against dockets.
   ========================================================================== */
(function () {
  'use strict';
  const { C, esc, num, store } = Kit;

  const SOURCES = {
    nga: { short: 'NGA Factors 2025, Table 15', long: 'Australian National Greenhouse Accounts Factors 2025 (DCCEEW), Table 15 — waste mix methane conversion and emission factors (as republished by NetNada)', url: 'https://www.netnada.com/emission-factors/australia/waste-textiles' },
    mfe: { short: 'NZ MfE Measuring Emissions 2026', long: 'NZ Ministry for the Environment, Measuring Emissions Catalogue 2026 — garden waste to landfill without gas recovery (used until the NGA garden figure is confirmed)', url: 'https://measuringemissionsguide.environment.govt.nz/10_materials_waste.html' },
    steel: { short: 'worldsteel scrap fact sheet', long: 'World Steel Association, Scrap use in the steel industry — each tonne of scrap used avoids 1.5 t CO2', url: 'https://worldsteel.org/wp-content/uploads/Fact-sheet-on-scrap_2021.pdf' },
    tree: { short: 'US EPA equivalencies', long: 'US EPA Greenhouse Gas Equivalencies Calculator — one urban tree seedling grown for 10 years sequesters 0.060 t CO2', url: 'https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references' },
    tsa: { short: 'Tyre Stewardship Australia EPU', long: 'Tyre Stewardship Australia — one Equivalent Passenger Unit (EPU) = 8 kg', url: 'https://www.tyrestewardship.org.au/' },
    none: { short: 'No landfill methane', long: 'Metals, glass, plastics, foam and concrete do not break down to methane in landfill, so no landfill emissions are counted for them', url: '' },
    assume: { short: 'Operating assumption', long: 'Operating assumption — confirm against weighbridge dockets and recycler receipts', url: '' },
  };

  /* base materials: landfill emission factor (t CO2-e per tonne landfilled) and recycling credit (t CO2-e avoided per tonne recycled) */
  const BASE = {
    paper: { name: 'Paper & cardboard', ef: 3.3, efSrc: 'nga', credit: 0 },
    textiles: { name: 'Textiles', ef: 2.0, efSrc: 'nga', credit: 0 },
    wood: { name: 'Wood & timber', ef: 0.7, efSrc: 'nga', credit: 0 },
    garden: { name: 'Garden & green waste', ef: 1.5, efSrc: 'mfe', credit: 0 },
    mixed: { name: 'Mixed household / general waste', ef: 1.6, efSrc: 'nga', credit: 0 },
    cd: { name: 'Construction & demolition waste', ef: 0.2, efSrc: 'nga', credit: 0 },
    metal: { name: 'Steel & metals', ef: 0, efSrc: 'none', credit: 1.5, creditSrc: 'steel' },
    inert: { name: 'Plastics, foam, glass, concrete', ef: 0, efSrc: 'none', credit: 0 },
  };

  /* default factors — an app passes its own material list to Kit.Impact.setup() */
  const TREE_T = 0.060;

  const Impact = {
    SOURCES, BASE, TREE_T,
    key: null,
    materials: {},
    defaults: {},
    /* materials: { id: { name, unit:'m3'|'t'|'each', tPerUnit, mix:{base:share}, recovery:0..1, reuse:0..1, note, assume:true } } */
    setup(key, materials) {
      Impact.key = key;
      Impact.defaults = JSON.parse(JSON.stringify(materials));
      const saved = store.get(key + ':factors', {});
      Impact.materials = JSON.parse(JSON.stringify(materials));
      Object.entries(saved).forEach(([id, o]) => { if (Impact.materials[id]) Object.assign(Impact.materials[id], o); });
    },
    save(id, field, value) {
      const saved = store.get(Impact.key + ':factors', {});
      saved[id] = { ...(saved[id] || {}), [field]: value };
      store.set(Impact.key + ':factors', saved);
      Impact.materials[id][field] = value;
    },
    reset() { store.del(Impact.key + ':factors'); Impact.materials = JSON.parse(JSON.stringify(Impact.defaults)); },

    /* per-tonne landfill emissions and recycling credit for a material, from its base mix */
    efOf(m) { return Object.entries(m.mix).reduce((a, [b, s]) => a + BASE[b].ef * s, 0); },
    creditOf(m) { return Object.entries(m.mix).reduce((a, [b, s]) => a + BASE[b].credit * s, 0); },

    /* quantities: { materialId: amount in that material's unit } ; override: { materialId: {recovered t, landfill t} } for weighed outcomes */
    calc(quantities, override = {}) {
      const r = { tonnes: 0, recovered: 0, reused: 0, recycled: 0, landfill: 0, co2AllLandfill: 0, co2WithUs: 0, landfillM3Avoided: 0, rows: [] };
      Object.entries(quantities).forEach(([id, amount]) => {
        const m = Impact.materials[id];
        if (!m || !(amount > 0)) return;
        const t = m.unit === 't' ? amount : amount * m.tPerUnit;
        const o = override[id];
        const recovered = o ? o.recovered : t * m.recovery;
        const reused = o && o.reused != null ? o.reused : recovered * (m.reuse || 0);
        const landfill = t - recovered;
        const ef = Impact.efOf(m), credit = Impact.creditOf(m);
        const allLf = t * ef;
        const withUs = landfill * ef - (recovered - reused) * credit;
        const tPerM3 = m.unit === 'm3' ? m.tPerUnit : m.lfDensity || 0.3;
        r.tonnes += t; r.recovered += recovered; r.reused += reused; r.recycled += recovered - reused; r.landfill += landfill;
        r.co2AllLandfill += allLf; r.co2WithUs += withUs;
        r.landfillM3Avoided += recovered / tPerM3;
        r.rows.push({ id, name: m.name, amount, unit: m.unit, t, recovered, reused, landfill, rate: t ? recovered / t : 0, allLf, withUs, avoided: allLf - withUs });
      });
      r.co2Avoided = r.co2AllLandfill - r.co2WithUs;
      r.trees = r.co2Avoided > 0 ? r.co2Avoided / TREE_T : 0;
      r.rate = r.tonnes ? r.recovered / r.tonnes : 0;
      r.rows.sort((a, b) => b.t - a.t);
      return r;
    },
  };
  Kit.Impact = Impact;

  const n1 = (v) => num(v, Math.abs(v) < 10 ? 1 : 0);

  /* ---------- components ---------- */
  C.impactHero = (R, o = {}) => `<div class="kit-impact">
    <div class="kit-impact__main">
      <span class="kit-impact__k">${esc(o.treesLabel || 'Trees’ worth of carbon')}</span>
      <b class="kit-impact__v">${num(R.trees)}</b>
      <span class="kit-impact__d">The carbon kept out of the atmosphere equals what <b>${num(R.trees)}</b> trees absorb over ten years of growth.</span>
    </div>
    <div class="kit-impact__side">
      ${[['CO₂-e avoided', n1(R.co2Avoided), 't', 'compared with sending it all to landfill'],
        ['Kept out of landfill', n1(R.recovered), 't', `${Kit.pct(R.rate)} of ${n1(R.tonnes)} t collected`],
        ['Landfill space saved', num(R.landfillM3Avoided), 'm³', `about ${num(R.landfillM3Avoided / 0.24)} wheelie bins`]]
        .map(([k, v, u, d]) => `<div><span class="kit-impact__k">${k}</span><b>${v}<small>${u}</small></b><em>${d}</em></div>`).join('')}
    </div>
  </div>`;

  /* straight-to-landfill vs with us */
  C.vsLandfill = (R, who) => {
    const mx = Math.max(R.co2AllLandfill, Math.abs(R.co2WithUs), 0.001);
    const w = (v) => `${Math.max(0, (v / mx) * 100)}%`;
    return `<div class="kit-vs">
      <div class="kit-vs__col kit-vs__col--lf">
        <div class="kit-vs__h">If it all went to landfill</div>
        <dl>
          <div><dt>Sent to landfill</dt><dd>${n1(R.tonnes)} t</dd></div>
          <div><dt>Recovered</dt><dd>0 t</dd></div>
          <div><dt>Greenhouse gas</dt><dd>${n1(R.co2AllLandfill)} t CO₂-e</dd></div>
        </dl>
        <div class="kit-vs__bar"><i style="width:${w(R.co2AllLandfill)}"></i></div>
      </div>
      <div class="kit-vs__col kit-vs__col--us">
        <div class="kit-vs__h">With ${esc(who)}</div>
        <dl>
          <div><dt>Sent to landfill</dt><dd>${n1(R.landfill)} t</dd></div>
          <div><dt>Recovered</dt><dd>${n1(R.recovered)} t</dd></div>
          <div><dt>Greenhouse gas</dt><dd>${n1(R.co2WithUs)} t CO₂-e</dd></div>
        </dl>
        <div class="kit-vs__bar"><i style="width:${w(R.co2WithUs)}"></i></div>
      </div>
      <div class="kit-vs__diff"><span>The difference</span><b>${n1(R.co2Avoided)} t CO₂-e</b><em>${n1(R.recovered)} t kept out of landfill · ${num(R.trees)} trees’ worth of carbon</em></div>
    </div>`;
  };

  C.impactTable = (R, o = {}) => C.table([
    { label: 'Material', render: (x) => `<span class="strong">${esc(x.name)}</span>` },
    ...(o.showAmount ? [{ label: 'Collected', num: true, render: (x) => `${n1(x.amount)} ${x.unit === 'm3' ? 'm³' : x.unit === 'each' ? '' : 't'}`.trim() }] : []),
    { label: 'Tonnes', num: true, render: (x) => num(x.t, 2) },
    { label: 'Recovered', num: true, render: (x) => `<span class="green">${Kit.pct(x.rate)}</span>` },
    { label: 'To landfill', num: true, render: (x) => num(x.landfill, 2) + ' t' },
    { label: 'CO₂-e avoided', num: true, render: (x) => n1(x.avoided) + ' t' },
  ], R.rows, { empty: 'Nothing entered yet.', foot: ['Total', ...(o.showAmount ? [''] : []), num(R.tonnes, 1), Kit.pct(R.rate), num(R.landfill, 1) + ' t', n1(R.co2Avoided) + ' t'] });

  /* factors page body — editable */
  C.factorsPage = (owner) => {
    const M = Impact.materials;
    const unitLabel = (u) => (u === 'm3' ? 't per m³' : u === 'each' ? 'kg each' : '—');
    return C.note(`These are the numbers behind every impact figure. <b>Published factors</b> show their source. <b>${esc(owner)} assumptions</b> (weights, recovery rates) are starting points — change them to match your weighbridge dockets and recycler receipts. Changes save on this browser and flow straight into every page and report.`)
      + C.panel({ title: 'Materials', meta: 'tap a number to change it', flush: true, body: C.table([
        { label: 'Material', render: ([id, m]) => `<span class="strong">${esc(m.name)}</span>${m.note ? `<div class="dim kit-wrap" style="white-space:normal;max-width:260px">${esc(m.note)}</div>` : ''}` },
        { label: 'Weight', render: ([id, m]) => (m.unit === 't' ? '<span class="dim">weighed</span>' : `<input class="kit-input kit-input--num" type="number" step="any" min="0" value="${m.unit === 'each' ? Math.round(m.tPerUnit * 1000 * 10) / 10 : m.tPerUnit}" data-factor="${id}|tPerUnit|${m.unit}"> <span class="dim">${unitLabel(m.unit)}</span>`) },
        { label: 'Recovered', render: ([id, m]) => (m.weighed ? '<span class="dim">from weights entered</span>' : `<input class="kit-input kit-input--num" type="number" step="1" min="0" max="100" value="${Math.round(m.recovery * 100)}" data-factor="${id}|recovery|pct"> <span class="dim">%</span>`) },
        { label: 'Makeup (for carbon)', wrap: true, render: ([id, m]) => `<span class="dim" style="font-size:12px">${Object.entries(m.mix).map(([b, s]) => `${Math.round(s * 100)}% ${BASE[b].name.toLowerCase()}`).join(', ')}</span>` },
        { label: 'Landfill CO₂-e', num: true, render: ([id, m]) => `${num(Impact.efOf(m), 2)} <span class="dim">t/t</span>` },
        { label: 'Recycling credit', num: true, render: ([id, m]) => (Impact.creditOf(m) ? `${num(Impact.creditOf(m), 2)} <span class="dim">t/t</span>` : '<span class="dim">—</span>') },
      ], Object.entries(M)) })
      + C.panel({ title: 'Published factors used', flush: true, body: C.table([
        { label: 'Base material', render: ([k, b]) => `<span class="strong">${esc(b.name)}</span>` },
        { label: 'Landfill emissions', num: true, render: ([k, b]) => `${num(b.ef, 1)} t CO₂-e / t` },
        { label: 'Recycling credit', num: true, render: ([k, b]) => (b.credit ? `${num(b.credit, 1)} t CO₂ / t` : '—') },
        { label: 'Source', wrap: true, render: ([k, b]) => `${esc(SOURCES[b.efSrc].short)}${b.creditSrc ? ' · ' + esc(SOURCES[b.creditSrc].short) : ''}` },
      ], Object.entries(BASE)) })
      + C.panel({ title: 'How the figures are worked out', body: `<ol class="kit-method">
          <li><b>Weight.</b> Volumes (m³) and item counts are converted to tonnes with the weights above. Weighed tonnes are used as they are.</li>
          <li><b>If it all went to landfill.</b> Tonnes × the landfill emission factor for what the material is made of.</li>
          <li><b>With ${esc(owner)}.</b> Only the share that still goes to landfill is counted, less a credit for recycled metal (scrap replaces new steel).</li>
          <li><b>The difference</b> is the CO₂-e avoided. Reuse and recycling of other materials is not credited, so the figure is conservative.</li>
          <li><b>Trees.</b> CO₂-e avoided ÷ 0.060 t — what one tree seedling absorbs over ten years (US EPA).</li>
          <li><b>Landfill space.</b> Tonnes recovered ÷ material weight per m³. Wheelie bins at 240 L.</li>
        </ol><div class="kit-sources">${Object.values(SOURCES).filter((s) => s.url).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.long)}</a>`).join('')}</div>` })
      + `<div class="kit-toolbar"><button type="button" class="rgc-btn" data-action="factors-reset">Put back the starting factors</button></div>`;
  };
  document.addEventListener('change', (e) => {
    const f = e.target.closest('[data-factor]');
    if (!f) return;
    const [id, field, kind] = f.dataset.factor.split('|');
    let v = parseFloat(f.value);
    if (!isFinite(v) || v < 0) return;
    if (kind === 'pct') v = Math.min(100, v) / 100;
    if (kind === 'each') v = v / 1000;
    Impact.save(id, field, v);
    Kit.toast('Saved — every figure now uses the new number.');
  });
  Kit.action('factors-reset', () => { Impact.reset(); Kit.refresh(); Kit.toast('Starting factors restored.'); });

  /* report blocks shared by all versions */
  Kit.reportImpactBlocks = (R, who, o = {}) => [
    { title: o.heroTitle || 'The difference it made', html: C.impactHero(R) },
    { title: `${who} vs straight to landfill`, html: C.vsLandfill(R, who) },
    { title: 'By material', meta: 'estimated where weights were not measured', table: { cols: [
      { label: 'Material', render: (x) => `<span class="strong">${esc(x.name)}</span>` },
      { label: 'Tonnes', num: true, render: (x) => num(x.t, 2) },
      { label: 'Recovered', num: true, render: (x) => Kit.pct(x.rate) },
      { label: 'To landfill', num: true, render: (x) => num(x.landfill, 2) + ' t' },
      { label: 'CO₂-e avoided', num: true, render: (x) => n1(x.avoided) + ' t' },
    ], rows: R.rows, foot: ['Total', num(R.tonnes, 1), Kit.pct(R.rate), num(R.landfill, 1) + ' t', n1(R.co2Avoided) + ' t'], empty: 'Nothing recorded for this period.' } },
  ];
  Kit.reportMethodBlock = (owner) => ({ title: 'How these figures are worked out', html: `<ol class="kit-method">
      <li>Volumes and item counts are converted to tonnes using ${esc(owner)}’s weights per m³ and per item; weighed tonnes are used as recorded.</li>
      <li>“Straight to landfill” = tonnes × the landfill emission factor for each material (Australian NGA Factors 2025, Table 15; garden waste from NZ MfE 2026 until the NGA figure is confirmed).</li>
      <li>“With ${esc(owner)}” counts only what still went to landfill, less 1.5 t CO₂ for each tonne of steel recycled (worldsteel). No other recycling or reuse credit is claimed.</li>
      <li>Trees = CO₂-e avoided ÷ 0.060 t, the carbon one tree seedling absorbs over ten years (US EPA).</li>
      <li>Recovery rates and weights marked as assumptions should be confirmed against weighbridge dockets and recycler receipts.</li>
    </ol>` });
})();

</script>
