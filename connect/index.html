  const periodSelect = () => C.select('period', PERIODS.map((p) => [p.id, p.label]), periodId);
  Kit.action('select:period', (v) => { periodId = v; store.set(KEY + ':period', v); Kit.refresh(); });

  function buckets(p = P()) {
    const out = [];
    const months = (p.end.getFullYear() - p.start.getFullYear()) * 12 + p.end.getMonth() - p.start.getMonth() + 1;
    if (months <= 3) {
      const s = new Date(p.start); s.setDate(s.getDate() - ((s.getDay() + 6) % 7));
      for (let d = s; d <= p.end; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7)) {
        const e = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 6);
        out.push({ label: `${d.getDate()} ${d.toLocaleString('en-AU', { month: 'short' })}`, start: d < p.start ? p.start : d, end: e > p.end ? p.end : e });
      }
    } else {
      for (let i = 0; i < months; i++) {
        const d = new Date(p.start.getFullYear(), p.start.getMonth() + i, 1);
        out.push({ label: d.toLocaleString('en-AU', { month: 'short' }), start: d, end: new Date(d.getFullYear(), d.getMonth() + 1, 0) });
      }
    }
    return out;
  }

  /* ---------- demonstration loads (fixed seed) ---------- */
  const DEMO_RECORDS = [];
  (function generate() {
    const R = Kit.rng('globalsteel-connect-v1');
    const between = (a, b) => a + (b - a) * R();
    const pickW = (obj) => { const e = Object.entries(obj); const sum = e.reduce((a, x) => a + x[1], 0); let x = R() * sum; for (const [k, w] of e) { x -= w; if (x <= 0) return k; } return e[0][0]; };
    const start = new Date(fyStartYear(TODAY) - 1, 6, 1);
    let seq = 2000;
    DEMO_PARTNERS.forEach((c) => {
      for (let d = new Date(start); d < TODAY; d.setDate(d.getDate() + 1)) {
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        const growth = 0.7 + 0.4 * ((d - start) / (TODAY - start));
        if (R() > 0.22 * c.base * growth) continue;
        const stream = pickW(c.mix);
        const site = c.sites[Math.floor(R() * c.sites.length)];
        const S = STREAMS[stream];
        let t = { springsteel: between(6, 12), ferrous: between(2, 9), copper: between(0.2, 1.4), cable: between(0.4, 2.2), aluminium: between(0.3, 1.8), brass: between(0.1, 0.6), stainless: between(0.3, 1.6), mixed: between(1, 5) }[stream];
        t = Math.round(t * 100) / 100;
        const out = Math.round(t * S.recovery * between(0.96, 1.02) * 100) / 100;
        seq++;
        const NF = ['copper', 'cable', 'aluminium', 'brass', 'stainless'].includes(stream);
        const allowed = Object.fromEntries(Object.entries(c.dest).filter(([k]) => (NF ? ['aunf', 'aumfr', 'export'] : ['aumill', 'aufoundry', 'aumfr', 'export']).includes(k)));
        const dest = Object.keys(allowed).length ? pickW(allowed) : (NF ? 'aunf' : 'aumill');
        DEMO_RECORDS.push({ id: `D${seq}`, partner: c.id, site: site.id, date: iso(d), stream, t, out: Math.min(out, t), dest, buyer: buyerForDest(dest)?.id || null, docket: `WB-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}-${seq}`, demo: true });
      }
    });
  })();

  /* ---------- stored data ---------- */
  let data = store.get(KEY + ':data', null) || { partners: [], records: [], hideDemo: false };
  data.partners ||= []; data.records ||= [];
  const save = () => store.set(KEY + ':data', data);
  const showDemo = () => !data.hideDemo;
  const partners = () => [...(showDemo() ? DEMO_PARTNERS : []), ...data.partners];
  const partnerById = (id) => DEMO_PARTNERS.find((c) => c.id === id) || data.partners.find((c) => c.id === id);
  const siteById = (id) => { for (const c of [...DEMO_PARTNERS, ...data.partners]) { const s = c.sites.find((x) => x.id === id); if (s) return s; } return null; };
  const visible = (r) => { const c = partnerById(r.partner); return !!c && (!c.demo || showDemo()); };
  const records = () => [...(showDemo() ? DEMO_RECORDS : []), ...data.records.filter(visible)].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const mark = (name) => name.split(/\s+/).filter((w) => /^[A-Za-z0-9]/.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || 'PT';
  const siteLabel = (s) => (s ? `${s.name}${s.city ? ` · ${s.city}` : ''}${s.state ? ` ${s.state}` : ''}` : '—');

  /* the outcome of one load, in tonnes */
  function outcome(r) {
    const m = Kit.Impact.materials[r.stream];
    const recovered = r.out != null && r.out !== '' ? Math.min(r.t, Math.max(0, +r.out)) : r.t * m.recovery;
    return { recovered, residual: r.t - recovered, measured: r.out != null && r.out !== '' };
  }
  function agg(list) {
    const q = {}, ov = {};
    const dest = {};
    list.forEach((r) => {
      const o = outcome(r);
      q[r.stream] = (q[r.stream] || 0) + r.t;
      const v = ov[r.stream] || (ov[r.stream] = { recovered: 0, reused: 0 });
      v.recovered += o.recovered;
      dest[r.dest || 'stock'] = (dest[r.dest || 'stock'] || 0) + o.recovered;
    });
    const R = Kit.Impact.calc(q, ov);
    R.n = list.length;
    R.sites = new Set(list.map((r) => r.site)).size;
    R.list = list;
    R.dest = dest;
    R.domestic = DK.filter((k) => DEST[k].domestic && k !== 'stock').reduce((a, k) => a + (dest[k] || 0), 0);
    R.exported = dest.export || 0;
    R.stock = dest.stock || 0;
    return R;
  }
  const n1 = (v) => num(v, Math.abs(v) < 10 ? 1 : 0);
  const t2 = (v) => num(v, 2);
  const seriesOf = (list, p = P()) => buckets(p).map((b) => ({ b, R: agg(list.filter((r) => { const d = dOf(r.date); return d >= b.start && d <= b.end; })) }));
  const destParts = (R) => DK.filter((k) => R.dest[k]).map((k) => ({ label: DEST[k].name, value: R.dest[k], display: `${n1(R.dest[k])} t`, tone: k === 'export' ? 'reuse' : k === 'stock' ? 'landfill' : 'recycling' }));
  const whereParts = (R) => [['Recovered metal', R.recovered, 'recycling'], ['Residual', R.landfill, 'landfill']].map(([label, value, tone]) => ({ label, value, display: `${n1(value)} t`, tone }));
  const demoTag = (list) => (list.some((r) => r.demo) ? ' <span class="kit-tag kit-tag--ghost">Demo figures</span>' : '');

  /* ---------- scale comparisons (plain arithmetic, basis stated) ---------- */
  const compareMetal = (t) => {
    if (!(t > 0)) return '';
    const cars = t / 0.9, boxes = t / 25;
    return `<b>${num(t, t < 100 ? 1 : 0)} t</b> of recovered metal is about the steel in <b>${num(cars)}</b> family cars (≈0.9 t of steel each), or <b>${num(boxes, boxes < 10 ? 1 : 0)}</b> 40-ft containers of bales (≈25 t a box).`;
  };
  const compareCo2 = (t) => (t > 0 ? `<b>${n1(t)} t CO₂-e</b> is roughly what <b>${num(t / 4.6, t / 4.6 < 10 ? 1 : 0)}</b> cars emit in a year (US EPA: 4.6 t a car).` : '');
  Kit.compareTonnes = compareMetal;

  /* ---------- metals versions of the kit's impact blocks ---------- */
  C.impactHero = (R) => `<div class="kit-impact">
    <div class="kit-impact__main">
      <span class="kit-impact__k">CO₂-e avoided</span>
      <b class="kit-impact__v">${n1(R.co2Avoided)}<small style="font-size:.4em;margin-left:6px">t</small></b>
      <span class="kit-impact__d">By putting <b>${n1(R.recovered)} t</b> of recovered metal back into production instead of making it new — the carbon <b>${num(R.trees)}</b> trees absorb over ten years.</span>
    </div>
    <div class="kit-impact__side">
      ${[['Weighed in', n1(R.tonnes), 't', `${num(R.n)} load${R.n === 1 ? '' : 's'}`],
        ['Recovered', n1(R.recovered), 't', `${pct(R.rate)} of what came in`],
        ['New metal displaced', n1(R.recovered), 't', 'of ore-based metal that did not need to be made']]
        .map(([k, v, u, d]) => `<div><span class="kit-impact__k">${k}</span><b>${v}<small>${u}</small></b><em>${d}</em></div>`).join('')}
    </div>
  </div>`;
  C.vsLandfill = (R, who) => {
    const mx = Math.max(R.co2Avoided, 0.001);
    return `<div class="kit-vs">
      <div class="kit-vs__col kit-vs__col--lf">
        <div class="kit-vs__h">If it went to landfill</div>
        <dl>
          <div><dt>Metal lost</dt><dd>${n1(R.tonnes)} t</dd></div>
          <div><dt>Made new from ore instead</dt><dd>${n1(R.recovered)} t</dd></div>
          <div><dt>Carbon from making it</dt><dd>${n1(R.co2Avoided)} t CO₂-e</dd></div>
        </dl>
        <div class="kit-vs__bar"><i style="width:100%"></i></div>
      </div>
      <div class="kit-vs__col kit-vs__col--us">
        <div class="kit-vs__h">With ${esc(who)}</div>
        <dl>
          <div><dt>Metal recovered</dt><dd>${n1(R.recovered)} t</dd></div>
          <div><dt>Residual</dt><dd>${n1(R.landfill)} t</dd></div>
          <div><dt>Carbon from making it new</dt><dd>0 t CO₂-e</dd></div>
        </dl>
        <div class="kit-vs__bar"><i style="width:${Math.max(0, (0 / mx) * 100)}%"></i></div>
      </div>
      <div class="kit-vs__diff"><span>The difference</span><b>${n1(R.co2Avoided)} t CO₂-e</b><em>${n1(R.recovered)} t back into production · ${num(R.trees)} trees’ worth of carbon</em></div>
    </div>`;
  };
  const chainStrip = (R) => `<div class="rf-chain">
    <div><span>1 · Weighed in</span><b>${n1(R.tonnes)}<small>t</small></b><em>${num(R.n)} load${R.n === 1 ? '' : 's'} over the weighbridge</em></div>
    <div><span>2 · Turned into</span><b>${R.rows.length}<small>product${R.rows.length === 1 ? '' : 's'}</small></b><em>${R.rows.slice(0, 2).map((x) => esc(STREAMS[x.id].product.split(' — ')[0])).join(' · ') || '—'}</em></div>
    <div><span>3 · Recovered</span><b>${n1(R.recovered)}<small>t</small></b><em>${pct(R.rate)} · ${n1(R.domestic)} t to Australian buyers · ${n1(R.exported)} t exported</em></div>
    <div><span>4 · Saving</span><b>${n1(R.co2Avoided)}<small>t CO₂-e</small></b><em>${num(R.trees)} trees’ worth of carbon</em></div>
  </div>`;
  Kit.reportImpactBlocks = (R, who) => [
    { title: 'Weighed in → turned into → recovered → saving', html: chainStrip(R) },
    { title: 'The difference it made', html: C.impactHero(R) },
    { title: `${who} vs landfill`, html: C.vsLandfill(R, who) },
    { title: 'By metal', meta: 'recovered weights measured unless marked', table: { cols: [
      { label: 'Metal in', render: (x) => `<span class="strong">${esc(x.name)}</span><div class="dim">${esc(STREAMS[x.id].product)}</div>` },
      { label: 'Weighed in', num: true, render: (x) => num(x.t, 2) + ' t' },
      { label: 'Recovered', num: true, render: (x) => `${num(x.recovered, 2)} t <span class="dim">(${pct(x.rate)})</span>` },
      { label: 'Residual', num: true, render: (x) => num(x.landfill, 2) + ' t' },
      { label: 'CO₂-e avoided', num: true, render: (x) => n1(x.avoided) + ' t' },
    ], rows: R.rows, foot: ['Total', num(R.tonnes, 1) + ' t', `${num(R.recovered, 1)} t (${pct(R.rate)})`, num(R.landfill, 1) + ' t', n1(R.co2Avoided) + ' t'], empty: 'Nothing recorded for this period.' } },
  ];
  Kit.reportMethodBlock = (owner) => ({ title: 'How these figures are worked out', html: `<ol class="kit-method">
      <li><b>Weighed in.</b> Every load crosses the weighbridge at North Geelong; the docket weight is the figure used.</li>
      <li><b>Turned into.</b> The load is processed on the line for its metal — the product it becomes is recorded against the load.</li>
      <li><b>Recovered.</b> The saleable metal weighed out. Where an output weight was not recorded, ${esc(owner)}’s usual recovery rate for that metal is used and the load is marked as an estimate.</li>
      <li><b>Saving.</b> Tonnes recovered × the published recycling credit for that metal — the carbon avoided by not making the same metal new from ore, net of collection and reprocessing (steel 1.5 t CO₂/t, worldsteel; copper 5.2, aluminium 7.9 and mixed metals 4.8 t CO₂-e/t, US EPA WARM). Metal in landfill does not break down, so no landfill methane is claimed.</li>
      <li><b>Trees.</b> CO₂-e avoided ÷ 0.060 t, what one tree seedling absorbs over ten years (US EPA).</li>
      <li>Factors marked as stand-ins (brass, stainless) and usual recovery rates should be read as estimates.</li>
    </ol>` });

  /* ---------- which partner the portal shows ---------- */
  let partnerId = store.get(KEY + ':partner', 'edc');
  const PT = () => { const list = partners(); return list.find((c) => c.id === partnerId) || list[0] || null; };
  const myRecords = (c = PT()) => (c ? records().filter((r) => r.partner === c.id) : []);

  /* ---------- boot ---------- */
  const partnerSide = {
    key: 'partner', label: 'Partners', home: 'overview', enter: 'Partner portal',
    searchLabel: 'Search loads, sites and dockets',
    nav: [
      { id: 'overview', label: 'Overview', icon: 'grid' },
      { id: 'loads', label: 'Your loads', icon: 'collection' },
      { id: 'journey', label: 'Where it went', icon: 'recovery' },
      { id: 'impact', label: 'Environmental saving', icon: 'impact' },
      { id: 'sites', label: 'Sites', icon: 'sites' },
      { id: 'reports', label: 'Statements & reports', icon: 'reporting' },
      { divider: 'About the numbers' },
      { id: 'method', label: 'How it’s worked out', icon: 'info' },
    ],
    get user() { const c = PT(); return { name: c ? c.contact || 'Partner' : 'Partner', role: c ? c.name : 'No partner yet' }; },
    get org() { const c = PT(); return c ? { mark: mark(c.name), name: c.name, sub: `${c.sites.length} site${c.sites.length === 1 ? '' : 's'} · ${c.type || 'Partner'}` } : { mark: 'GS', name: 'No partner yet', sub: 'Add one on the corporate side' }; },
  };
  /* ---------- which buyer the buyer portal shows ---------- */
  let buyerId = store.get(KEY + ':buyer', 'b-mill');
  const BY = () => (showDemo() ? DEMO_BUYERS.find((b) => b.id === buyerId) || DEMO_BUYERS[0] : null);
  const buyerSide = {
    key: 'buyer', label: 'Buyers', home: 'overview', enter: 'Buyer portal',
    searchLabel: 'Search dispatches, consignments and containers',
    nav: [
      { id: 'overview', label: 'Overview', icon: 'grid' },
      { id: 'dispatches', label: 'Dispatches', icon: 'collection' },
      { id: 'metals', label: 'Metals received', icon: 'materials' },
      { id: 'content', label: 'Recycled content', icon: 'recovery' },
      { id: 'statements', label: 'Statements', icon: 'reporting' },
      { divider: 'About the numbers' },
      { id: 'method', label: 'How it’s worked out', icon: 'info' },
    ],
    get user() { const b = BY(); return { name: b ? b.contact : 'Buyer', role: b ? b.name : 'No buyer yet' }; },
    get org() { const b = BY(); return b ? { mark: mark(b.name), name: b.name, sub: `${b.type} · ${b.city} ${b.state}` } : { mark: 'GS', name: 'No buyer yet', sub: 'Demo buyers are switched off' }; },
  };
  const corpSide = {
    key: 'corp', label: 'Corporate', home: 'overview', enter: 'Global Steel corporate',
    searchLabel: 'Search partners, sites, loads',
    nav: [
      { id: 'overview', label: 'Overview', icon: 'grid' },
      { id: 'record', label: 'Record a load', icon: 'plus' },
      { id: 'partners', label: 'Partners', icon: 'portfolio' },
      { id: 'loads', label: 'All loads', icon: 'collection' },
      { id: 'metals', label: 'Metals & outputs', icon: 'materials' },
      { id: 'dispatch', label: 'Dispatch & buyers', icon: 'recovery' },
      { id: 'reports', label: 'Reports', icon: 'reporting' },
      { divider: 'Settings' },
      { id: 'data', label: 'Data & backup', icon: 'layers' },
      { id: 'factors', label: 'Factors', icon: 'settings' },
    ],
    user: { name: WHO, role: 'Corporate' },
    get org() { return { mark: 'GS', name: WHO, sub: `${partners().length} partner${partners().length === 1 ? '' : 's'} · recorded and reported` }; },
  };

  Kit.boot({
    title: 'Global Steel Connect',
    product: { name: 'Global Steel Connect', word: 'Connect', logo: ASSETS.logo, logoH: 30, logoAlt: 'Global Steel' },
    get demo() { return showDemo() ? { badge: 'Demo partners on', text: 'The six demonstration partners and their loads are fictional. Turn them off under Corporate → Data & backup once real loads are going in.' } : null; },
    login: {
      line: 'Weighed in. Turned into. Recovered. Reported.',
      sub: 'Partners see every load they sent to Global Steel — the weight over the weighbridge, what it was turned into, how much metal was recovered, where it went and the carbon that saved. Global Steel records the numbers and issues the statements.',
      foot: 'Global Steel · Connect',
      note: 'Choose a side of the platform.',
      small: 'No account needed in this version. Numbers entered are saved on this browser only.',
    },
    sides: [partnerSide, buyerSide, corpSide],
    topRight: (side) => {
      if (side.key === 'corp') return `<a class="rgc-btn rgc-btn--sm" href="#/partner/overview">${icon('external', 14)} Partner portal</a> <a class="rgc-btn rgc-btn--sm" href="#/buyer/overview">${icon('external', 14)} Buyer portal</a>`;
      if (side.key === 'buyer') return showDemo() ? `<span class="kit-noprint" title="Choose which buyer’s portal to view">${C.select('buyer', DEMO_BUYERS.map((b) => [b.id, b.name]), BY()?.id)}</span>` : '';
      const list = partners();
      return list.length > 1 ? `<span class="kit-noprint" title="Choose which partner’s portal to view">${C.select('partner', list.map((c) => [c.id, c.name]), PT()?.id)}</span>` : '';
    },
    search: (side) => {
      if (side.key === 'buyer') return myDispatches().slice(0, 300).map((d) => ({ t: d.id, d: `${fmtDate(d.date)} · ${d.products.join(', ')} · ${n1(d.t)} t${d.container ? ' · ' + d.container : ''}`, href: `#/buyer/dispatches/${d.id}` }));
      const cl = side.key === 'partner' ? (PT() ? [PT()] : []) : partners();
      const recs = side.key === 'partner' ? myRecords() : records();
      return [
        ...(side.key === 'corp' ? cl.map((c) => ({ t: c.name, d: `Partner · ${c.type || ''}`, href: `#/corp/partners/${c.id}` })) : []),
        ...cl.flatMap((c) => c.sites.map((s) => ({ t: s.name, d: `Site · ${s.city || ''} ${s.state || ''}${side.key === 'corp' ? ' · ' + c.name : ''}`, href: side.key === 'partner' ? `#/partner/sites/${s.id}` : `#/corp/partners/${c.id}` }))),
        ...recs.slice(0, 400).map((r) => ({ t: r.docket || fmtDate(r.date), d: `${STREAMS[r.stream].name} · ${siteById(r.site)?.name || ''} · ${fmtDate(r.date)} · ${t2(r.t)} t`, href: `#/${side.key}/loads/${r.id}` })),
      ];
    },
  });
  Kit.action('select:partner', (v) => { partnerId = v; store.set(KEY + ':partner', v); if (!/^#\/partner\/(overview|loads|journey|impact|sites|reports|method)$/.test(location.hash)) Kit.go('#/partner/overview'); Kit.refresh(); });
  const usePartner = (id) => { if (id && id !== partnerId && partnerById(id)) { partnerId = id; store.set(KEY + ':partner', id); } };
  Kit.action('select:buyer', (v) => { buyerId = v; store.set(KEY + ':buyer', v); if (!/^#\/buyer\/(overview|dispatches|metals|content|statements|method)$/.test(location.hash)) Kit.go('#/buyer/overview'); Kit.refresh(); });
  Kit.action('open-buyer', (btn) => { if (buyerById(btn.dataset.id)) { buyerId = btn.dataset.id; store.set(KEY + ':buyer', buyerId); } Kit.go('#/buyer/overview'); });

  /* ---------- shared blocks ---------- */
  const auPins = (sites, hrefFn) => sites.map((s) => { const pl = place(s.city, s.state); return { id: s.id, ...Kit.AU.project(pl.lat, pl.lng), title: `${s.name} — ${s.city || ''} ${s.state || ''}`, href: hrefFn(s) }; });
  const noPartner = () => ({ title: 'No partners yet', html: C.note(`There are no partners to show. Add one under <a class="kit-green" href="#/corp/record?tab=partner">Corporate → Record a load → Add a partner</a>, or switch the demonstration partners back on under <a class="kit-green" href="#/corp/data">Data &amp; backup</a>.`) });
  const reportBtn = (action, dataset = {}, label = 'Download statement') => C.btn(label, { icon: 'download', action, primary: true, data: dataset });

  function loadsTable(list, side, o = {}) {
    return C.table([
      { label: 'Date', render: (r) => `<span class="strong">${fmtDate(r.date)}</span>` },
      ...(o.partner ? [{ label: 'Partner', render: (r) => esc(partnerById(r.partner)?.name || '—') }] : []),
      ...(o.site === false ? [] : [{ label: 'Site', render: (r) => { const s = siteById(r.site); return s ? `${esc(s.name)}<div class="dim">${esc(s.city || '')} ${esc(s.state || '')}</div>` : '—'; } }]),
      { label: 'Metal in', render: (r) => `${esc(STREAMS[r.stream].name)}<div class="dim">${esc(STREAMS[r.stream].product.split(' — ')[0])}</div>` },
      { label: 'Weighed in', num: true, render: (r) => t2(r.t) + ' t' },
      { label: 'Recovered', num: true, render: (r) => { const o2 = outcome(r); return `<span class="green">${t2(o2.recovered)} t</span><div class="dim">${pct(r.t ? o2.recovered / r.t : 0)}${o2.measured ? '' : ' · est.'}</div>`; } },
      { label: 'Went to', render: (r) => esc(DEST[r.dest || 'stock'].short) },
      { label: 'Docket', dim: true, render: (r) => esc(r.docket || '') },
      ...(o.remove ? [{ label: '', render: (r) => (r.demo ? '<span class="dim">demo</span>' : `<button type="button" class="rgc-btn rgc-btn--sm" data-action="record-remove" data-id="${esc(r.id)}">Remove</button>`) }] : []),
    ], list.slice(0, o.limit || 500), { rowHref: (r) => `#/${side}/loads/${r.id}`, empty: o.empty || 'No loads recorded for this period.' })
      + (list.length > (o.limit || 500) ? `<div class="kit-empty">Showing the latest ${o.limit || 500} of ${num(list.length)}. Export CSV for the full list.</div>` : '');
  }

  function overviewBody(list, side, o = {}) {
    const R = agg(list);

  /* ======================================================================

     ====================================================================== */
  const BALED = { springsteel: 0.55, ferrous: 0.6, aluminium: 0.35 }; // nominal tonnes per bale, demonstration only
  const DISPATCHES = (() => {
    const out = [];
    const R = Kit.rng('globalsteel-dispatch-v1');
    const addDays = (d, n) => { const x = new Date(d); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); if (x.getDay() !== 0 && x.getDay() !== 6) k++; } return x; };
    const days = (a, b) => Math.round((dOf(b) - dOf(a)) / 86400000);
    let seq = 100;
    DEMO_BUYERS.forEach((b) => {
      const recs = DEMO_RECORDS.filter((r) => r.buyer === b.id).sort((x, y) => (x.date < y.date ? -1 : 1));
      let cur = null;
      const flush = () => {
        if (!cur) return;
        seq++;
        const dd = addDays(dOf(cur.last), 1 + Math.floor(R() * 3));
        if (dd > TODAY) { cur = null; return; } // still being accumulated — not dispatched yet
        const date = iso(dd);
        const streams = [...new Set(cur.lines.map((l) => l.r.stream))];
        const bales = cur.lines.reduce((a, l) => a + (BALED[l.r.stream] ? Math.round(l.t / BALED[l.r.stream]) : 0), 0);
        out.push({ id: `DS-${date.slice(2, 4)}${date.slice(5, 7)}-${seq}`, buyer: b.id, date, first: cur.first, last: cur.last, lines: cur.lines, t: cur.t, streams,
          products: streams.map((k) => STREAMS[k].product.split(' — ')[0]), bales: bales || null,
          container: b.dest === 'export' ? `DEMU ${String(5000000 + seq * 7).padStart(7, '0')}` : null,
          vehicle: b.dest === 'export' ? 'Container · 40 ft' : (cur.t > 14 ? 'B-double' : 'Semi-trailer'), demo: true });
        cur = null;
      };
      recs.forEach((r) => {
        const o = outcome(r);
        if (cur && (cur.t + o.recovered > b.target * 1.15 || days(cur.first, r.date) > 9)) flush();
        if (!cur) cur = { first: r.date, lines: [], t: 0 };
        cur.lines.push({ r, t: o.recovered });
        cur.t += o.recovered; cur.last = r.date;
      });
      flush();
    });
    return out.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  })();
  const dispatches = () => (showDemo() ? DISPATCHES : []);
  const myDispatches = (b = BY()) => (b ? dispatches().filter((d) => d.buyer === b.id) : []);
  const dispatchById = (id) => dispatches().find((d) => d.id === id);
  const inPeriodD = (d, p = P()) => { const x = dOf(d.date); return x >= p.start && x <= p.end; };
  const noBuyer = () => ({ title: 'Buyer portal', html: C.note('The buyer portal shows the five demonstration buyers. Switch demonstration data back on under <a class="kit-green" href="#/corp/data">Corporate → Data &amp; backup</a> to see it. Accounts for your own buyers come with the next version.') });

  /* aggregate a set of dispatches by product and by origin class */
  function aggD(list) {
    const byStream = {}, byOrigin = {};
    let t = 0, n = 0, bales = 0, containers = 0;
    list.forEach((d) => {
      n++; t += d.t; bales += d.bales || 0; if (d.container) containers++;
      d.lines.forEach((l) => {
        const v = byStream[l.r.stream] || (byStream[l.r.stream] = { t: 0, n: 0 });
        v.t += l.t; v.n++;
        const c = partnerById(l.r.partner);
        const o = ORIGIN[c?.type] || 'post-consumer';
        byOrigin[o] = (byOrigin[o] || 0) + l.t;
      });
    });
    const recs = list.flatMap((d) => d.lines.map((l) => l.r));
    const R = recs.length ? agg(recs) : null;
    return { n, t, bales, containers, byStream, byOrigin, R, loads: recs.length,
      rows: Object.entries(byStream).map(([k, v]) => ({ k, S: STREAMS[k], ...v })).sort((a, b) => b.t - a.t) };
  }
  const seriesD = (list, p = P()) => buckets(p).map((b) => ({ b, A: aggD(list.filter((d) => { const x = dOf(d.date); return x >= b.start && x <= b.end; })) }));
  const originParts = (A) => Object.entries(A.byOrigin).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k[0].toUpperCase() + k.slice(1), value: v, display: `${n1(v)} t`, tone: k.startsWith('pre') ? 'processed' : 'recycling' }));
  const contentBasis = (b) => `<ul style="margin:0;padding-left:16px;color:var(--app-text-2);display:grid;gap:6px;font-size:13px">
      <li><b>Recycled content: 100%.</b> Everything dispatched is recovered scrap — no virgin metal is added at any stage.</li>
      <li><b>Origin:</b> recovered and processed at the Recycle Group facility, 116 Furner Avenue, North Geelong VIC 3215. Australian material, Australian processing.</li>
      <li><b>Class:</b> post-consumer (mattresses, demolition, council and fit-out material) or pre-consumer (manufacturing offcuts) — shown per dispatch and per line.</li>
      <li><b>Weights:</b> every figure is the weighed output of the processing line. Lines marked * use the usual recovery rate for that metal because the output was not separately weighed.</li>
      ${b && b.dest === 'aumill' ? '<li><b>Carbon:</b> scrap-based EAF steel averages 0.70 t CO₂ per tonne of crude steel against 2.32 t for blast-furnace steel (World Steel Association, 2023 data). The mill’s own EPD governs its product; Global Steel documents the scrap side.</li>' : ''}
      <li><b>What is not claimed:</b> the CO₂-e avoided by recycling this metal is reported to the partner who supplied it. Buyers see it for information, not as a credit.</li>
    </ul>`;

  function dispatchTable(list, o = {}) {
    return C.table([
      { label: 'Dispatched', render: (d) => `<span class="strong">${fmtDate(d.date)}</span><div class="dim">${esc(d.id)}</div>` },
      { label: 'Product', wrap: true, render: (d) => d.products.map((p) => esc(p)).join('<br>') },
      { label: 'Weighed out', num: true, render: (d) => `<span class="green">${t2(d.t)} t</span><div class="dim">${d.lines.length} load${d.lines.length === 1 ? '' : 's'}</div>` },
      { label: 'Bales', num: true, render: (d) => (d.bales ? num(d.bales) : '<span class="dim">loose / lots</span>') },

    const list = partners();

  };
  const formRecord = () => ({ partner: form.partner, site: form.site, date: form.date, stream: form.stream, t: parseFloat(form.t) > 0 ? parseFloat(form.t) : 0,
    out: form.mode === 'weighed' && form.out !== '' ? +form.out : null, dest: form.dest, docket: String(form.docket || '').trim(), note: String(form.note || '').trim() });
  const livePreview = () => {
    const r = formRecord();

    set('t', r.t ? t2(r.t) : '0'); set('rec', pct(R.rate)); set('co2', n1(R.co2Avoided)); set('trees', num(R.trees));
    set('warn', r.out != null && r.out > r.t + 1e-9 ? 'Recovered can’t be more than what was weighed in.' : '');

  const TABS = [['one', 'Record a load'], ['paste', 'Paste a weighbridge list'], ['partner', 'Add a partner']];
  Kit.route('corp/record', (_, q) => {

    const page = { title: 'Record a load', sub: 'Weighed in, turned into, recovered, where it went. Everything saves on this browser straight away.', demo: false, right: tabs };

        </div>` })

          C.panel({ title: '2 · Turned into  →  3 · Recovered', body: `<div class="kit-entry"><p class="kit-muted" style="font-size:13px"><b>${esc(S.product)}</b> — ${esc(S.path)}.</p>
            ${C.pick('rec-mode', [['usual', 'Usual recovery', `${pct(M.recovery)} — marked as an estimate`], ['weighed', 'Weighed out', 'enter the output weight']], form.mode, { big: true })}
            ${form.mode === 'weighed' ? `<div class="kit-steps">${C.stepper('', form.out, { label: 'Recovered metal', unit: 't', step: 0.1, big: true, attr: 'data-form="out"' })}</div><p class="kit-muted" style="font-size:12.5px">The rest is residual. <b class="kit-warn" data-live="warn"></b></p>` : ''}
          </div>` }),
          C.panel({ title: '4 · Where it went', body: `<div class="kit-entry">${C.pick('rec-dest', DK.map((k) => [k, DEST[k].name]), form.dest)}<p class="kit-muted" style="font-size:12.5px">Choose “In stock” if the load is processed but not yet dispatched — update it later from the load’s page.</p></div>` }))
        + C.panel({ body: `<div class="kit-entry">
            <div class="kit-toolbar">${field('Docket / reference', `<input class="rgc-input" type="text" value="${esc(form.docket)}" placeholder="e.g. WB-10442" data-form="docket">`)}${field('Note (optional)', `<input class="rgc-input" type="text" value="${esc(form.note)}" placeholder="Shown on the load" data-form="note">`)}</div>
            <div class="kit-entry__bar">
              <span class="kit-entry__meta grow"><span><b data-live="t">0</b> t in</span><span><b data-live="rec">0%</b> recovered</span><span><b data-live="co2">0</b> t CO₂-e avoided</span><span><b data-live="trees">0</b> trees’ worth</span></span>
              <button type="button" class="rgc-btn" data-action="form-clear">Clear</button>
              <button type="button" class="rgc-btn rgc-btn--primary kit-bigbtn" data-action="record-save">${icon('check', 16)} Save load</button>
            </div></div>` })
        + C.panel({ title: 'Recently recorded on this browser', flush: true, body: loadsTable(mine, 'corp', { partner: true, remove: true, empty: 'Nothing recorded yet.' }) }),
      after: () => livePreview(),
    };
  });
  const onForm = (e) => {
    const f = e.target.closest('[data-form]');

    form[f.dataset.form] = f.value;
    saveForm(); livePreview();
  };
  document.addEventListener('input', onForm);
  document.addEventListener('change', onForm);
  Kit.action('pick:rec-partner', (v) => { form.partner = v; form.site = ''; fixForm(); saveForm(); Kit.refresh(); });
  Kit.action('select:rec-partner', (v) => { form.partner = v; form.site = ''; fixForm(); saveForm(); Kit.refresh(); });

  Kit.action('pick:rec-stream', (v) => { form.stream = v; saveForm(); Kit.refresh(); });
  Kit.action('pick:rec-mode', (v) => { form.mode = v; saveForm(); Kit.refresh(); });
  Kit.action('pick:rec-dest', (v) => { form.dest = v; saveForm(); });
  Kit.action('form-clear', () => { Object.assign(form, { t: '', out: '', docket: '', note: '' }); saveForm(); Kit.refresh(); });
  const newId = () => 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  Kit.action('record-save', () => {
    fixForm();
    const r = formRecord();

    if (!(r.t > 0)) { Kit.toast('Enter the weighbridge weight.'); return; }

    data.records.push(rec); save();
    const R = agg([rec]);
    Object.assign(form, { t: '', out: '', docket: '', note: '' }); saveForm();
    Kit.refresh();
    Kit.toast(`Saved — ${t2(rec.t)} t ${STREAMS[rec.stream].name.toLowerCase()} from ${partnerById(rec.partner).name}. ${pct(R.rate)} recovered, ${n1(R.co2Avoided)} t CO₂-e avoided.`);
  });
  let removeArm = '';
  Kit.action('record-remove', (btn) => {
    const id = btn.dataset.id;
    if (removeArm !== id) { removeArm = id; btn.textContent = 'Tap again to remove'; setTimeout(() => { if (removeArm === id) removeArm = ''; }, 4000); return; }
    removeArm = '';
    data.records = data.records.filter((r) => r.id !== id); save();
    if (btn.dataset.back) Kit.go('#/corp/loads');
    Kit.refresh(); Kit.toast('Load removed.');
  });

  /* paste a weighbridge list */
  let pending = [];
  let autoCreate = store.get(KEY + ':auto-create', true);
  const MAT_ALIAS = [['springsteel', /spring|mattress/], ['cable', /cable|wire|lead/], ['copper', /copper|\bcu\b/], ['aluminium', /alumin|\bal\b/], ['brass', /brass/], ['stainless', /stainless|\bss\b/], ['mixed', /mixed|e-?waste|appliance|whitegood/], ['ferrous', /ferrous|steel|iron|scrap|metal/]];
  const matchStream = (v) => { const s = String(v || '').toLowerCase(); const hit = SK.find((k) => k === s || STREAMS[k].name.toLowerCase() === s) || (MAT_ALIAS.find(([, re]) => re.test(s)) || [])[0]; return hit || null; };
  const matchDest = (v) => { const s = String(v || '').toLowerCase(); if (!s) return null; if (/export|container|ship/.test(s)) return 'export'; if (/foundry/.test(s)) return 'aufoundry'; if (/manufact/.test(s)) return 'aumfr'; if (/non|copper|alumin|nf/.test(s)) return 'aunf'; if (/stock|held|yard/.test(s)) return 'stock'; if (/mill|steel|au/.test(s)) return 'aumill'; return null; };
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function parseDate(v) {
    const s = String(v || '').trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(new Date(+m[1], m[2] - 1, +m[3]));
    if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/))) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return iso(new Date(y, m[2] - 1, +m[1])); }
    if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{2,4})$/)) && MON[m[2].toLowerCase()]) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return iso(new Date(y, MON[m[2].toLowerCase()] - 1, +m[1])); }
    return null;
  }
  const COLS = { date: /date|day/, partner: /partner|client|customer|supplier|account/, site: /site|location|address|branch|yard/, stream: /metal|material|stream|product|type/, t: /tonne|weight|net|gross|kg|\bin\b|\bt\b/, out: /recovered|out|output|yield/, dest: /dest|went|buyer|sold|to$/, docket: /docket|ticket|ref|weighbridge|wb/, city: /city|suburb|town/, state: /state/ };
  function parsePaste(text) {
    const rows = Kit.parseTable(text);
    if (!rows.length) return [];
    const head = rows[0].map((h) => String(h).toLowerCase());
    const hasHead = !parseDate(rows[0][0]) && head.some((h) => /date|partner|client|metal|tonne|weight/.test(h));
    const idx = {};
    if (hasHead) {
      const used = new Set();
      ['out', 'docket', 'date', 'partner', 'site', 'stream', 'dest', 't', 'city', 'state'].forEach((k) => { const i = head.findIndex((h, j) => !used.has(j) && COLS[k].test(h)); if (i >= 0) { idx[k] = i; used.add(i); } });
    } else Object.assign(idx, { date: 0, partner: 1, site: 2, stream: 3, t: 4, out: 5, dest: 6, docket: 7 });
    const kg = hasHead && idx.t != null && /kg/.test(head[idx.t]);
    const cell = (r, k) => (idx[k] != null ? String(r[idx[k]] ?? '').trim() : '');
    return rows.slice(hasHead ? 1 : 0).map((r, n) => {
      const out = { line: n + 1 + (hasHead ? 1 : 0), raw: r, problems: [] };
      out.date = parseDate(cell(r, 'date'));
      if (!out.date) out.problems.push('date');
      const cname = cell(r, 'partner');
      const cl = partners().find((c) => c.name.toLowerCase() === cname.toLowerCase()) || (cname.length > 3 ? partners().find((c) => c.name.toLowerCase().includes(cname.toLowerCase())) : null);
      out.partnerName = cl ? cl.name : cname; out.partnerId = cl?.id || null;
      if (!cname) out.problems.push('partner'); else if (!cl && !autoCreate) out.problems.push('unknown partner');
      const sname = cell(r, 'site');
      const st = cl ? cl.sites.find((s) => s.name.toLowerCase() === sname.toLowerCase()) || (sname ? cl.sites.find((s) => s.name.toLowerCase().includes(sname.toLowerCase())) : cl.sites.length === 1 ? cl.sites[0] : null) : null;
      out.siteName = st ? st.name : sname || 'Main site'; out.siteId = st?.id || null;
      out.city = cell(r, 'city'); out.state = cell(r, 'state').toUpperCase();
      if (!st && cl && !autoCreate) out.problems.push('unknown site');
      out.stream = matchStream(cell(r, 'stream'));
      if (!out.stream) out.problems.push('metal');
      let t = Kit.numberFrom(cell(r, 't'));
      if (t != null && kg) t /= 1000;
      out.t = t;
      if (!(t > 0)) out.problems.push('tonnes');
      let o = Kit.numberFrom(cell(r, 'out'));
      if (o != null && kg) o /= 1000;
      out.out = o != null ? o : null;
      if (out.out != null && t > 0 && out.out > t + 1e-9) out.problems.push('recovered > in');
      out.dest = matchDest(cell(r, 'dest')) || 'aumill';
      out.docket = cell(r, 'docket');
      return out;
    });
  }
  function pasteTab() {
    const ok = pending.filter((p) => !p.problems.length);
    return C.grid('1fr 1fr',
      C.panel({ title: 'Paste from Excel, Google Sheets or a weighbridge export', body: `<p class="kit-muted" style="font-size:13px;margin-bottom:10px;line-height:1.55">Copy the rows (with the heading row if there is one) and paste below. Headings are matched automatically — <b>Date, Partner, Site, Metal, Tonnes</b>, and optionally <b>Recovered t, Went to, Docket, City, State</b>. Weights in kg are converted when the heading says kg. Without headings, columns are read in that order.</p>
        <textarea class="rgc-input kit-paste" data-paste-rec placeholder="Date&#9;Partner&#9;Site&#9;Metal&#9;Tonnes&#9;Recovered t&#9;Went to&#9;Docket&#10;3/9/2026&#9;Example Demolition Contractors&#9;Laverton yard&#9;Ferrous&#9;6.4&#9;6.2&#9;AU mill&#9;WB-10442"></textarea>
        <div class="rgc-row" style="grid-template-columns:1fr auto;padding:12px 0 0;border:0"><span><div class="rgc-row__t">Set up partners and sites that aren’t in Connect yet</div><div class="rgc-row__d">Otherwise those rows are skipped.</div></span><span class="rgc-row__r">${C.toggle(autoCreate, 'auto-create')}</span></div>
        <div class="kit-toolbar" style="margin-top:12px"><button type="button" class="rgc-btn rgc-btn--primary" data-action="paste-check">Check the rows</button></div>` }),
      C.panel({ title: 'Check before adding', meta: pending.length ? `${ok.length} of ${pending.length} rows ready` : 'paste and check first', flush: true, body: pending.length
        ? C.table([
          { label: 'Row', dim: true, render: (p) => p.line },
          { label: 'Date', render: (p) => (p.date ? fmtDate(p.date) : '<span class="kit-warn">?</span>') },
          { label: 'Partner · site', render: (p) => `${esc(p.partnerName || '?')}${p.partnerId ? '' : ' <span class="kit-tag kit-tag--ghost">new</span>'}<div class="dim">${esc(p.siteName)}${p.siteId || !p.partnerName ? '' : ' · new site'}</div>` },
          { label: 'Metal', render: (p) => (p.stream ? esc(STREAMS[p.stream].name) : '<span class="kit-warn">?</span>') },
          { label: 'In / out', num: true, render: (p) => `${p.t > 0 ? t2(p.t) : '<span class="kit-warn">?</span>'}${p.out != null ? ` / ${t2(p.out)}` : ''}` },
          { label: '', render: (p) => (p.problems.length ? `<span class="kit-warn">Check ${esc(p.problems.join(', '))}</span>` : '<span class="green">Ready</span>') },
        ], pending) + `<div class="kit-toolbar" style="padding:14px 18px"><button type="button" class="rgc-btn rgc-btn--primary" data-action="paste-add"${ok.length ? '' : ' disabled'}>${icon('check', 15)} Add ${ok.length} load${ok.length === 1 ? '' : 's'}</button><button type="button" class="rgc-btn" data-action="paste-reset">Start again</button></div>`
        : '<div class="kit-empty">Rows you paste show here so you can check them before anything is added.</div>' }));
  }
  Kit.action('toggle:auto-create', (on) => { autoCreate = on; store.set(KEY + ':auto-create', on); });
  Kit.action('paste-check', () => {
    const box = document.querySelector('[data-paste-rec]');
    pending = parsePaste(box?.value || '');
    Kit.refresh();
    if (!pending.length) Kit.toast('Nothing to read — paste some rows first.');
  });
  Kit.action('paste-reset', () => { pending = []; Kit.refresh(); });
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'partner';
  function ensurePartner(name, extra = {}) {
    let c = partners().find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (c) return c;
    let id = slug(name); while (partnerById(id)) id += '-2';
    c = { id, name, type: extra.type || 'Partner', contact: extra.contact || '', sites: [], added: new Date().toISOString() };
    data.partners.push(c);
    return c;
  }
  function ensureSite(c, name, city, state) {
    let s = c.sites.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (s) return s;
    if (c.demo) return null;
    s = { id: `${c.id}-${Date.now().toString(36)}${c.sites.length + 1}`, name, city: city || '', state: (state || place(city).state || '').toUpperCase() };
    c.sites.push(s);
    return s;
  }
  Kit.action('paste-add', () => {
    let n = 0, skipped = 0;
    pending.filter((p) => !p.problems.length).forEach((p) => {
      const c = p.partnerId ? partnerById(p.partnerId) : ensurePartner(p.partnerName);
      const s = p.siteId ? siteById(p.siteId) : ensureSite(c, p.siteName, p.city, p.state);
      if (!c || !s) { skipped++; return; }
      data.records.push({ id: newId() + n, partner: c.id, site: s.id, date: p.date, stream: p.stream, t: Math.round(p.t * 1000) / 1000, out: p.out == null ? null : Math.round(p.out * 1000) / 1000, dest: p.dest, docket: p.docket, note: '', added: new Date().toISOString() });
      n++;
    });
    save(); pending = []; Kit.refresh();
    Kit.toast(`Added ${n} load${n === 1 ? '' : 's'}${skipped ? ` · ${skipped} skipped (new sites can’t be added to demo partners)` : ''}.`);
  });

  /* add a partner */
  const TYPES = ['Recycler', 'Demolition & construction', 'Manufacturing', 'Electrical & telecommunications', 'Local government', 'Retail', 'Commercial property', 'Logistics & warehousing', 'Other'];
  function partnerTab() {
    const mine = data.partners;
    return C.grid('1fr 1fr',
      C.panel({ title: 'Add a partner', body: `<div class="kit-entry">
        <label class="kit-select kit-field"><span>Partner name</span><input class="rgc-input" type="text" data-newpartner="name" placeholder="e.g. Geelong Demolition Pty Ltd"></label>
        <div class="kit-toolbar">${C.select('newpartner-type', TYPES, TYPES[0], 'Type')}<label class="kit-select kit-field"><span>Main contact role (optional)</span><input class="rgc-input" type="text" data-newpartner="contact" placeholder="e.g. Site Manager"></label></div>
        <label class="kit-select kit-field"><span>Sites — one per line: name, city, state</span><textarea class="rgc-input kit-paste" data-newpartner="sites" placeholder="Laverton yard, Laverton, VIC&#10;Brisbane depot, Brisbane, QLD"></textarea></label>
        <div class="kit-toolbar"><button type="button" class="rgc-btn rgc-btn--primary kit-bigbtn" data-action="partner-add">${icon('plus', 16)} Add partner</button></div>
      </div>` }),
      C.panel({ title: 'Partners added on this browser', flush: true, list: true, body: mine.length ? mine.map((c) => C.row({ icon: 'portfolio', t: esc(c.name), d: `${esc(c.type || '')} · ${c.sites.length} site${c.sites.length === 1 ? '' : 's'} · ${num(data.records.filter((r) => r.partner === c.id).length)} loads`, r: `<a class="rgc-btn rgc-btn--sm" href="#/corp/partners/${c.id}">Open</a> <button type="button" class="rgc-btn rgc-btn--sm" data-action="partner-remove" data-id="${esc(c.id)}">Remove</button>`, cols: '36px 1fr auto' })).join('') : '<div class="kit-empty">None yet. The demonstration partners are built in and can be switched off under Data &amp; backup.</div>' }));
  }
  Kit.action('partner-add', () => {

    val('sites').split(/\r?\n/).map((l) => l.split(/\t|,/).map((x) => x.trim())).filter((p) => p[0]).forEach(([n, city, state]) => ensureSite(c, n, city, state));
    if (!c.sites.length) ensureSite(c, 'Main site', '', '');
    save();
    form.partner = c.id; form.site = c.sites[0].id; saveForm();
    Kit.go('#/corp/record?tab=one');
    setTimeout(() => Kit.toast(`${c.name} added with ${c.sites.length} site${c.sites.length === 1 ? '' : 's'}. Record its first load.`), 60);
  });
  Kit.action('partner-remove', (btn) => {
    const id = btn.dataset.id;
    const n = data.records.filter((r) => r.partner === id).length;
    if (removeArm !== 'c:' + id) { removeArm = 'c:' + id; btn.textContent = n ? `Tap again — removes ${n} loads too` : 'Tap again to remove'; setTimeout(() => { if (removeArm === 'c:' + id) removeArm = ''; }, 5000); return; }
    removeArm = '';
    data.partners = data.partners.filter((c) => c.id !== id);
    data.records = data.records.filter((r) => r.partner !== id);
    save(); Kit.refresh(); Kit.toast('Partner removed.');
  });

  /* ---------- PARTNERS ---------- */
  Kit.route('corp/partners', () => {
    const list = records().filter((r) => inPeriod(r));
    const rows = partners().map((c) => ({ c, R: agg(list.filter((r) => r.partner === c.id)) })).sort((a, b) => b.R.tonnes - a.R.tonnes);
    return {

        { title: 'The load', html: C.review([['Partner', esc(c.name)], ['Site', esc(siteLabel(s))], ['Date', fmtDate(r.date)], ['Docket', esc(r.docket || '—')], ['Metal in', esc(S.name)], ['Weighed in', `${t2(r.t)} t`], ['Turned into', esc(S.product)], ['Recovered', `${t2(o.recovered)} t (${pct(r.t ? o.recovered / r.t : 0)})${o.measured ? ' — weighed out' : ' — usual rate, estimate'}`], ['Residual', `${t2(o.residual)} t`], ['Went to', esc(DEST[r.dest || 'stock'].name)]]) },
        { title: 'The difference it made', html: C.impactHero(R) },
        { title: `${WHO} vs landfill`, html: C.vsLandfill(R, WHO) },
        { title: 'What happened to it', html: `<p style="font-size:13px;line-height:1.6">${esc(S.path)}.</p>` },
        Kit.reportMethodBlock(WHO),
      ],
    });
  });
})();
