/* ---------- themes ---------- */
:root { --on-accent: var(--c-offwhite); --warn: #f4f4f2; }

/* JUNK / Recycle Group palette: #00ED00 on #050505, white type, dark grey #111111 */
:root[data-theme="bright"] {
  --c-black: #050505; --c-offwhite: #ffffff; --c-graphite: #4a4a4a; --c-charcoal: #111111;
  --c-green: #00ED00; --c-green-ink: #00ED00; --c-green-deep: #0b3d0b; --c-green-soft: rgba(0, 237, 0, .14);
  --s-0: #050505; --s-1: #111111; --s-app: #0a0a0a; --s-panel: #111111; --s-panel-2: #1a1a1a;
  --t-1: #ffffff; --t-2: rgba(255, 255, 255, .7); --t-3: rgba(255, 255, 255, .58); --l-1: rgba(255, 255, 255, .1); --l-2: rgba(255, 255, 255, .16);
  --on-accent: #050505;
  --f-display: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="bright"] .rgc { --app-side: #050505; --app-text: #ffffff; --app-line: rgba(255,255,255,.09); --app-line-2: rgba(255,255,255,.16); --app-text-2: rgba(255,255,255,.72); --app-text-3: rgba(255,255,255,.56); }
:root[data-theme="bright"] :is(.rgc-title, .rgc-kpi__value, .rgc-stat__v, .rgc-wiz__h, .rgc-confirm__h, .rgc-login__line, .rgc-login__card h1, .rgc-org__mark, .rgc-brand__word, .kit-big) { font-weight: 400; }
:root[data-theme="bright"] .rgc-title { text-transform: uppercase; letter-spacing: .01em; font-size: 24px; }
:root[data-theme="bright"] .rgc-brand__word { font-family: var(--f-body); font-weight: 700; }
:root[data-theme="bright"] .rgc-kpi__value { letter-spacing: 0; }
:root[data-theme="bright"] .rgc-avatar { background: #111; border-color: rgba(0,237,0,.5); color: #fff; }
:root[data-theme="bright"] .rgc-spark .area { fill: rgba(0, 237, 0, .1); }

/* ---------- page frame ---------- */
html, body { height: 100%; }
body.kit { margin: 0; background: var(--s-app); overflow: hidden; }
#app { height: 100dvh; display: flex; flex-direction: column; }
#app > .rgc { flex: 1; min-height: 0; height: auto; }
.rgc--live .rgc-content { overflow: auto; overscroll-behavior: contain; scroll-padding-top: 16px; }
.rgc-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.rgc-content > * { flex: none; }
.rgc-content > .kit-foot { margin-top: auto; }

.kit-demo { flex: none; min-height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--l-1); background: var(--c-black); font-size: 12px; color: var(--t-2); white-space: nowrap; overflow: hidden; }
.kit-demo .note { overflow: hidden; text-overflow: ellipsis; }
.kit-demo__cta { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--c-green-ink); }
.kit-demo--plain { white-space: normal; padding: 7px 18px; line-height: 1.4; }

.rgc-brand { color: inherit; }
.rgc-brand img { max-width: 150px; object-fit: contain; object-position: left center; }
.kit-sides-wrap { padding: 0 0 18px; }
.kit-sides { display: flex; width: 100%; }
.kit-side { flex: 1; height: 30px; display: grid; place-items: center; border-radius: 3px; font-size: 12px; font-weight: 600; color: var(--app-text-3); text-align: center; padding: 0 8px; }
.kit-side[aria-pressed="true"] { background: var(--app-green); color: var(--on-accent); }
.kit-nav__div { margin: 14px 12px 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--app-text-3); }
.kit-nav__badge { margin-left: auto; font-size: 10.5px; font-weight: 600; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; display: grid; place-items: center; background: var(--app-panel-2); color: var(--app-text-2); border: 1px solid var(--app-line-2); }
.rgc-side { overflow-y: auto; }
.rgc-search { cursor: pointer; text-align: left; }
.rgc-search:hover { border-color: var(--app-line-2); color: var(--app-text-2); }
.kit-burger { display: none; }
.kit-scrim { display: none; }
.kit-crumb { font-size: 11.5px; color: var(--app-text-3); margin-bottom: 6px; }
.kit-crumb a:hover { color: var(--app-text); }
.rgc-pagehead { flex-wrap: wrap; row-gap: 12px; }
.rgc-pagehead__right { flex-wrap: wrap; justify-content: flex-end; }
.kit-foot { padding-top: 8px; font-size: 11px; color: var(--app-text-3); line-height: 1.5; }

/* ---------- layout helpers ---------- */
.kit-kpis { grid-template-columns: repeat(var(--kpi-cols, 4), minmax(0, 1fr)); }
.kit-grid { display: grid; grid-template-columns: var(--cols, 1fr 1fr); gap: 16px; align-items: stretch; min-width: 0; }
.kit-grid > * { min-width: 0; }
.kit-stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.kit-stats { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px; }
.kit-tablewrap { overflow-x: auto; max-width: 100%; }
.kit-tablewrap .rgc-table { min-width: 100%; }
.rgc-table tfoot td { font-weight: 700; border-top: 1px solid var(--app-line-2); border-bottom: 0; padding: 12px 18px; }
.rgc-table td.kit-wrap { white-space: normal; min-width: 180px; }
.rgc-table tr.kit-link, .kit-link { cursor: pointer; }
.rgc-table tr.kit-link:hover td { background: var(--app-panel-2); }
.rgc-kpi.kit-link:hover { border-color: var(--app-line-2); }
a.rgc-row:hover, a.rgc-rank:hover { background: var(--app-panel-2); }
.rgc-table .green, .kit-green { color: var(--app-green-ink); }
.kit-muted { color: var(--app-text-3); }
.kit-empty { padding: 28px 18px; color: var(--app-text-3); font-size: 12.5px; text-align: center; }
.kit-chart { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; }
.kit-chart .rgc-chart { min-height: 0; }
.rgc-chart__col.is-hl .rgc-chart__label { color: var(--app-text); font-weight: 600; }
.rgc-chart__col:hover .rgc-chart__bar { filter: brightness(1.25); }
.kit-panel__tools { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kit-panel__tools + .rgc-panel__link { margin-left: 12px; }
.kit-select { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: var(--app-text-3); letter-spacing: .08em; text-transform: uppercase; }
.kit-select .rgc-input { height: 34px; width: auto; min-width: 140px; padding: 0 10px; font-size: 12.5px; text-transform: none; letter-spacing: 0; }
.kit-note { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 12px 16px; border: 1px solid var(--app-line); border-left: 2px solid var(--app-green-ink); border-radius: var(--app-r); background: var(--app-panel); font-size: 12.5px; color: var(--app-text-2); line-height: 1.55; }
.kit-note .icon { color: var(--app-green-ink); margin-top: 2px; }
.kit-note b { color: var(--app-text); }
.kit-note--warn { border-left-color: var(--app-text); }
.kit-note--warn .icon { color: var(--app-text); }
.rgc-pill.kit-pill--warn { color: var(--app-text); border-color: var(--app-text); background: transparent; font-weight: 700; }
.rgc-pill.kit-pill--warn:before { background: var(--app-text); border-radius: 0; transform: rotate(45deg); }
.rgc-kpi__delta.is-down { color: var(--app-text); }
.kit-big { font-family: var(--f-display); font-size: clamp(40px, 5vw, 64px); line-height: .95; letter-spacing: -.01em; }
.kit-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 12.5px; }
.kit-kv dt { color: var(--app-text-3); }
.kit-kv dd { margin: 0; font-weight: 600; }
.kit-input { height: 32px; padding: 0 8px; border: 1px solid var(--app-line-2); border-radius: 3px; background: var(--app-side); color: var(--app-text); font: inherit; font-size: 12.5px; width: 100%; }
.kit-input:focus { outline: none; border-color: var(--app-green-ink); }
.kit-input--num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; padding: 0 6px; }
textarea.kit-input { height: auto; min-height: 84px; padding: 8px; line-height: 1.45; resize: vertical; }
.kit-map { position: relative; }
.kit-map svg { display: block; width: 100%; height: auto; }
.rgc-map .kit-road { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.rgc-map .kit-road--major { stroke: rgba(255,255,255,.2); stroke-width: 2.4; }
.rgc-map .kit-route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.rgc-map .kit-route--dim { opacity: .18; }
/* map with a detail card (dashboard style) */
.kit-mapcard { position: relative; min-height: 300px; }
.kit-mapcard .kit-map svg { width: 66%; }
.kit-mapcard > .rgc-map__card { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); }
@media (max-width: 700px) { .kit-mapcard .kit-map svg { width: 100%; } .kit-mapcard > .rgc-map__card { position: static; transform: none; width: auto; margin: 0 14px 14px; } }
.kit-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--app-text-2); }
.kit-legend span { display: inline-flex; align-items: center; gap: 7px; }
.kit-legend i { width: 12px; height: 4px; border-radius: 2px; display: inline-block; }
.kit-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.kit-toolbar .rgc-input { height: 34px; }
.kit-search { position: relative; min-width: 220px; flex: 1; max-width: 360px; }

.kit-search__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rgc-panel__body.rgc-list { align-content: start; }

@media (max-width: 700px) { .kit-long { display: none; } .kit-short { display: inline; } }

  .rgc-top .kit-select .rgc-input { min-width: 0; max-width: 46vw; }

/* ---------- stepper ---------- */
.kit-step { display: grid; gap: 6px; min-width: 0; }

.kit-step__in { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--app-text); font: inherit; font-size: 18px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }

.kit-step__q { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-step__q button { height: 28px; padding: 0 10px; border: 1px solid var(--app-line-2); border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--app-text-2); }

.kit-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px 16px; }

/* ---------- pick buttons ---------- */
.kit-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.kit-pick > button { min-height: 40px; padding: 8px 14px; border: 1px solid var(--app-line-2); border-radius: var(--app-r); background: var(--app-panel); color: var(--app-text-2); font-size: 13px; font-weight: 600; text-align: left; display: inline-grid; gap: 2px; }

/* ---------- entry layout ---------- */
.kit-entry { display: grid; gap: 18px; }

/* ---------- impact ---------- */
.kit-impact { display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 16px; }

@media (max-width: 860px) { .kit-impact, .kit-vs { grid-template-columns: 1fr; } }

.rp-doc .rgc-kpis { gap: 10px; }
.rp-doc .rgc-kpi { padding: 12px 14px; }
.rp-doc .rgc-kpi__value { font-size: 30px; }
.rp-doc .rgc-kpi__label { font-size: 10px; }
.rp-doc .rgc-kpi__foot { font-size: 11.5px; }
.rp-doc .kit-kpis { grid-template-columns: repeat(var(--kpi-cols, 4), minmax(0, 1fr)); }
.rp-doc .kit-grid { grid-template-columns: var(--cols) !important; }
.rp-doc .kit-impact__v { font-size: 92px; }
.rp-doc .kit-impact__main { min-height: 200px; }
.rp-doc .rgc-panel { background: var(--app-panel); }
.rp-doc .kit-chart .rgc-chart__label, .rp-doc .rgc-chart__y { font-size: 10.5px; }
.rp-doc .rgc-bar { font-size: 13px; grid-template-columns: 170px 1fr 70px; }
.rp-doc .rgc-split__item { font-size: 12.5px; }
.rp-doc .kit-cardbox { border: 1px solid var(--app-line); border-radius: var(--app-r); background: var(--app-panel); padding: 14px 16px; }

/* cover */
.rp-page--cover { padding: 16mm 15mm 12mm; background: #050505; display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 10mm; color: #fff; }
.rp-page--cover::before { content: ""; position: absolute; right: -40mm; top: -30mm; width: 150mm; height: 150mm; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c-green) 30%, transparent), transparent 65%); pointer-events: none; }
.rp-cover__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; }
.rp-cover__top img { width: auto; max-width: 70mm; }
.rp-cover__mid { align-self: end; position: relative; }
.rp-kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--c-green-ink); margin-bottom: 14px; }
.rp-kicker::before { content: ""; width: 26px; height: 3px; background: currentColor; }
.rp-cover__title { font-family: var(--f-display); font-weight: 400; font-size: 54px; line-height: .95; text-transform: uppercase; letter-spacing: 0; max-width: 15ch; }
.rp-cover__sub { margin-top: 14px; font-size: 16px; line-height: 1.45; color: rgba(255,255,255,.75); max-width: 44ch; }
.rp-cover__meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 6px 36px; margin: 22px 0 0; }
.rp-cover__meta dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.rp-cover__meta dd { margin: 3px 0 0; font-size: 14px; font-weight: 600; }
.rp-hero { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; position: relative; }
.rp-hero__i { border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; background: #0e0e0e; }
.rp-hero__i.is-main { background: var(--c-green); border-color: var(--c-green); color: var(--on-accent); }
.rp-hero__i span { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.rp-hero__i b { font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.rp-hero__i.is-main b { font-size: 64px; }
.rp-hero__i b small { font-size: 16px; margin-left: 3px; }
.rp-hero__i em { font-style: normal; font-size: 11.5px; line-height: 1.35; opacity: .8; }
.rp-compare { position: relative; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.75); border-left: 3px solid var(--c-green); padding: 4px 0 4px 12px; }
.rp-compare b { color: #fff; }
.rp-cover__foot { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.5); border-top: 1px solid rgba(255,255,255,.14); padding-top: 10px; position: relative; }

/* light (print-friendly) variant — the cover keeps its dark look */
.rp-doc.rp-light .rp-page:not(.rp-page--cover) {
  --app-bg: #ffffff; --app-panel: #ffffff; --app-panel-2: #f1f1ef; --app-side: #fff; --app-text: #050505; --app-text-2: #333; --app-text-3: #6b6b6b;
  --app-line: #e1e1dd; --app-line-2: #c9c9c4; --app-green-ink: #0a7a1e; --c-graphite: #9b9b9b; --on-accent: #050505;
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
}
.rp-doc.rp-light .rp-page:not(.rp-page--cover) .rgc-spark .area { fill: rgba(0,0,0,.05); }
.rp-logo--on-light { display: none; }
.rp-doc.rp-light .rp-page:not(.rp-page--cover) .rp-logo--on-dark { display: none; }
.rp-doc.rp-light .rp-page:not(.rp-page--cover) .rp-logo--on-light { display: block; }

/* ---------- printing the report ---------- */
@media print {
  body.rp-open > #app, body.rp-open > .kit-palette, body.rp-open > .kit-toast { display: none !important; }
  body.rp-open { background: #fff !important; }
  body.rp-open .rp-shell { position: static; display: block; background: none; }
  body.rp-open .rp-bar, body.rp-open .rp-tip { display: none !important; }
  body.rp-open .rp-scroll { overflow: visible; padding: 0; }
  body.rp-open .rp-doc { zoom: 1 !important; display: block; width: 210mm; }
  body.rp-open .rp-page { box-shadow: none; margin: 0; height: 296.5mm; break-after: page; page-break-after: always; break-inside: avoid; }
  body.rp-open .rp-page:last-child { break-after: auto; page-break-after: auto; }
}

.kit-step { align-content: start; }
.kit-steps .kit-step--wide { grid-column: span 2; }
@media (max-width: 420px) { .kit-steps .kit-step--wide { grid-column: auto; } }
/* reports are laid out at A4 width on screen and in print — never switch to the phone layout */
.rp-doc .kit-vs { grid-template-columns: 1fr 1fr !important; }
.rp-doc .kit-impact { grid-template-columns: 1.1fr 1.4fr !important; }
.rp-doc .rgc-bars[style] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.rp-doc .rgc-bars:not([style]) { grid-template-columns: 1fr !important; }
.rp-doc .rgc-bar { grid-template-columns: 170px 1fr 70px !important; }
.rp-doc .rgc-panel__head { flex-wrap: nowrap; }
.rp-doc .rgc-split__legend { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.rp-doc .rgc-review div { grid-template-columns: 160px 1fr !important; }
.rp-doc .kit-stats { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)) !important; }
/* Metal Recycling Connect — steel palette over the bright theme */
:root[data-theme="bright"] {
  --c-black: #0F1214; --c-charcoal: #15191C; --c-graphite: #3D464D;
  --c-green: #D9DEE3; --c-green-ink: #D9DEE3; --c-green-deep: #3A434A; --c-green-soft: rgba(217, 222, 227, .14);
  --s-0: #0F1214; --s-1: #15191C; --s-app: #0F1214; --s-panel: #15191C; --s-panel-2: #1C2125;
  --on-accent: #0F1214;
  --l-1: rgba(255,255,255,.09); --l-2: rgba(255,255,255,.15);
}
:root[data-theme="bright"] .rgc { --app-side: #0F1214; --app-green: #D9DEE3; --app-line: rgba(255,255,255,.09); --app-line-2: rgba(255,255,255,.15); }
:root[data-theme="bright"] .rgc-avatar { border-color: rgba(217,222,227,.5); }
:root[data-theme="bright"] .rgc-spark .area { fill: rgba(217,222,227,.1); }
.kit-field { display: grid; gap: 8px; align-items: start; min-width: 0; }
.kit-field > span, .kit-field__l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--app-text-3); }
label.kit-field.kit-select { display: grid; flex: 1 1 220px; }
.kit-field .rgc-input, .kit-entry .kit-select .rgc-input { height: 48px; font-size: 15px; width: 100%; min-width: 0; }
.kit-entry .kit-toolbar { align-items: end; }
.kit-entry .kit-toolbar > .kit-select { display: grid; gap: 8px; flex: 1 1 220px; }
.kit-entry textarea.rgc-input { height: 120px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.kit-warn { color: var(--app-text); font-weight: 700; text-decoration: underline; text-decoration-color: var(--app-text-3); text-underline-offset: 3px; }
.rp-doc .rgc-review > div { font-size: 13px; }
/* chain of custody strip */
.rf-chain { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--app-line); border: 1px solid var(--app-line); }
.rf-chain > div { background: var(--s-panel); padding: 14px 16px; min-width: 0; }
.rf-chain span { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--app-text-3); margin-bottom: 6px; }
.rf-chain b { display: block; font-size: 22px; line-height: 1.1; color: var(--app-text); }
.rf-chain b small { font-size: 12px; color: var(--app-text-3); margin-left: 3px; }
.rf-chain em { display: block; font-style: normal; font-size: 12px; color: var(--app-text-2); margin-top: 4px; }
@media (max-width: 720px) { .rf-chain { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) {
  .kit-entry__bar .kit-entry__meta { flex-basis: 100%; }
  .kit-entry__bar .rgc-btn { flex: 1; }
}

.rgc-btn--primary, .rgc-btn--primary:hover { color: #0F1214 !important; }
.kit-side[aria-pressed="true"] { color: #0F1214; }
</style>
</head>
