:root[data-theme="bright"] .rgc { --app-side: #050505; --app-text: #ffffff; --app-line: rgba(255,255,255,.09); --app-line-2: rgba(255,255,255,.16); --app-text-2: rgba(255,255,255,.72); --app-text-3: rgba(255,255,255,.56); }

/* ---------- page frame ---------- */
html, body { height: 100%; }
body.kit { margin: 0; background: var(--s-app); overflow: hidden; }
#app { height: 100dvh; display: flex; flex-direction: column; }
#app > .rgc { flex: 1; min-height: 0; height: auto; }
.rgc--live .rgc-content { overflow: auto; overscroll-behavior: contain; scroll-padding-top: 16px; }
.rgc-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.rgc-content > * { flex: none; }
.rgc-content > .kit-foot { margin-top: auto; }

.kit-demo { flex: none; min-height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--l-1); background: var(--c-black); font-size: 12px; color: var(--t-2); white-space: nowrap; overflow: hidden; }

.rgc-brand { color: inherit; }
.rgc-brand img { max-width: 150px; object-fit: contain; object-position: left center; }
.kit-sides-wrap { padding: 0 0 18px; }
.kit-sides { display: flex; width: 100%; }
.kit-side { flex: 1; height: 30px; display: grid; place-items: center; border-radius: 3px; font-size: 12px; font-weight: 600; color: var(--app-text-3); text-align: center; padding: 0 8px; }
.kit-side[aria-pressed="true"] { background: var(--app-green); color: var(--on-accent); }
.kit-nav__div { margin: 14px 12px 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--app-text-3); }
.kit-nav__badge { margin-left: auto; font-size: 10.5px; font-weight: 600; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; display: grid; place-items: center; background: var(--app-panel-2); color: var(--app-text-2); border: 1px solid var(--app-line-2); }
.rgc-side { overflow-y: auto; }
.rgc-search { cursor: pointer; text-align: left; }
.rgc-search:hover { border-color: var(--app-line-2); color: var(--app-text-2); }
.kit-burger { display: none; }
.kit-scrim { display: none; }
.kit-crumb { font-size: 11.5px; color: var(--app-text-3); margin-bottom: 6px; }
.kit-crumb a:hover { color: var(--app-text); }
.rgc-pagehead { flex-wrap: wrap; row-gap: 12px; }
.rgc-pagehead__right { flex-wrap: wrap; justify-content: flex-end; }
.kit-foot { padding-top: 8px; font-size: 11px; color: var(--app-text-3); line-height: 1.5; }

/* ---------- layout helpers ---------- */
.kit-kpis { grid-template-columns: repeat(var(--kpi-cols, 4), minmax(0, 1fr)); }
.kit-grid { display: grid; grid-template-columns: var(--cols, 1fr 1fr); gap: 16px; align-items: stretch; min-width: 0; }
.kit-grid > * { min-width: 0; }
.kit-stack { display: grid; gap: 16px; align-content: start; min-width: 0; }

.kit-tablewrap { overflow-x: auto; max-width: 100%; }
.kit-tablewrap .rgc-table { min-width: 100%; }
.rgc-table tfoot td { font-weight: 700; border-top: 1px solid var(--app-line-2); border-bottom: 0; padding: 12px 18px; }
.rgc-table td.kit-wrap { white-space: normal; min-width: 180px; }
.rgc-table tr.kit-link, .kit-link { cursor: pointer; }
.rgc-table tr.kit-link:hover td { background: var(--app-panel-2); }
.rgc-kpi.kit-link:hover { border-color: var(--app-line-2); }
a.rgc-row:hover, a.rgc-rank:hover { background: var(--app-panel-2); }
.rgc-table .green, .kit-green { color: var(--app-green-ink); }
.kit-muted { color: var(--app-text-3); }
.kit-empty { padding: 28px 18px; color: var(--app-text-3); font-size: 12.5px; text-align: center; }
.kit-chart { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; }

.kit-panel__tools { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kit-panel__tools + .rgc-panel__link { margin-left: 12px; }
.kit-select { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: var(--app-text-3); letter-spacing: .08em; text-transform: uppercase; }
.kit-select .rgc-input { height: 34px; width: auto; min-width: 140px; padding: 0 10px; font-size: 12.5px; text-transform: none; letter-spacing: 0; }
.kit-note { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 12px 16px; border: 1px solid var(--app-line); border-left: 2px solid var(--app-green-ink); border-radius: var(--app-r); background: var(--app-panel); font-size: 12.5px; color: var(--app-text-2); line-height: 1.55; }

.rgc-pill.kit-pill--warn:before { background: var(--app-text); border-radius: 0; transform: rotate(45deg); }
.rgc-kpi__delta.is-down { color: var(--app-text); }
.kit-big { font-family: var(--f-display); font-size: clamp(40px, 5vw, 64px); line-height: .95; letter-spacing: -.01em; }
.kit-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 12.5px; }

.kit-kv dd { margin: 0; font-weight: 600; }
.kit-input { height: 32px; padding: 0 8px; border: 1px solid var(--app-line-2); border-radius: 3px; background: var(--app-side); color: var(--app-text); font: inherit; font-size: 12.5px; width: 100%; }
.kit-input:focus { outline: none; border-color: var(--app-green-ink); }
.kit-input--num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; padding: 0 6px; }
textarea.kit-input { height: auto; min-height: 84px; padding: 8px; line-height: 1.45; resize: vertical; }
.kit-map { position: relative; }
.kit-map svg { display: block; width: 100%; height: auto; }

.rgc-map .kit-road--major { stroke: rgba(255,255,255,.2); stroke-width: 2.4; }
.rgc-map .kit-route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }

/* map with a detail card (dashboard style) */
.kit-mapcard { position: relative; min-height: 300px; }

@media (max-width: 700px) { .kit-mapcard .kit-map svg { width: 100%; } .kit-mapcard > .rgc-map__card { position: static; transform: none; width: auto; margin: 0 14px 14px; } }
.kit-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--app-text-2); }
.kit-legend span { display: inline-flex; align-items: center; gap: 7px; }
.kit-legend i { width: 12px; height: 4px; border-radius: 2px; display: inline-block; }
.kit-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.kit-toolbar .rgc-input { height: 34px; }
.kit-search { position: relative; min-width: 220px; flex: 1; max-width: 360px; }
.kit-search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--app-text-3); }
.kit-search input { padding-left: 32px; height: 34px; }
.kit-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.kit-tabs a { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: var(--app-r); font-size: 12.5px; font-weight: 500; color: var(--app-text-3); border: 1px solid transparent; }
.kit-tabs a[aria-current="page"] { color: var(--app-text); background: var(--app-panel); border-color: var(--app-line); }
.kit-cover { aspect-ratio: 210/297; width: 100%; max-width: 200px; background: linear-gradient(160deg, #161616, #0b0b0b); border: 1px solid var(--app-line-2); padding: 9%; display: grid; grid-template-rows: auto 1fr auto; gap: 8%; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); }
.kit-cover img { height: 18px; width: auto; }
.kit-cover h3 { font-family: var(--f-display); text-transform: uppercase; font-size: 18px; line-height: 1; align-self: end; }
.kit-cover p { font-size: 10px; color: var(--app-text-3); margin-top: 6px; }

.kit-cover__band b { font-size: 11px; }
.kit-cover__band b.g { color: var(--app-green-ink); }

/* ---------- search palette ---------- */
.kit-palette { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.6); display: grid; place-items: start center; padding: 12vh 16px 16px; }
.kit-palette__box { width: min(560px, 100%); background: var(--s-panel); border: 1px solid var(--l-2); border-radius: 6px; box-shadow: 0 40px 80px -20px #000; overflow: hidden; font-size: 13px; color: var(--t-1); }
.kit-palette__in { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--l-1); color: var(--t-3); }
.kit-palette__in input { flex: 1; height: 50px; background: none; border: 0; color: var(--t-1); font: inherit; font-size: 15px; outline: none; }
.kit-palette__in kbd { font: inherit; font-size: 10.5px; padding: 2px 6px; border: 1px solid var(--l-1); border-radius: 3px; }
.kit-palette__list { max-height: 50vh; overflow: auto; padding: 6px; }
.kit-palette__item { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 12px; border-radius: 4px; }
.kit-palette__item span { color: var(--t-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kit-palette__item.is-on, .kit-palette__item:hover { background: var(--s-panel-2); }
.kit-palette__item.is-on b { color: var(--c-green-ink); }

.kit-login-wrap { flex: 1; min-height: 0; overflow: auto; }
.kit-login-wrap .rgc-login { min-height: 100%; }
.kit-toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%); background: var(--c-offwhite); color: var(--c-black); padding: 10px 16px; font-size: 13px; border-radius: 3px; z-index: 95; box-shadow: 0 10px 30px #00000080; max-width: calc(100% - 32px); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .kit-kpis { grid-template-columns: repeat(min(var(--kpi-cols, 4), 3), minmax(0, 1fr)); }
  .kit-grid { grid-template-columns: 1fr 1fr; }
  .kit-grid.kit-grid--keep { grid-template-columns: var(--cols); }
  .rgc-opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 960px) {
  .rgc-shell { grid-template-columns: 1fr; }
  .rgc-side { position: fixed; top: 0; bottom: 0; left: 0; width: 272px; z-index: 60; transform: translateX(-102%); transition: transform .2s var(--ease-std); box-shadow: 20px 0 60px rgba(0,0,0,.6); }
  .kit-nav-open .rgc-side { transform: none; }
  .kit-nav-open .kit-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.55); }
  .kit-burger { display: grid; flex: none; }

  .rgc-search { width: auto; flex: 1; min-width: 0; }

  .kit-search__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kit-user__txt { display: none; }
  .rgc-user { padding-left: 10px; }
  .rgc-content { padding: 20px 16px 28px; gap: 16px; }
  .rgc-pagehead { align-items: flex-start; }
  .rgc-pagehead__right { margin-left: 0; justify-content: flex-start; }
  .kit-grid, .kit-grid.kit-grid--keep { grid-template-columns: 1fr; }
  .rgc-wiz { grid-template-columns: 1fr; }
  .rgc-wiz__steps { grid-auto-flow: column; overflow-x: auto; }
  .rgc-wiz__step { white-space: nowrap; }
  .rgc-login { grid-template-columns: 1fr; }
  .rgc-login__side { min-height: 240px; }
  .rgc-bar { grid-template-columns: minmax(90px, 130px) 1fr 60px; }
  .rgc-bars[style] { grid-template-columns: 1fr !important; }
  .kit-demo .note { display: none; }
  .kit-panel__tools { margin-left: 0; width: 100%; }

}
@media (max-width: 560px) {
  .kit-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .rgc-kpi { padding: 12px 14px; }
  .rgc-kpi__value { font-size: 24px; }
  .rgc-kpi__foot { flex-wrap: wrap; }
  .rgc-kpi__foot > span[style] { display: none; }
  .kit-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rgc-opts { grid-template-columns: 1fr; }
  .rgc-review div { grid-template-columns: 1fr; gap: 2px; }
  .rgc-split__legend { grid-template-columns: 1fr !important; }
  .rgc-rank { padding: 10px 14px; gap: 8px; }
  .kit-search { max-width: none; min-width: 0; width: 100%; }
  .rgc-login__card { width: 100%; }
}

/* ---------- print (Save as PDF) ---------- */
@media print {
  @page app { size: A4 landscape; margin: 10mm; }
  body:not(.rp-open) #app { --s-app: #fff; --t-1: #050505; --t-2: #333; --t-3: #666; --l-1: #ddd; --l-2: #bbb; }
  body:not(.rp-open), body:not(.rp-open) #app { height: auto !important; overflow: visible !important; background: #fff !important; }
  body.kit { overflow: visible; }
  #app :is(.kit-demo, .kit-demo--plain, .rgc-side, .rgc-top, .kit-noprint, .rgc-seg, .rgc-btn, .kit-select, .kit-scrim, .kit-foot), .kit-palette, .kit-toast { display: none !important; }

  :root #app .rgc, :root[data-theme] #app .rgc {
    --app-bg: #fff; --app-side: #fff; --app-panel: #fff; --app-panel-2: #f1f1f1; --app-text: #050505; --app-text-2: #333; --app-text-3: #666;
    --app-line: #dcdcdc; --app-line-2: #b5b5b5; --app-green-ink: #067a06; --c-offwhite: #050505; --c-graphite: #9a9a9a;
    color: #050505; background: #fff; overflow: visible !important; height: auto !important;

  #app .rgc-main, #app .rgc-content { overflow: visible !important; height: auto !important; display: block !important; padding: 0 !important; }
  #app .rgc-content > * { margin-bottom: 10px; }
  #app .rgc-panel, #app .rgc-kpi { break-inside: avoid; }

  #app .kit-tablewrap { overflow: visible !important; }
  #app .rgc-table { font-size: 10.5px; }
  #app .rgc-table th, #app .rgc-table td { padding: 5px 8px !important; }
  #app .rgc-table tr { break-inside: avoid; }
  #app .kit-input { border: 0 !important; background: none !important; color: #050505 !important; padding: 0 !important; height: auto !important; -webkit-appearance: none; appearance: none; }
  #app .kit-input::placeholder { color: transparent; }
  #app .kit-input--num { width: 34px !important; }
  #app select.kit-input, input.kit-input:not(.kit-input--num) { width: 90px !important; }
  #app .kit-sheet th { white-space: normal; font-size: 8.5px; }
  #app .rgc-kpi__value, #app .rgc-title { color: #050505; }
  #app .rgc-demo { border-color: #999; color: #555; }
  #app .kit-grid { grid-template-columns: var(--cols, 1fr 1fr) !important; }
  #app .kit-kpis { grid-template-columns: repeat(var(--kpi-cols, 4), minmax(0, 1fr)) !important; }
  #app .kit-map svg { max-height: 120mm; }
  #app .rgc-map__land { fill: #eee; stroke: #bbb; }
  #app .rgc-map .kit-road { stroke: #ccc; }
  #app .kit-report-head { background: #050505 !important; color: #fff; }
}
.kit-search__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rgc-panel__body.rgc-list { align-content: start; }
.kit-short { display: none; }
@media (max-width: 700px) { .kit-long { display: none; } .kit-short { display: inline; } }
.kit-h2 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; font-size: 18px; letter-spacing: .01em; margin-top: 6px; }
@media (max-width: 560px) {
  .rgc-top .kit-select .rgc-input { min-width: 0; max-width: 46vw; }
  .rgc-top .rgc-search { flex: 0 0 36px; width: 36px; padding: 0; justify-content: center; }
  .rgc-top .kit-search__label { display: none; }

}
@media (max-width: 560px) { .kit-toolbar .kit-search { flex: 1 1 100%; } .kit-toolbar .kit-tabs { width: 100%; } }
/* ==========================================================================
   Connect Platform Kit: entry controls, impact blocks, reports
   ========================================================================== */

/* ---------- stepper ---------- */
.kit-step { display: grid; gap: 6px; min-width: 0; }
.kit-step__l { font-size: 12px; font-weight: 600; color: var(--app-text-2); line-height: 1.25; }
.kit-step__l small { font-weight: 500; color: var(--app-text-3); }
.kit-step__c { display: grid; grid-template-columns: 44px minmax(56px, 1fr) 44px; height: 44px; border: 1px solid var(--app-line-2); border-radius: var(--app-r); overflow: hidden; background: var(--app-side); }
.kit-step__c button { font-size: 22px; font-weight: 500; color: var(--app-text); background: var(--app-panel-2); display: grid; place-items: center; user-select: none; touch-action: manipulation; }
.kit-step__c button:active { background: var(--app-green); color: var(--on-accent); }
.kit-step__in { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--app-text); font: inherit; font-size: 18px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.kit-step__in::-webkit-outer-spin-button, .kit-step__in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.kit-step__in:focus { outline: none; background: color-mix(in srgb, var(--app-green) 12%, transparent); }
.kit-step__in:not(:placeholder-shown) { color: var(--app-green-ink); }
.kit-step--big .kit-step__c { height: 56px; grid-template-columns: 56px minmax(64px, 1fr) 56px; }
.kit-step--big .kit-step__in { font-size: 22px; }
.kit-step.is-bump .kit-step__c { animation: kitbump .18s ease; }
@keyframes kitbump { 50% { border-color: var(--app-green-ink); } }
.kit-step__q { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-step__q button { height: 28px; padding: 0 10px; border: 1px solid var(--app-line-2); border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--app-text-2); }
.kit-step__q button:hover { border-color: var(--app-green-ink); color: var(--app-text); }
.kit-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px 16px; }

/* ---------- pick buttons ---------- */
.kit-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.kit-pick > button { min-height: 40px; padding: 8px 14px; border: 1px solid var(--app-line-2); border-radius: var(--app-r); background: var(--app-panel); color: var(--app-text-2); font-size: 13px; font-weight: 600; text-align: left; display: inline-grid; gap: 2px; }
.kit-pick > button small { font-size: 11px; font-weight: 500; color: var(--app-text-3); }
.kit-pick > button[aria-pressed="true"] { background: var(--app-green); border-color: var(--app-green); color: var(--on-accent); }
.kit-pick > button[aria-pressed="true"] small { color: var(--on-accent); opacity: .8; }
.kit-pick--big > button { min-height: 56px; padding: 10px 18px; font-size: 15px; flex: 1 1 140px; justify-content: center; text-align: center; }

/* ---------- entry layout ---------- */
.kit-entry { display: grid; gap: 18px; }
.kit-entry__addr { font-family: var(--f-display); font-size: clamp(24px, 3.2vw, 34px); line-height: 1.05; text-transform: uppercase; }
.kit-entry__meta { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--app-text-3); align-items: center; }
.kit-entry__bar { position: sticky; bottom: -28px; margin: 0 -18px -18px; padding: 12px 18px; background: var(--app-panel); border-top: 1px solid var(--app-line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; z-index: 2; }
.kit-entry__bar .rgc-btn { height: 48px; font-size: 14px; padding: 0 18px; }
.kit-entry__bar .grow { flex: 1; }
.kit-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--app-green); color: var(--on-accent); }
.kit-tag--ghost { background: transparent; color: var(--app-text-2); border: 1px solid var(--app-line-2); }
.kit-stops { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-stops a { min-width: 34px; height: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--app-line-2); font-size: 12px; font-weight: 600; color: var(--app-text-2); font-variant-numeric: tabular-nums; }
.kit-stops a.is-eoi { border-color: var(--app-green-ink); }
.kit-stops a.is-done { background: color-mix(in srgb, var(--app-green) 22%, transparent); color: var(--app-text); }
.kit-stops a.is-none { background: var(--app-panel-2); color: var(--app-text-3); text-decoration: line-through; }
.kit-stops a[aria-current="true"] { background: var(--app-green); color: var(--on-accent); border-color: var(--app-green); }
.kit-paste { width: 100%; min-height: 130px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.kit-bigbtn { height: 56px !important; font-size: 15px !important; padding: 0 22px !important; }

/* ---------- impact ---------- */
.kit-impact { display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 16px; }
.kit-impact__main { background: var(--app-green); color: var(--on-accent); border-radius: var(--app-r); padding: 22px 24px; display: grid; align-content: space-between; gap: 10px; min-height: 220px; }
.kit-impact__main .kit-impact__k { color: inherit; opacity: .8; }
.kit-impact__v { font-family: var(--f-display); font-size: clamp(64px, 8vw, 112px); line-height: .9; font-weight: 400; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kit-impact__d { font-size: 13px; line-height: 1.45; max-width: 36ch; }
.kit-impact__k { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--app-text-3); }
.kit-impact__side { display: grid; gap: 10px; }
.kit-impact__side > div { border: 1px solid var(--app-line); border-radius: var(--app-r); background: var(--app-panel); padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; }
.kit-impact__side b { grid-row: span 2; font-family: var(--f-display); font-size: 34px; font-weight: 400; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.kit-impact__side b small { font-size: 15px; margin-left: 3px; color: var(--app-text-2); }
.kit-impact__side em { font-style: normal; font-size: 12px; color: var(--app-text-3); }
.kit-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kit-vs__col { border: 1px solid var(--app-line); border-radius: var(--app-r); padding: 16px 18px; display: grid; gap: 12px; background: var(--app-panel); }
.kit-vs__col--us { border-color: color-mix(in srgb, var(--app-green-ink) 60%, transparent); }
.kit-vs__h { font-family: var(--f-display); text-transform: uppercase; font-size: 15px; }
.kit-vs__col--us .kit-vs__h { color: var(--app-green-ink); }
.kit-vs dl { display: grid; gap: 6px; margin: 0; }
.kit-vs dl div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; border-bottom: 1px solid var(--app-line); padding-bottom: 6px; }
.kit-vs dt { color: var(--app-text-3); }
.kit-vs dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.kit-vs__bar { height: 14px; background: var(--app-panel-2); border-radius: 3px; overflow: hidden; }
.kit-vs__bar i { display: block; height: 100%; background: var(--c-graphite); }
.kit-vs__col--us .kit-vs__bar i { background: var(--app-green); }
.kit-vs__diff { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 14px 18px; border-radius: var(--app-r); background: var(--app-panel-2); }
.kit-vs__diff span { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--app-text-3); }
.kit-vs__diff b { font-family: var(--f-display); font-size: 30px; font-weight: 400; color: var(--app-green-ink); }
.kit-vs__diff em { font-style: normal; font-size: 13px; color: var(--app-text-2); }
.kit-method { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; line-height: 1.5; color: var(--app-text-2); }
.kit-method b { color: var(--app-text); }
.kit-sources { display: grid; gap: 4px; margin-top: 14px; font-size: 11.5px; }
.kit-sources a { color: var(--app-text-3); text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 860px) { .kit-impact, .kit-vs { grid-template-columns: 1fr; } }

/* ---------- report viewer ---------- */
.rp-shell { position: fixed; inset: 0; z-index: 120; background: #202020; display: flex; flex-direction: column; color: var(--t-1); font-family: var(--f-body); }
.rp-bar { flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: #050505; border-bottom: 1px solid var(--l-1); }
.rp-bar__t { display: grid; margin-right: auto; font-size: 13px; line-height: 1.3; }
.rp-bar__t span { color: var(--t-3); font-size: 12px; }
.rp-bar .rgc-seg button { color: var(--t-3); }
.rp-bar .rgc-seg button[aria-pressed="true"] { background: #1c1c1c; color: var(--t-1); }
.rp-bar .rgc-btn { color: var(--t-1); border-color: var(--l-2); }
.rp-bar .rgc-btn--primary { background: var(--c-green); border-color: var(--c-green); color: var(--on-accent); }
.rp-scroll { flex: 1; overflow: auto; padding: 24px 16px 60px; }
.rp-tip { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #fff; color: #050505; padding: 10px 16px; border-radius: 4px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); }
.rp-doc { width: 210mm; margin: 0 auto; display: grid; gap: 22px; --app-r: 6px; }
.rp-doc.rgc { height: auto; overflow: visible; font-size: 14.5px; background: none; container-type: normal; }
.rp-page { width: 210mm; height: 297mm; position: relative; overflow: hidden; background: var(--app-bg); color: var(--app-text); padding: 13mm 13mm 10mm; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.55); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.rp-head { flex: none; display: flex; align-items: center; gap: 12px; padding-bottom: 9px; margin-bottom: 16px; border-bottom: 2px solid var(--app-green); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--app-text-2); }
.rp-head img { width: auto; }
.rp-head__t { color: var(--app-text); }
.rp-head__p { margin-left: auto; color: var(--app-text-3); }
.rp-demo { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px dashed var(--app-line-2); border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--app-text-3); white-space: nowrap; }
.rp-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
.rp-foot { flex: none; display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; margin-top: 10px; border-top: 1px solid var(--app-line); font-size: 10.5px; color: var(--app-text-3); }
.rp-block { flex: none; }
.rp-block.rp-shrink { zoom: .8; }
.rp-bt { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.rp-bt h2 { font-family: var(--f-display); font-size: 17px; font-weight: 400; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; }
.rp-bt span { font-size: 12px; color: var(--app-text-3); }
.rp-bb { font-size: 14.5px; line-height: 1.55; }
.rp-bb p { margin: 0 0 8px; color: var(--app-text-2); }
.rp-doc .rgc-table { font-size: 13.5px; }
.rp-doc .rgc-table th { font-size: 10.5px; padding: 8px 10px; }
.rp-doc .rgc-table td { padding: 8px 10px; white-space: normal; }
.rp-doc .kit-tablewrap { overflow: visible; border: 1px solid var(--app-line); border-radius: var(--app-r); background: var(--app-panel); }
.rp-doc .rgc-kpis { gap: 10px; }
.rp-doc .rgc-kpi { padding: 12px 14px; }
.rp-doc .rgc-kpi__value { font-size: 30px; }
.rp-doc .rgc-kpi__label { font-size: 10px; }
.rp-doc .rgc-kpi__foot { font-size: 11.5px; }
.rp-doc .kit-kpis { grid-template-columns: repeat(var(--kpi-cols, 4), minmax(0, 1fr)); }
.rp-doc .kit-grid { grid-template-columns: var(--cols) !important; }
.rp-doc .kit-impact__v { font-size: 92px; }
.rp-doc .kit-impact__main { min-height: 200px; }
.rp-doc .rgc-panel { background: var(--app-panel); }
.rp-doc .kit-chart .rgc-chart__label, .rp-doc .rgc-chart__y { font-size: 10.5px; }
.rp-doc .rgc-bar { font-size: 13px; grid-template-columns: 170px 1fr 70px; }
.rp-doc .rgc-split__item { font-size: 12.5px; }
.rp-doc .kit-cardbox { border: 1px solid var(--app-line); border-radius: var(--app-r); background: var(--app-panel); padding: 14px 16px; }

/* cover */
.rp-page--cover { padding: 16mm 15mm 12mm; background: #050505; display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 10mm; color: #fff; }
.rp-page--cover::before { content: ""; position: absolute; right: -40mm; top: -30mm; width: 150mm; height: 150mm; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c-green) 30%, transparent), transparent 65%); pointer-events: none; }
.rp-cover__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; }
.rp-cover__top img { width: auto; max-width: 70mm; }
.rp-cover__mid { align-self: end; position: relative; }
.rp-kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--c-green-ink); margin-bottom: 14px; }
.rp-kicker::before { content: ""; width: 26px; height: 3px; background: currentColor; }
.rp-cover__title { font-family: var(--f-display); font-weight: 400; font-size: 54px; line-height: .95; text-transform: uppercase; letter-spacing: 0; max-width: 15ch; }
.rp-cover__sub { margin-top: 14px; font-size: 16px; line-height: 1.45; color: rgba(255,255,255,.75); max-width: 44ch; }
.rp-cover__meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 6px 36px; margin: 22px 0 0; }
.rp-cover__meta dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.rp-cover__meta dd { margin: 3px 0 0; font-size: 14px; font-weight: 600; }
.rp-hero { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; position: relative; }
.rp-hero__i { border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; background: #0e0e0e; }
.rp-hero__i.is-main { background: var(--c-green); border-color: var(--c-green); color: var(--on-accent); }
.rp-hero__i span { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.rp-hero__i b { font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.rp-hero__i.is-main b { font-size: 64px; }
.rp-hero__i b small { font-size: 16px; margin-left: 3px; }
.rp-hero__i em { font-style: normal; font-size: 11.5px; line-height: 1.35; opacity: .8; }
.rp-compare { position: relative; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.75); border-left: 3px solid var(--c-green); padding: 4px 0 4px 12px; }
.rp-compare b { color: #fff; }
.rp-cover__foot { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.5); border-top: 1px solid rgba(255,255,255,.14); padding-top: 10px; position: relative; }

/* light (print-friendly) variant. The cover keeps its dark look */
.rp-doc.rp-light .rp-page:not(.rp-page--cover) {
  --app-bg: #ffffff; --app-panel: #ffffff; --app-panel-2: #f1f1ef; --app-side: #fff; --app-text: #050505; --app-text-2: #333; --app-text-3: #6b6b6b;
  --app-line: #e1e1dd; --app-line-2: #c9c9c4; --app-green-ink: #0a7a1e; --c-graphite: #9b9b9b; --on-accent: #050505;
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
}
.rp-doc.rp-light .rp-page:not(.rp-page--cover) .rgc-spark .area { fill: rgba(0,0,0,.05); }
.rp-logo--on-light { display: none; }
.rp-doc.rp-light .rp-page:not(.rp-page--cover) .rp-logo--on-dark { display: none; }
.rp-doc.rp-light .rp-page:not(.rp-page--cover) .rp-logo--on-light { display: block; }

/* ---------- printing the report ---------- */
@media print {
  body.rp-open > #app, body.rp-open > .kit-palette, body.rp-open > .kit-toast { display: none !important; }
  body.rp-open { background: #fff !important; }
  body.rp-open .rp-shell { position: static; display: block; background: none; }
  body.rp-open .rp-bar, body.rp-open .rp-tip { display: none !important; }
  body.rp-open .rp-scroll { overflow: visible; padding: 0; }
  body.rp-open .rp-doc { zoom: 1 !important; display: block; width: 210mm; }
  body.rp-open .rp-page { box-shadow: none; margin: 0; height: 296.5mm; break-after: page; page-break-after: always; break-inside: avoid; }
  body.rp-open .rp-page:last-child { break-after: auto; page-break-after: auto; }
}

.kit-step { align-content: start; }
.kit-steps .kit-step--wide { grid-column: span 2; }
@media (max-width: 420px) { .kit-steps .kit-step--wide { grid-column: auto; } }
/* reports are laid out at A4 width on screen and in print. Never switch to the phone layout */
.rp-doc .kit-vs { grid-template-columns: 1fr 1fr !important; }
.rp-doc .kit-impact { grid-template-columns: 1.1fr 1.4fr !important; }
.rp-doc .rgc-bars[style] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.rp-doc .rgc-bars:not([style]) { grid-template-columns: 1fr !important; }
.rp-doc .rgc-bar { grid-template-columns: 170px 1fr 70px !important; }
.rp-doc .rgc-panel__head { flex-wrap: nowrap; }
.rp-doc .rgc-split__legend { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.rp-doc .rgc-review div { grid-template-columns: 160px 1fr !important; }
.rp-doc .kit-stats { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)) !important; }
/* Recycled Connect: steel palette over the bright theme */
:root[data-theme="bright"] {
  --c-black: #0F1214; --c-charcoal: #15191C; --c-graphite: #3D464D;
  --c-green: #D9DEE3; --c-green-ink: #D9DEE3; --c-green-deep: #3A434A; --c-green-soft: rgba(217, 222, 227, .14);
  --s-0: #0F1214; --s-1: #15191C; --s-app: #0F1214; --s-panel: #15191C; --s-panel-2: #1C2125;
  --on-accent: #0F1214;
  --l-1: rgba(255,255,255,.09); --l-2: rgba(255,255,255,.15);
}
:root[data-theme="bright"] .rgc { --app-side: #0F1214; --app-green: #D9DEE3; --app-line: rgba(255,255,255,.09); --app-line-2: rgba(255,255,255,.15); }
:root[data-theme="bright"] .rgc-avatar { border-color: rgba(217,222,227,.5); }
:root[data-theme="bright"] .rgc-spark .area { fill: rgba(217,222,227,.1); }
.kit-field { display: grid; gap: 8px; align-items: start; min-width: 0; }
.kit-field > span, .kit-field__l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--app-text-3); }
label.kit-field.kit-select { display: grid; flex: 1 1 220px; }
.kit-field .rgc-input, .kit-entry .kit-select .rgc-input { height: 48px; font-size: 15px; width: 100%; min-width: 0; }
.kit-entry .kit-toolbar { align-items: end; }
.kit-entry .kit-toolbar > .kit-select { display: grid; gap: 8px; flex: 1 1 220px; }
.kit-entry textarea.rgc-input { height: 120px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.kit-warn { color: var(--app-text); font-weight: 700; text-decoration: underline; text-decoration-color: var(--app-text-3); text-underline-offset: 3px; }
.rp-doc .rgc-review > div { font-size: 13px; }
/* chain of custody strip */
.rf-chain { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--app-line); border: 1px solid var(--app-line); }
.rf-chain > div { background: var(--s-panel); padding: 14px 16px; min-width: 0; }
.rf-chain span { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--app-text-3); margin-bottom: 6px; }
.rf-chain b { display: block; font-size: 22px; line-height: 1.1; color: var(--app-text); }
.rf-chain b small { font-size: 12px; color: var(--app-text-3); margin-left: 3px; }
.rf-chain em { display: block; font-style: normal; font-size: 12px; color: var(--app-text-2); margin-top: 4px; }
@media (max-width: 720px) { .rf-chain { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) {
  .kit-entry__bar .kit-entry__meta { flex-basis: 100%; }
  .kit-entry__bar .rgc-btn { flex: 1; }
}

.rgc-btn--primary, .rgc-btn--primary:hover { color: #0F1214 !important; }
.kit-side[aria-pressed="true"] { color: #0F1214; }
</style>
