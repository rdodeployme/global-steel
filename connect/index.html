  Kit.action('select:buyer', (v) => { buyerId = v; store.set(KEY + ':buyer', v); if (!/^#\/buyer\/(overview|dispatches|metals|content|statements|method)$/.test(location.hash)) Kit.go('#/buyer/overview'); Kit.refresh(); });
  Kit.action('open-buyer', (btn) => { if (buyerById(btn.dataset.id)) { buyerId = btn.dataset.id; store.set(KEY + ':buyer', buyerId); } Kit.go('#/buyer/overview'); });

  /* ---------- shared blocks ---------- */
  const auPins = (sites, hrefFn) => sites.map((s) => { const pl = place(s.city, s.state); return { id: s.id, ...Kit.AU.project(pl.lat, pl.lng), title: `${s.name} · ${s.city || ''} ${s.state || ''}`, href: hrefFn(s) }; });
  const noPartner = () => ({ title: 'No partners yet', html: C.note(`There are no partners to show. Add one under <a class="kit-green" href="#/corp/record?tab=partner">Corporate → Record a load → Add a partner</a>, or switch the demonstration partners back on under <a class="kit-green" href="#/corp/data">Data &amp; backup</a>.`) });
  const reportBtn = (action, dataset = {}, label = 'Download statement') => C.btn(label, { icon: 'download', action, primary: true, data: dataset });

  function loadsTable(list, side, o = {}) {
    return C.table([
      { label: 'Date', render: (r) => `<span class="strong">${fmtDate(r.date)}</span>` },
      ...(o.partner ? [{ label: 'Partner', render: (r) => esc(partnerById(r.partner)?.name || 'n/a') }] : []),
      ...(o.site === false ? [] : [{ label: 'Site', render: (r) => { const s = siteById(r.site); return s ? `${esc(s.name)}<div class="dim">${esc(s.city || '')} ${esc(s.state || '')}</div>` : 'n/a'; } }]),
      { label: 'Metal in', render: (r) => `${esc(STREAMS[r.stream].name)}<div class="dim">${esc(STREAMS[r.stream].product.split(' (')[0])}</div>` },
      { label: 'Weighed in', num: true, render: (r) => t2(r.t) + ' t' },
      { label: 'Recovered', num: true, render: (r) => { const o2 = outcome(r); return `<span class="green">${t2(o2.recovered)} t</span><div class="dim">${pct(r.t ? o2.recovered / r.t : 0)}${o2.measured ? '' : ' · est.'}</div>`; } },
      { label: 'Went to', render: (r) => esc(DEST[r.dest || 'stock'].short) },
      { label: 'Docket', dim: true, render: (r) => esc(r.docket || '') },
      ...(o.remove ? [{ label: '', render: (r) => (r.demo ? '<span class="dim">demo</span>' : `<button type="button" class="rgc-btn rgc-btn--sm" data-action="record-remove" data-id="${esc(r.id)}">Remove</button>`) }] : []),
    ], list.slice(0, o.limit || 500), { rowHref: (r) => `#/${side}/loads/${r.id}`, empty: o.empty || 'No loads recorded for this period.' })
      + (list.length > (o.limit || 500) ? `<div class="kit-empty">Showing the latest ${o.limit || 500} of ${num(list.length)}. Export CSV for the full list.</div>` : '');
  }

  function overviewBody(list, side, o = {}) {
    const R = agg(list);
    const S = seriesOf(list);
    const top = [...R.rows].sort((a, b) => b.avoided - a.avoided)[0];
    return (list.length ? '' : C.note(o.emptyNote || 'Nothing recorded for this period yet.'))
      + chainStrip(R)
      + C.kpis([
        { label: 'Weighed in', value: n1(R.tonnes), unit: 't', foot: `${num(R.n)} load${R.n === 1 ? '' : 's'} · ${R.sites} site${R.sites === 1 ? '' : 's'}`, spark: S.map((x) => x.R.tonnes) },
        { label: 'Recovered', value: pct(R.rate), green: true, foot: `${n1(R.recovered)} t of saleable metal`, spark: S.map((x) => x.R.rate) },
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', foot: 'vs making the metal new', spark: S.map((x) => x.R.co2Avoided) },
        { label: 'Trees’ worth of carbon', value: num(R.trees), foot: 'what these trees absorb in 10 years', spark: S.map((x) => x.R.trees) },
      ])
      + C.impactHero(R)
      + C.grid('1.4fr 1fr',
        C.panel({ title: 'Weighed in and recovered', meta: 'tonnes', body: C.chart(S.map((x) => x.b.label), [
          { name: 'Weighed in', values: S.map((x) => x.R.tonnes), tone: 'grey' },
          { name: 'Recovered', values: S.map((x) => x.R.recovered), tone: 'green' }], { unit: 't', height: 250, dp: 1, key: true }) }),
        C.panel({ title: 'Highlights', list: true, flush: true, body: [
          R.recovered ? compareMetal(R.recovered) : '',
          R.co2Avoided ? compareCo2(R.co2Avoided) : '',
          top ? `Biggest carbon saving: <b>${esc(top.name.toLowerCase())}</b>, ${n1(top.avoided)} t CO₂-e avoided.` : '',
          R.domestic ? `<b>${n1(R.domestic)} t</b> supplied to Australian mills, foundries and manufacturers.` : '',
          R.exported ? `<b>${n1(R.exported)} t</b> containerised and exported.` : '',
          R.stock ? `<b>${n1(R.stock)} t</b> processed and in stock awaiting dispatch.` : '',
        ].filter(Boolean).map((h) => C.row({ t: `<span style="font-weight:500">${h}</span>`, cols: '1fr' })).join('') || C.row({ t: 'Nothing to highlight yet.', cols: '1fr' }) }))
      + C.panel({ title: `${WHO_SHORT} vs landfill`, body: C.vsLandfill(R, WHO) })
      + (o.extra || '');
  }

  /* ======================================================================
     PARTNER PORTAL
     ====================================================================== */
  Kit.route('partner/overview', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    return {
      title: 'Overview', sub: `${esc(c.name)} · ${esc(P().label)} · ${P().range}${demoTag(list)}`, demo: false,
      right: periodSelect() + reportBtn('partner-report'),
      html: overviewBody(list, 'partner', {
        extra: C.grid('1.4fr 1fr',
          C.panel({ title: 'Recent loads', link: { href: '#/partner/loads', label: 'All loads' }, flush: true, body: loadsTable(list, 'partner', { limit: 6 }) }),
          C.panel({ title: 'Where the metal went', meta: `${n1(agg(list).recovered)} t`, body: C.split(destParts(agg(list)), { cols: 1 }) })),
      }),
    };
  });

  Kit.route('partner/loads', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    const R = agg(list);
    return {
      title: 'Your loads', sub: `${num(list.length)} loads · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: periodSelect() + C.btn('Export CSV', { icon: 'download', action: 'export-partner' }),
      html: C.kpis([
        { label: 'Loads', value: num(R.n), foot: esc(P().short) },
        { label: 'Weighed in', value: n1(R.tonnes), unit: 't', foot: 'over our weighbridge' },
        { label: 'Recovered', value: pct(R.rate), green: true, foot: `${n1(R.recovered)} t` },
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', foot: `${num(R.trees)} trees’ worth` },
      ]) + C.panel({ title: 'Every load', meta: 'newest first · tap a load for its statement', flush: true, body: loadsTable(list, 'partner') }),
    };
  });
  Kit.action('export-partner', () => exportCsv(myRecords().filter((r) => inPeriod(r)), `${(PT()?.name || 'partner').replace(/\W+/g, '-').toLowerCase()}-loads`));

  function loadPage(id, side) {
    const r = records().find((x) => x.id === id);
    if (!r) return { title: 'Load not found', html: C.note('That load doesn’t exist on this browser (it may have been removed, or demo partners are switched off).') };
    if (side === 'partner') usePartner(r.partner);
    const s = siteById(r.site), c = partnerById(r.partner), S = STREAMS[r.stream];
    const R = agg([r]);
    const o = outcome(r);
    return {
      title: `${S.name} · ${fmtDate(r.date)}`, nav: 'loads', demo: false,
      crumb: `<a href="#/${side}/loads">Loads</a> / ${esc(side === 'corp' ? c.name + ' · ' : '')}${esc(s?.name || '')}`,
      sub: `${esc(siteLabel(s))}${r.docket ? ` · docket ${esc(r.docket)}` : ''}${r.demo ? ' <span class="kit-tag kit-tag--ghost">Demo figures</span>' : ''}`,
      right: reportBtn('load-report', { id: r.id }, 'Load statement') + (side === 'corp' && !r.demo ? C.btn('Remove', { action: 'record-remove', data: { id: r.id, back: '1' } }) : ''),
      html: chainStrip(R)
        + C.kpis([
          { label: 'Weighed in', value: t2(r.t), unit: 't', foot: r.docket ? `docket ${esc(r.docket)}` : 'weighbridge' },
          { label: 'Turned into', value: esc(S.product.split(' (')[0]), foot: esc(S.short) },
          { label: 'Recovered', value: t2(o.recovered), unit: 't', green: true, foot: `${pct(r.t ? o.recovered / r.t : 0)}${o.measured ? ' · weighed out' : ' · usual rate (estimate)'}` },

        + C.grid('1fr 1.2fr',
          `<div class="kit-stack">${C.panel({ title: 'Where it went', body: C.split([...whereParts(R)], { cols: 1 }) + `<p class="kit-muted" style="font-size:13px;margin-top:12px">Recovered metal went to: <b>${esc(DEST[r.dest || 'stock'].name)}</b>.</p>` })}
          ${C.panel({ title: 'What happened to it', body: `<p style="font-size:13px;color:var(--app-text-2);line-height:1.6">${esc(S.path)}.</p>` })}</div>`,
          `<div class="kit-stack">${C.panel({ title: `${WHO_SHORT} vs landfill`, body: C.vsLandfill(R, WHO) })}
          ${C.panel({ title: 'Details', body: C.review([['Partner', esc(c.name)], ['Site', esc(siteLabel(s))], ['Date', fmtDate(r.date)], ['Metal in', esc(S.name)], ['Turned into', esc(S.product)], ['Went to', esc(DEST[r.dest || 'stock'].name)], ['Docket', esc(r.docket || 'n/a')], ...(r.note ? [['Note', esc(r.note)]] : [])]) })}</div>`),
    };
  }
  Kit.route('partner/loads/:id', ({ id }) => loadPage(id, 'partner'));

  Kit.route('partner/journey', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    const R = agg(list);
    return {
      title: 'Where it went', sub: `${esc(c.name)} · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: periodSelect(),

          C.panel({ title: 'Recovered metal: destination', meta: `${n1(R.recovered)} t`, body: C.split(destParts(R), { cols: 1 }) }),
          C.panel({ title: 'Domestic vs export', body: C.stats([['Australian buyers', n1(R.domestic), 't', true], ['Exported', n1(R.exported), 't'], ['In stock', n1(R.stock), 't']], 3)
            + `<p class="kit-muted" style="font-size:13px;margin-top:16px;line-height:1.55">Australian buyers are steel mills, foundries, manufacturers and non-ferrous buyers. Export loads are containerised at our plant and shipped from Victorian ports.</p>` }))
        + C.panel({ title: 'Metal in → product out', flush: true, body: C.table([
          { label: 'Metal in', render: (x) => `<span class="strong">${esc(x.name)}</span>` },
          { label: 'Turned into', render: (x) => esc(STREAMS[x.id].product) },

          { label: 'Residual', num: true, render: (x) => n1(x.landfill) + ' t' },
        ], R.rows, { empty: 'Nothing recorded for this period.' }) }),
    };
  });

  Kit.route('partner/impact', () => {
    const c = PT(); if (!c) return noPartner();

      html: C.impactHero(R)
        + C.panel({ title: `${WHO_SHORT} vs landfill`, body: C.vsLandfill(R, WHO) })
        + C.grid('1.4fr 1fr',
          C.panel({ title: 'By metal', flush: true, body: C.impactTable(R) }),
          C.panel({ title: 'Putting it in perspective', body: C.stats([['Recovered', n1(R.recovered), 't', true], ['Trees’ worth', num(R.trees), '']], 2)
            + `<p class="kit-muted" style="font-size:13px;margin-top:16px;line-height:1.55">${compareMetal(R.recovered) || 'Nothing recorded for this period yet.'}</p>`
            + (R.co2Avoided ? `<p class="kit-muted" style="font-size:13px;margin-top:8px;line-height:1.55">${compareCo2(R.co2Avoided)}</p>` : '')
            + (periodId !== '12m' ? `<div style="margin-top:16px">${C.stats([['Last 12 months', num(all12.trees), 'trees’ worth'], ['', n1(all12.co2Avoided), 't CO₂-e', true]], 2)}</div>` : '') }))
        + C.note('Figures are estimates worked out from the weighed tonnes and published recycling credits. See <a class="kit-green" href="#/partner/method">How it’s worked out</a>.'),
    };

  Kit.route('partner/sites', () => {

    return {

        C.panel({ title: 'Sites', meta: 'tonnes · recovered', flush: true, body: rows.length ? C.rank(rows.map((x) => ({ t: x.s.name, s: `${esc(x.s.city || '')} ${esc(x.s.state || '')} · ${n1(x.R.co2Avoided)} t CO₂-e avoided`, value: x.R.tonnes, v1: `${n1(x.R.tonnes)} t`, v2: pct(x.R.rate), href: `#/partner/sites/${x.s.id}` })), { numbered: true, cols: '1.4fr 1fr 64px 50px' }) : '<div class="kit-empty">No sites yet.</div>' })),
    };
  });

  Kit.route('partner/sites/:id', ({ id }) => {
    const s = siteById(id);
    const c = s && partners().find((x) => x.sites.includes(s));
    if (!s || !c) return { title: 'Site not found', html: '' };
    usePartner(c.id);
    const list = myRecords().filter((r) => r.site === id && inPeriod(r));
    const R = agg(list);
    return {
      title: s.name, nav: 'sites', crumb: `<a href="#/partner/sites">Sites</a> / ${esc(s.state || '')}`, demo: false,
      sub: `${esc(s.city || '')} ${esc(s.state || '')} · ${esc(c.name)} · ${esc(P().label)}${demoTag(list)}`,
      right: periodSelect() + reportBtn('site-report', { site: id }, 'Site statement'),
      html: chainStrip(R)
        + C.grid('1.5fr 1fr',

  /* ======================================================================

  const BALED = { springsteel: 0.55, ferrous: 0.6, aluminium: 0.35 }; // nominal tonnes per bale, demonstration only
  const DISPATCHES = (() => {
    const out = [];
    const R = Kit.rng('globalsteel-dispatch-v1');
    const addDays = (d, n) => { const x = new Date(d); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); if (x.getDay() !== 0 && x.getDay() !== 6) k++; } return x; };
    const days = (a, b) => Math.round((dOf(b) - dOf(a)) / 86400000);
    let seq = 100;
    DEMO_BUYERS.forEach((b) => {
      const recs = DEMO_RECORDS.filter((r) => r.buyer === b.id).sort((x, y) => (x.date < y.date ? -1 : 1));
      let cur = null;
      const flush = () => {
        if (!cur) return;
        seq++;
        const dd = addDays(dOf(cur.last), 1 + Math.floor(R() * 3));
        if (dd > TODAY) { cur = null; return; } // still being accumulated, not dispatched yet
        const date = iso(dd);
        const streams = [...new Set(cur.lines.map((l) => l.r.stream))];
        const bales = cur.lines.reduce((a, l) => a + (BALED[l.r.stream] ? Math.round(l.t / BALED[l.r.stream]) : 0), 0);
        out.push({ id: `DS-${date.slice(2, 4)}${date.slice(5, 7)}-${seq}`, buyer: b.id, date, first: cur.first, last: cur.last, lines: cur.lines, t: cur.t, streams,
          products: streams.map((k) => STREAMS[k].product.split(' (')[0]), bales: bales || null,
          container: b.dest === 'export' ? `DEMU ${String(5000000 + seq * 7).padStart(7, '0')}` : null,
          vehicle: b.dest === 'export' ? 'Container · 40 ft' : (cur.t > 14 ? 'B-double' : 'Semi-trailer'), demo: true });
        cur = null;
      };
      recs.forEach((r) => {
        const o = outcome(r);
        if (cur && (cur.t + o.recovered > b.target * 1.15 || days(cur.first, r.date) > 9)) flush();
        if (!cur) cur = { first: r.date, lines: [], t: 0 };
        cur.lines.push({ r, t: o.recovered });
        cur.t += o.recovered; cur.last = r.date;
      });
      flush();
    });
    return out.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  })();
  const dispatches = () => (showDemo() ? DISPATCHES : []);
  const myDispatches = (b = BY()) => (b ? dispatches().filter((d) => d.buyer === b.id) : []);
  const dispatchById = (id) => dispatches().find((d) => d.id === id);

  const noBuyer = () => ({ title: 'Buyer portal', html: C.note('The buyer portal shows the five demonstration buyers. Switch demonstration data back on under <a class="kit-green" href="#/corp/data">Corporate → Data &amp; backup</a> to see it. Accounts for your own buyers come with the next version.') });

  /* aggregate a set of dispatches by product and by origin class */
  function aggD(list) {
    const byStream = {}, byOrigin = {};
    let t = 0, n = 0, bales = 0, containers = 0;
    list.forEach((d) => {
      n++; t += d.t; bales += d.bales || 0; if (d.container) containers++;
      d.lines.forEach((l) => {
        const v = byStream[l.r.stream] || (byStream[l.r.stream] = { t: 0, n: 0 });
        v.t += l.t; v.n++;
        const c = partnerById(l.r.partner);
        const o = ORIGIN[c?.type] || 'post-consumer';
        byOrigin[o] = (byOrigin[o] || 0) + l.t;
      });
    });
    const recs = list.flatMap((d) => d.lines.map((l) => l.r));
    const R = recs.length ? agg(recs) : null;
    return { n, t, bales, containers, byStream, byOrigin, R, loads: recs.length,
      rows: Object.entries(byStream).map(([k, v]) => ({ k, S: STREAMS[k], ...v })).sort((a, b) => b.t - a.t) };
  }

      ${b && b.dest === 'aumill' ? '<li><b>Carbon:</b> scrap-based EAF steel averages 0.70 t CO₂ per tonne of crude steel against 2.32 t for blast-furnace steel (World Steel Association, 2023 data). The mill’s own EPD governs its product; Recycled documents the scrap side.</li>' : ''}

        + C.grid('1fr 1fr',
          C.panel({ title: '2 · Turned into  →  3 · Recovered', body: `<div class="kit-entry"><p class="kit-muted" style="font-size:13px"><b>${esc(S.product)}</b>: ${esc(S.path)}.</p>
            ${C.pick('rec-mode', [['usual', 'Usual recovery', `${pct(M.recovery)} (marked as an estimate)`], ['weighed', 'Weighed out', 'enter the output weight']], form.mode, { big: true })}
            ${form.mode === 'weighed' ? `<div class="kit-steps">${C.stepper('', form.out, { label: 'Recovered metal', unit: 't', step: 0.1, big: true, attr: 'data-form="out"' })}</div><p class="kit-muted" style="font-size:12.5px">The rest is residual. <b class="kit-warn" data-live="warn"></b></p>` : ''}
          </div>` }),
          C.panel({ title: '4 · Where it went', body: `<div class="kit-entry">${C.pick('rec-dest', DK.map((k) => [k, DEST[k].name]), form.dest)}<p class="kit-muted" style="font-size:12.5px">Choose “In stock” if the load is processed but not yet dispatched. Update it later from the load’s page.</p></div>` }))
        + C.panel({ body: `<div class="kit-entry">
            <div class="kit-toolbar">${field('Docket / reference', `<input class="rgc-input" type="text" value="${esc(form.docket)}" placeholder="e.g. WB-10442" data-form="docket">`)}${field('Note (optional)', `<input class="rgc-input" type="text" value="${esc(form.note)}" placeholder="Shown on the load" data-form="note">`)}</div>
            <div class="kit-entry__bar">
              <span class="kit-entry__meta grow"><span><b data-live="t">0</b> t in</span><span><b data-live="rec">0%</b> recovered</span><span><b data-live="co2">0</b> t CO₂-e avoided</span><span><b data-live="trees">0</b> trees’ worth</span></span>
              <button type="button" class="rgc-btn" data-action="form-clear">Clear</button>
              <button type="button" class="rgc-btn rgc-btn--primary kit-bigbtn" data-action="record-save">${icon('check', 16)} Save load</button>

      after: () => livePreview(),

  const onForm = (e) => {

  document.addEventListener('change', onForm);
  Kit.action('pick:rec-partner', (v) => { form.partner = v; form.site = ''; fixForm(); saveForm(); Kit.refresh(); });
  Kit.action('select:rec-partner', (v) => { form.partner = v; form.site = ''; fixForm(); saveForm(); Kit.refresh(); });
  Kit.action('select:rec-site', (v) => { form.site = v; saveForm(); });
  Kit.action('pick:rec-stream', (v) => { form.stream = v; saveForm(); Kit.refresh(); });
  Kit.action('pick:rec-mode', (v) => { form.mode = v; saveForm(); Kit.refresh(); });
  Kit.action('pick:rec-dest', (v) => { form.dest = v; saveForm(); });
  Kit.action('form-clear', () => { Object.assign(form, { t: '', out: '', docket: '', note: '' }); saveForm(); Kit.refresh(); });
  const newId = () => 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  Kit.action('record-save', () => {
    fixForm();
    const r = formRecord();
    if (!r.partner || !r.site) { Kit.toast('Choose a partner and site first.'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date)) { Kit.toast('Enter the date.'); return; }

  });
  let removeArm = '';
  Kit.action('record-remove', (btn) => {

    if (removeArm !== id) { removeArm = id; btn.textContent = 'Tap again to remove'; setTimeout(() => { if (removeArm === id) removeArm = ''; }, 4000); return; }
    removeArm = '';
    data.records = data.records.filter((r) => r.id !== id); save();
    if (btn.dataset.back) Kit.go('#/corp/loads');
    Kit.refresh(); Kit.toast('Load removed.');
  });

  /* paste a weighbridge list */
  let pending = [];
  let autoCreate = store.get(KEY + ':auto-create', true);
  const MAT_ALIAS = [['springsteel', /spring|mattress/], ['cable', /cable|wire|lead/], ['copper', /copper|\bcu\b/], ['aluminium', /alumin|\bal\b/], ['brass', /brass/], ['stainless', /stainless|\bss\b/], ['mixed', /mixed|e-?waste|appliance|whitegood/], ['ferrous', /ferrous|steel|iron|scrap|metal/]];
  const matchStream = (v) => { const s = String(v || '').toLowerCase(); const hit = SK.find((k) => k === s || STREAMS[k].name.toLowerCase() === s) || (MAT_ALIAS.find(([, re]) => re.test(s)) || [])[0]; return hit || null; };
  const matchDest = (v) => { const s = String(v || '').toLowerCase(); if (!s) return null; if (/export|container|ship/.test(s)) return 'export'; if (/foundry/.test(s)) return 'aufoundry'; if (/manufact/.test(s)) return 'aumfr'; if (/non|copper|alumin|nf/.test(s)) return 'aunf'; if (/stock|held|yard/.test(s)) return 'stock'; if (/mill|steel|au/.test(s)) return 'aumill'; return null; };
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function parseDate(v) {
    const s = String(v || '').trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(new Date(+m[1], m[2] - 1, +m[3]));
    if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/))) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return iso(new Date(y, m[2] - 1, +m[1])); }
    if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{2,4})$/)) && MON[m[2].toLowerCase()]) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return iso(new Date(y, MON[m[2].toLowerCase()] - 1, +m[1])); }
    return null;
  }
  const COLS = { date: /date|day/, partner: /partner|client|customer|supplier|account/, site: /site|location|address|branch|yard/, stream: /metal|material|stream|product|type/, t: /tonne|weight|net|gross|kg|\bin\b|\bt\b/, out: /recovered|out|output|yield/, dest: /dest|went|buyer|sold|to$/, docket: /docket|ticket|ref|weighbridge|wb/, city: /city|suburb|town/, state: /state/ };
  function parsePaste(text) {
    const rows = Kit.parseTable(text);
    if (!rows.length) return [];
    const head = rows[0].map((h) => String(h).toLowerCase());
    const hasHead = !parseDate(rows[0][0]) && head.some((h) => /date|partner|client|metal|tonne|weight/.test(h));
    const idx = {};
    if (hasHead) {
      const used = new Set();
      ['out', 'docket', 'date', 'partner', 'site', 'stream', 'dest', 't', 'city', 'state'].forEach((k) => { const i = head.findIndex((h, j) => !used.has(j) && COLS[k].test(h)); if (i >= 0) { idx[k] = i; used.add(i); } });
    } else Object.assign(idx, { date: 0, partner: 1, site: 2, stream: 3, t: 4, out: 5, dest: 6, docket: 7 });
    const kg = hasHead && idx.t != null && /kg/.test(head[idx.t]);
    const cell = (r, k) => (idx[k] != null ? String(r[idx[k]] ?? '').trim() : '');
    return rows.slice(hasHead ? 1 : 0).map((r, n) => {
      const out = { line: n + 1 + (hasHead ? 1 : 0), raw: r, problems: [] };
      out.date = parseDate(cell(r, 'date'));
      if (!out.date) out.problems.push('date');
      const cname = cell(r, 'partner');
      const cl = partners().find((c) => c.name.toLowerCase() === cname.toLowerCase()) || (cname.length > 3 ? partners().find((c) => c.name.toLowerCase().includes(cname.toLowerCase())) : null);
      out.partnerName = cl ? cl.name : cname; out.partnerId = cl?.id || null;
      if (!cname) out.problems.push('partner'); else if (!cl && !autoCreate) out.problems.push('unknown partner');
      const sname = cell(r, 'site');
      const st = cl ? cl.sites.find((s) => s.name.toLowerCase() === sname.toLowerCase()) || (sname ? cl.sites.find((s) => s.name.toLowerCase().includes(sname.toLowerCase())) : cl.sites.length === 1 ? cl.sites[0] : null) : null;
      out.siteName = st ? st.name : sname || 'Main site'; out.siteId = st?.id || null;
      out.city = cell(r, 'city'); out.state = cell(r, 'state').toUpperCase();

      out.stream = matchStream(cell(r, 'stream'));
      if (!out.stream) out.problems.push('metal');
      let t = Kit.numberFrom(cell(r, 't'));
      if (t != null && kg) t /= 1000;
      out.t = t;
      if (!(t > 0)) out.problems.push('tonnes');
      let o = Kit.numberFrom(cell(r, 'out'));
      if (o != null && kg) o /= 1000;
      out.out = o != null ? o : null;
      if (out.out != null && t > 0 && out.out > t + 1e-9) out.problems.push('recovered > in');
      out.dest = matchDest(cell(r, 'dest')) || 'aumill';
      out.docket = cell(r, 'docket');
      return out;

      + C.panel({ title: 'Load a spreadsheet', body: `<p class="kit-muted" style="font-size:13px;margin-bottom:10px;line-height:1.55">A CSV with headings <b>Date, Partner, Site, Metal, Tonnes</b> (plus optional Recovered t, Went to, Docket, City, State), the same layout Export CSV produces. Rows are checked on <b>Record a load → Paste</b> before anything is added.</p><label class="rgc-btn" style="cursor:pointer">${icon('upload', 15)} Choose CSV<input type="file" accept=".csv,text/csv" data-file="records-csv" hidden></label>` }),
  }));
  Kit.action('toggle:show-demo', (on) => { data.hideDemo = !on; save(); Kit.refresh(); });
  Kit.action('file:records-csv', (file) => file && file.text().then((txt) => { pending = parsePaste(txt); Kit.go('#/corp/record?tab=paste'); setTimeout(() => Kit.toast(`${pending.length} rows read. Check them, then add.`), 60); }));
  function exportCsv(list, name) {
    if (!list.length) { Kit.toast('Nothing to export for this period.'); return; }
    const rows = [['Date', 'Partner', 'Site', 'City', 'State', 'Metal', 'Turned into', 'Tonnes', 'Recovered t', 'Residual t', 'Recovered %', 'Went to', 'CO2-e avoided t', 'Docket', 'Output', 'Demo']];
    list.forEach((r) => {
      const c = partnerById(r.partner), s = siteById(r.site), o = outcome(r), R = agg([r]);
      rows.push([r.date, c?.name || '', s?.name || '', s?.city || '', s?.state || '', STREAMS[r.stream].name, STREAMS[r.stream].product, r.t, +o.recovered.toFixed(3), +o.residual.toFixed(3), Math.round(R.rate * 100), DEST[r.dest || 'stock'].name, +R.co2Avoided.toFixed(3), r.docket || '', o.measured ? 'weighed' : 'usual', r.demo ? 'demo' : '']);
    });
    Kit.download(`${name}-${iso(new Date())}.csv`, Kit.csv(rows), 'text/csv');
  }
  Kit.action('export-everything', () => exportCsv(records(), 'global-steel-all'));
  Kit.route('corp/factors', () => ({
    title: 'Factors', demo: false, sub: 'Usual recovery rates and the published recycling credits behind every figure',
    html: C.factorsPage(WHO).replace('<b>Recycled assumptions</b> (weights, recovery rates)', '<b>Usual recovery rates</b> are Recycled’ operating assumptions, used only when a load’s own output weight isn’t recorded. They'),
    after: (el) => { const m = el.querySelector('.kit-method'); if (m) m.outerHTML = Kit.reportMethodBlock(WHO).html; },
  }));

  /* ======================================================================
     STATEMENTS (A4 → PDF)
     ====================================================================== */
  const nowText = () => new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  const fileBit = (s) => String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  function recoveryReport(o) {
    const list = o.list;
    const R = agg(list);
    const p = o.period;
    const S = seriesOf(list, p);
    const anyDemo = list.some((r) => r.demo) || o.demoPartner;
    const siteRows = o.sites ? o.sites.map((s) => ({ s, R: agg(list.filter((r) => r.site === s.id)) })).filter((x) => x.R.n).sort((a, b) => b.R.tonnes - a.R.tonnes) : [];
    const blocks = [
      ...Kit.reportImpactBlocks(R, WHO),
      { title: 'Where the recovered metal went', meta: `${n1(R.recovered)} t`, html: C.split(destParts(R), { cols: 3 }) },
      { title: 'Weighed in and recovered', meta: 'tonnes', html: C.chart(S.map((x) => x.b.label), [{ name: 'Weighed in', values: S.map((x) => x.R.tonnes), tone: 'grey' }, { name: 'Recovered', values: S.map((x) => x.R.recovered), tone: 'green' }], { unit: 't', height: 220, dp: 1, key: true }) },
    ];
    if (o.byPartner) blocks.push({ title: 'By partner', table: { cols: [
      { label: 'Partner', render: (x) => `<span class="strong">${esc(x.c.name)}</span>` },
      { label: 'Loads', num: true, render: (x) => num(x.R.n) },
      { label: 'Weighed in', num: true, render: (x) => n1(x.R.tonnes) + ' t' },
      { label: 'Recovered', num: true, render: (x) => pct(x.R.rate) },
      { label: 'CO₂-e avoided', num: true, render: (x) => `${n1(x.R.co2Avoided)} t` },
    ], rows: o.byPartner.map((c) => ({ c, R: agg(list.filter((r) => r.partner === c.id)) })).filter((x) => x.R.n).sort((a, b) => b.R.tonnes - a.R.tonnes), foot: ['Total', num(R.n), n1(R.tonnes) + ' t', pct(R.rate), `${n1(R.co2Avoided)} t`] } });
    if (siteRows.length > 1) blocks.push({ title: 'By site', table: { cols: [
      { label: 'Site', render: (x) => `<span class="strong">${esc(x.s.name)}</span> <span class="dim">${esc(x.s.city || '')} ${esc(x.s.state || '')}</span>` },
      { label: 'Loads', num: true, render: (x) => num(x.R.n) },
      { label: 'Weighed in', num: true, render: (x) => n1(x.R.tonnes) + ' t' },
      { label: 'Recovered', num: true, render: (x) => pct(x.R.rate) },
      { label: 'CO₂-e avoided', num: true, render: (x) => `${n1(x.R.co2Avoided)} t` },
    ], rows: siteRows } });
    if (o.listLoads) blocks.push({ title: 'Loads', meta: `${num(list.length)} in this period`, table: { cols: [
      { label: 'Date', render: (r) => `<span style="white-space:nowrap">${dOf(r.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: '2-digit' })}</span>` },
      ...(o.sites && o.sites.length > 1 ? [{ label: 'Site', render: (r) => esc(siteById(r.site)?.name || '') }] : []),
      { label: 'Metal in', render: (r) => esc(STREAMS[r.stream].short) },
      { label: 'In', num: true, render: (r) => t2(r.t) },
      { label: 'Out', num: true, render: (r) => { const x = outcome(r); return t2(x.recovered) + (x.measured ? '' : '<span class="dim">*</span>'); } },
      { label: 'Went to', render: (r) => esc(DEST[r.dest || 'stock'].short) },
      { label: 'Docket', render: (r) => `<span class="dim" style="white-space:nowrap">${esc(r.docket || '')}</span>` },
    ], rows: [...list].sort((a, b) => (a.date < b.date ? -1 : 1)), empty: 'No loads in this period.' } });
    blocks.push(Kit.reportMethodBlock(WHO));
    Kit.report({
      title: o.title, kicker: o.kicker || 'Recovery statement',
      subtitle: 'Every load weighed in, what it was turned into, how much metal was recovered, where it went, and the carbon that saved.',
      org: o.org, period: `${p.short} · ${p.range}`, prepared: `Prepared by Recycled · ${nowText()}`,
      logo: ASSETS.logo, logoDark: ASSETS.logoDark, logoH: 28,
      filename: `${fileBit(o.file)}-recovery-${fileBit(p.short)}`,
      demo: anyDemo ? 'Demonstration figures' : false,
      meta: [...(o.meta || []), ['Loads', num(R.n)], ['Weighed in', `${n1(R.tonnes)} t`]],
      hero: [
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', note: 'by not making the metal new from ore' },
        { label: 'Metal recovered', value: n1(R.recovered), unit: 't', note: `${pct(R.rate)} of ${n1(R.tonnes)} t weighed in` },
        { label: 'Trees’ worth of carbon', value: num(R.trees), note: 'CO₂-e avoided ÷ what one tree absorbs in 10 years' },
      ],
      compare: compareMetal(R.recovered) + ' ' + compareCo2(R.co2Avoided),
      blocks,
    });
  }
  const periodFrom = (btn) => periodById[btn?.dataset?.period] || P();
  Kit.action('partner-report', (btn) => {
    const c = partnerById(btn.dataset.partner) || PT();
    if (!c) { Kit.toast('No partner to report on.'); return; }
    const p = periodFrom(btn);
    recoveryReport({ title: `${c.name}: Recovery statement`, org: c.name, file: c.name, period: p, demoPartner: c.demo,
      list: records().filter((r) => r.partner === c.id && inPeriod(r, p)), sites: c.sites, listLoads: true,
      meta: [['Partner', c.name], ['Sites', String(c.sites.length)]] });
  });
  Kit.action('site-report', (btn) => {
    const s = siteById(btn.dataset.site);
    const c = s && [...DEMO_PARTNERS, ...data.partners].find((x) => x.sites.includes(s));
    if (!s || !c) { Kit.toast('Site not found.'); return; }
    const p = periodFrom(btn);
    recoveryReport({ title: `${s.name}: Site recovery statement`, kicker: 'Site recovery statement', org: `${c.name} · ${s.name}`, file: `${c.name}-${s.name}`, period: p, demoPartner: c.demo,
      list: records().filter((r) => r.site === s.id && inPeriod(r, p)), sites: [s], listLoads: true,
      meta: [['Partner', c.name], ['Site', `${s.name}${s.city ? ', ' + s.city : ''}${s.state ? ' ' + s.state : ''}`]] });
  });
  Kit.action('group-report', (btn) => {
    const p = periodFrom(btn);
    const cl = partners();
    recoveryReport({ title: 'Recycled: Group report', kicker: 'Group recovery report', org: WHO, file: 'Recycled', period: p,
      list: records().filter((r) => inPeriod(r, p)), byPartner: cl, demoPartner: showDemo(),
      meta: [['Partners', String(cl.length)], ['Sites', String(cl.reduce((a, c) => a + c.sites.length, 0))]] });
  });
  Kit.action('load-report', (btn) => {
    const r = records().find((x) => x.id === btn.dataset.id);
    if (!r) return;
    const c = partnerById(r.partner), s = siteById(r.site), R = agg([r]), o = outcome(r), S = STREAMS[r.stream];
    Kit.report({
      title: 'Load statement', noCover: true, org: `${c.name} · Recycled`, period: `${fmtDate(r.date)}${r.docket ? ' · ' + r.docket : ''}`,
      prepared: `Prepared ${nowText()}`, logo: ASSETS.logo, logoDark: ASSETS.logoDark, logoH: 28, filename: `${fileBit(c.name)}-load-${r.date}${r.docket ? '-' + fileBit(r.docket) : ''}`,
      demo: r.demo ? 'Demonstration figures' : false,
      blocks: [
        { title: 'Weighed in → turned into → recovered → saving', html: chainStrip(R) },
        { title: 'The load', html: C.review([['Partner', esc(c.name)], ['Site', esc(siteLabel(s))], ['Date', fmtDate(r.date)], ['Docket', esc(r.docket || 'n/a')], ['Metal in', esc(S.name)], ['Weighed in', `${t2(r.t)} t`], ['Turned into', esc(S.product)], ['Recovered', `${t2(o.recovered)} t (${pct(r.t ? o.recovered / r.t : 0)})${o.measured ? ' · weighed out' : ' · usual rate, estimate'}`], ['Residual', `${t2(o.residual)} t`], ['Went to', esc(DEST[r.dest || 'stock'].name)]]) },
        { title: 'The difference it made', html: C.impactHero(R) },
        { title: `${WHO_SHORT} vs landfill`, html: C.vsLandfill(R, WHO) },
        { title: 'What happened to it', html: `<p style="font-size:13px;line-height:1.6">${esc(S.path)}.</p>` },
        Kit.reportMethodBlock(WHO),
      ],
    });
  });
})();

</script>
</body>
</html>
